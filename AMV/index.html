<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AMV - Duelo de Cartas</title>
<style>
:root{--red:#e60012;--gold:#ffd400;--green:#2ee66b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050505;overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;background:#000;overflow:hidden}
#board,#screen{position:absolute;inset:0}
#board{z-index:1}
#screen{z-index:5}
#screen:empty{display:none}
#modal{position:absolute;inset:0;z-index:10;display:none;background:rgba(0,0,0,.86);align-items:center;justify-content:center;flex-direction:column}
#modal.on{display:flex}
#banner{position:absolute;left:0;right:0;top:880px;height:160px;z-index:20;display:none;align-items:center;justify-content:center;
  background:linear-gradient(90deg,transparent,rgba(230,0,18,.92),transparent);font-size:84px;font-weight:900;letter-spacing:4px;text-shadow:0 4px 0 #000}
#banner.on{display:flex;animation:ban .9s ease both}
@keyframes ban{0%{opacity:0;transform:scaleY(.2)}20%{opacity:1;transform:scaleY(1)}85%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;bottom:340px;transform:translateX(-50%);z-index:30;background:#000c;border:3px solid #fff;border-radius:16px;padding:16px 30px;font-size:38px;display:none}
#toast.on{display:block}

/* zones */
.zone{position:absolute;border:8px solid #fff;background:#000;color:var(--red);font-weight:800;text-align:center;
  display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1.05;padding:4px}
.zone.small{font-size:26px}
.zone.cand{box-shadow:0 0 0 7px var(--gold),0 0 40px 10px var(--gold);animation:pulse .8s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 7px #fff,0 0 60px 18px var(--gold)}}
.card{position:absolute;inset:-8px;border-radius:12px;background-size:100% 100%;background-position:center;background-color:#222;overflow:hidden;cursor:pointer;transition:transform .25s,opacity .25s}
.card.dim{opacity:.55}
.card.cand{box-shadow:0 0 0 7px var(--gold),0 0 40px 10px var(--gold);animation:pulse .8s infinite alternate;z-index:3}
.card.lungeUp{transform:translateY(-70px) scale(1.08);z-index:5}
.card.lungeDown{transform:translateY(70px) scale(1.08);z-index:5}
.card.hit{animation:hit .5s}
@keyframes hit{0%,100%{filter:none}25%{filter:brightness(3) saturate(0)}50%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
.back{background-color:#101418;background-image:repeating-linear-gradient(45deg,#14181d 0 16px,#1d232a 16px 32px);border:6px solid #cdd5df}
.back::after{content:"AMV";position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:var(--red);border:5px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:34px;color:#fff}
.hasback .back{background-image:var(--backimg);background-size:100% 100%;border:0}
.hasback .back::after{display:none}
.chip{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;background:#000d;border:3px solid #fff;border-radius:10px;padding:2px 12px;font-size:32px;font-weight:900;white-space:nowrap}
.chip.up{border-color:var(--green);color:var(--green)}
.chip.tag{bottom:auto;top:6px;font-size:24px;border-color:var(--red);color:#fff;background:#b00010}
.chip.tag2{bottom:auto;top:46px;font-size:24px;border-color:var(--gold);color:var(--gold)}
.badge{position:absolute;right:-6px;top:-6px;min-width:44px;height:44px;border-radius:22px;background:var(--red);border:3px solid #fff;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:2}
.hand{position:absolute;width:190px;height:266px}
.hand .card{inset:0}
.hand.playable .card{box-shadow:0 0 0 5px var(--green),0 0 22px var(--green)}

/* hud */
.lifebox{position:absolute;top:924px;height:84px;width:330px;font-weight:900}
.lifebox .nm{font-size:26px;letter-spacing:2px;color:#ccc;position:absolute;top:0}
.lifebox .num{font-size:50px;position:absolute;right:0;top:-10px}
.lifebox .bar{position:absolute;left:0;right:0;bottom:6px;height:22px;background:#333;border:3px solid #fff;border-radius:12px;overflow:hidden}
.lifebox .bar i{display:block;height:100%;background:linear-gradient(90deg,#b00010,#ff3b30);transition:width .5s}
.lifebox.flash .num{animation:fl .6s}
@keyframes fl{50%{color:var(--red);transform:scale(1.3)}}
#msg{position:absolute;left:20px;right:20px;top:218px;height:112px;border:3px solid #444;border-radius:16px;background:#0b0b0b;padding:8px 18px;
  font-size:30px;line-height:1.2;color:#ddd;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
#msg .l:last-child{color:#fff;font-weight:700}
#msg .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg.pick{border-color:var(--gold);flex-direction:row;align-items:center;gap:14px}
#msg.pick .t{flex:1;font-size:30px;font-weight:700;color:var(--gold);line-height:1.15}
.btn{font-family:inherit;font-weight:800;color:#fff;background:var(--red);border:4px solid #fff;border-radius:20px;font-size:42px;padding:16px 30px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.sec{background:#2a2a2a}
.btn.sm{font-size:30px;padding:10px 18px;border-radius:14px}
.btn[disabled]{opacity:.35;pointer-events:none}
#endbtn{position:absolute;left:395px;top:927px;width:290px;height:78px;font-size:34px;padding:0}
#menubtn{position:absolute;left:10px;top:10px;width:84px;height:84px;font-size:46px;padding:0;z-index:4}

/* screens */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:60px 40px;background:radial-gradient(ellipse at 50% 30%,#2a0006 0,#000 70%)}
.scr h1{font-size:150px;margin:40px 0 0;letter-spacing:10px;color:var(--red);text-shadow:0 6px 0 #fff;font-weight:900}
.scr h2{font-size:54px;margin:0 0 30px;font-weight:700;letter-spacing:6px;color:#fff}
.scr .row{display:flex;gap:30px}
.menu{display:flex;flex-direction:column;gap:30px;width:760px;margin-top:40px}
.menu .btn{font-size:50px;padding:30px}
.fan{position:relative;width:1000px;height:520px;margin-top:40px}
.fan div{position:absolute;width:300px;height:420px;border-radius:14px;background-size:100% 100%;box-shadow:0 20px 40px #000}
.rpsb{font-size:130px;width:300px;height:300px;padding:0}
.big{font-size:60px;font-weight:800;text-align:center;margin:30px}
.grid{display:grid;grid-template-columns:repeat(3,320px);gap:14px 30px;margin-top:10px}
.tile{display:flex;flex-direction:column;align-items:center}
.tile .im{width:280px;height:392px;border-radius:12px;background-size:100% 100%;cursor:pointer}
.tile .ctl{display:flex;align-items:center;gap:20px;height:76px}
.tile .ctl b{font-size:48px;min-width:44px;text-align:center}
.tile .ctl .btn{width:76px;height:64px;padding:0;font-size:44px;border-radius:14px}

/* modal bits */
.mbox{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:1000px}
.mbox .bigcard{width:480px;height:672px;border-radius:16px;background-size:100% 100%;box-shadow:0 0 50px #000}
.acts{display:flex;flex-direction:column;gap:12px;width:760px}
.acts .btn{font-size:40px;padding:14px}
.why{font-size:27px;color:#ffb347;text-align:center;margin-top:-6px}
.list{display:grid;grid-template-columns:repeat(4,220px);gap:16px;max-height:1300px;overflow:auto;padding:10px}
.list .c{width:220px;height:308px;border-radius:10px;background-size:100% 100%;cursor:pointer;position:relative}
.rules{font-size:32px;line-height:1.35;text-align:left;width:900px;max-height:1450px;overflow:auto;background:#0d0d0d;border:3px solid #444;border-radius:20px;padding:26px 36px}
.rules h3{margin:14px 0 6px;color:var(--red);font-size:38px}
.rules li{margin:4px 0}
.float{position:absolute;z-index:25;font-size:84px;font-weight:900;color:#ff3b30;text-shadow:0 5px 0 #000,0 0 20px #000;pointer-events:none;animation:flt 1.2s ease-out both}
.float.heal{color:var(--green)}
@keyframes flt{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-140px)}}
</style>
</head>
<body>
<div id="stage">
  <div id="board"></div>
  <div id="screen"></div>
  <div id="modal"></div>
  <div id="banner"></div>
  <div id="toast"></div>
</div>

<script>
(() => {
'use strict';
/* ============================================================
   CONFIGURAÇÃO (fácil de mexer quando suas regras chegarem)
   ============================================================ */
const MAX_LIFE = 4000;     // vida inicial e máxima
const DECK_MIN = 20, DECK_MAX = 30, COPY_MAX = 3;
const HAND_START = 5;      // cartas iniciais
const BOT_DECK = {1:3,2:3,3:3,4:3,5:3,6:3,7:3,8:3,9:3};   // baralho do bot

const DEFS = {
  1:{id:1,name:'Goku - Guerreiros Z',kind:'char',atk:1500,img:'Cartas/1.png'},
  2:{id:2,name:'Gohan - Guerreiros Z',kind:'char',atk:800,img:'Cartas/2.png'},
  3:{id:3,name:'Piccolo - Guerreiros Z',kind:'char',atk:1400,img:'Cartas/3.png'},
  4:{id:4,name:'Casa do Kame',kind:'field',img:'Cartas/4.png'},
  5:{id:5,name:'Yajirobe',kind:'support',img:'Cartas/5.png'},
  6:{id:6,name:'Semente dos deuses',kind:'item',img:'Cartas/6.png'},
  7:{id:7,name:'Disparo de Ki',kind:'item',img:'Cartas/7.png'},
  8:{id:8,name:'Caminho da serpente',kind:'item',img:'Cartas/8.png'},
  9:{id:9,name:'Kaioken',kind:'tool',img:'Cartas/9.png'}
};
const KIND = {char:'Personagem',field:'Campo',support:'Apoiador',item:'Item',tool:'Ferramenta'};

/* posições (extraídas do esboço 1080x1920) */
const CHAR_W=215, CHAR_H=301, PW=182, PH=254, SW=112, SH=157;
const POS = {
  1:{ chars:[[182,616],[432,616],[682,616]], powers:[[237,341],[448,341],[659,341]],
      deck:[34,418], void:[34,617], field:[932,687] },
  0:{ chars:[[182,1012],[432,1012],[682,1012]], powers:[[238,1333],[449,1333],[660,1333]],
      deck:[932,1354], void:[932,1154], field:[34,1084] }
};

/* ============================================================
   UTIL
   ============================================================ */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function btn(label, cls, fn){ const b=el('button','btn '+(cls||''),label); b.addEventListener('click',fn); return b; }
let uidN = 1;
const mk = id => ({uid:uidN++, id, def:DEFS[id], attacked:false, direct:false, used:false, equip:null, equipTo:null});

function fitStage(){
  const s = Math.min(innerWidth/1080, innerHeight/1920);
  $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fitStage); fitStage();

/* verso opcional: se existir Cartas/verso.png ele é usado */
(() => { const im=new Image(); im.onload=()=>{document.documentElement.style.setProperty('--backimg','url("Cartas/verso.png")');document.body.classList.add('hasback');}; im.src='Cartas/verso.png'; })();
Object.values(DEFS).forEach(d => { const i=new Image(); i.src=d.img; });

/* ============================================================
   ESTADO
   ============================================================ */
let G = null;
const P = p => G.p[p];
const freeIdx = a => a.indexOf(null);
const chars = p => P(p).chars.filter(Boolean);
const supports = p => P(p).powers.filter(c => c && c.def.kind==='support');

function newPlayer(counts){
  const ids=[]; for(const id in counts) for(let i=0;i<counts[id];i++) ids.push(+id);
  return {life:MAX_LIFE, deck:shuffle(ids.map(mk)), hand:[], chars:[null,null,null], powers:[null,null,null], field:null, void:[], turns:0};
}
function atkOf(p, inst){
  let a = inst.def.atk;
  if(inst.id===1) a += 500 * P(p).void.filter(c=>c.def.kind==='char').length;   // Goku: +500 por Guerreiro Z no vazio
  if(inst.equip) a += 1000;                                                      // Kaioken
  return a;
}
function canAttack(p){ return !(p===G.first && P(p).turns===1); }   // quem começa não ataca no 1º turno

function detach(pl, inst){
  let i;
  if((i=pl.hand.indexOf(inst))>=0) pl.hand.splice(i,1);
  else if((i=pl.deck.indexOf(inst))>=0) pl.deck.splice(i,1);
  else if((i=pl.void.indexOf(inst))>=0) pl.void.splice(i,1);
  else if((i=pl.chars.indexOf(inst))>=0) pl.chars[i]=null;
  else if((i=pl.powers.indexOf(inst))>=0) pl.powers[i]=null;
  else if(pl.field===inst) pl.field=null;
}
function toVoid(pl, inst){
  detach(pl, inst);
  if(inst.equip){ const k=inst.equip; inst.equip=null; k.equipTo=null; detach(pl,k); pl.void.push(k); }
  if(inst.equipTo){ inst.equipTo.equip=null; inst.equipTo=null; }
  inst.direct=false; inst.attacked=false;
  pl.void.push(inst);
}
function log(m){ G.log.push(m); if(G.log.length>40) G.log.shift(); }

/* ============================================================
   AÇÕES (usadas pelo jogador e pelo bot)
   ============================================================ */
const A = {
  summon(p, c){ const pl=P(p); detach(pl,c); pl.chars[freeIdx(pl.chars)]=c; log(`${p?'Oponente invoca':'Você invoca'} ${c.def.name}.`); },
  field(p, c){ const pl=P(p); detach(pl,c); if(pl.field) toVoid(pl,pl.field); pl.field=c; log(`${p?'Oponente ativa':'Você ativa'} ${c.def.name}.`); },
  support(p, c){ const pl=P(p); detach(pl,c); pl.powers[freeIdx(pl.powers)]=c; log(`${p?'Oponente coloca':'Você coloca'} ${c.def.name} em campo.`); },
  tool(p, c, goku){ const pl=P(p); detach(pl,c); pl.powers[freeIdx(pl.powers)]=c; c.equipTo=goku; goku.equip=c; log(`${p?'Oponente equipa':'Você equipa'} Kaioken em Goku (+1000 ATQ).`); },
  semente(p, c){ const pl=P(p); toVoid(pl,c); pl.life=MAX_LIFE; log(`${p?'Oponente cura':'Você cura'} toda a vida (${MAX_LIFE}).`); fxFloat(p,'+'+MAX_LIFE,true); },
  disparo(p, c, t){ toVoid(P(p),c); toVoid(P(1-p),t); log(`Disparo de Ki destrói ${t.def.name}!`); },
  caminho(p, c){ const pl=P(p); const g=pl.void.find(x=>x.id===1); detach(pl,g); pl.chars[freeIdx(pl.chars)]=g; toVoid(pl,c); log(`${p?'Oponente traz':'Você traz'} Goku de volta ao campo!`); },
  casa(p, chosen){ const pl=P(p); pl.field.used=true; detach(pl,chosen); pl.hand.push(chosen); shuffle(pl.deck); log(`${p?'Oponente busca':'Você busca'} ${p?'um Guerreiro Z':chosen.def.name} com a Casa do Kame.`); },
  yaji(p, c){ const pl=P(p); const ch=chars(p)[0]; ch.direct=true; toVoid(pl,c); log(`Yajirobe! ${ch.def.name} pode atacar diretamente.`); },
  picc(p, picc){ const pl=P(p); const g=chars(p).find(x=>x.id===1); toVoid(pl,g); picc.direct=true; picc.used=true; log(`Piccolo envia Goku ao vazio e pode atacar diretamente.`); }
};

/* ============================================================
   COMBATE
   ============================================================ */
async function doAttack(p, att, tgt){
  const q=1-p, a=atkOf(p,att);
  att.attacked = true;
  log(`${att.def.name} (${a}) ataca ${tgt?tgt.def.name+' ('+atkOf(q,tgt)+')':'diretamente'}!`);
  render();
  await lunge(att.uid, p);
  if(!tgt){
    await damage(q, a);
  } else {
    const d = atkOf(q,tgt);
    await hitFx(tgt.uid);
    if(a>d){
      toVoid(P(q),tgt); render();
      await damage(q, a-d);
      if(att.equip && !G.over){ log('Kaioken: Goku e Kaioken vão para o vazio.'); toVoid(P(p),att); }
    } else if(a===d){
      log('Empate! Os dois vão para o vazio.');
      toVoid(P(q),tgt); toVoid(P(p),att);
    } else {
      toVoid(P(p),att); render();
      await damage(p, d-a);
    }
  }
  render();
}
async function damage(who, n){
  const pl=P(who); pl.life=Math.max(0,pl.life-n);
  if(n>0){ fxFloat(who,'-'+n,false); const lb=$('#life'+who); if(lb){lb.classList.remove('flash');void lb.offsetWidth;lb.classList.add('flash');} }
  render(); await sleep(650);
  checkWin();
}
function checkWin(){
  if(G.over) return;
  if(P(0).life<=0) endGame(1); else if(P(1).life<=0) endGame(0);
}
async function lunge(uid, p){ const e=document.querySelector(`[data-uid="${uid}"]`); if(!e) return; e.classList.add(p===0?'lungeUp':'lungeDown'); await sleep(380); }
async function hitFx(uid){ const e=document.querySelector(`[data-uid="${uid}"]`); if(!e) return; e.classList.add('hit'); await sleep(450); }
function fxFloat(who, text, heal){
  const f=el('div','float'+(heal?' heal':''),text); f.style.left=(who===0?760:60)+'px'; f.style.top='880px'; $('#stage').appendChild(f); setTimeout(()=>f.remove(),1300);
}
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('on'),1600); }
async function banner(t){ const b=$('#banner'); b.textContent=t; b.classList.remove('on'); void b.offsetWidth; b.classList.add('on'); await sleep(950); b.classList.remove('on'); }

/* ============================================================
   REGRAS POR CARTA -> lista de ações disponíveis
   ============================================================ */
function actionsFor(p, inst, where){
  const pl=P(p), q=1-p, d=inst.def, L=[];
  const add=(label,reason,run)=>L.push({label,reason,run});
  const slotsP = freeIdx(pl.powers)>=0;
  if(where==='hand'){
    if(d.kind==='char') add('Invocar', freeIdx(pl.chars)<0?'Os 3 slots de Personagem estão ocupados.':null, async()=>A.summon(p,inst));
    if(d.kind==='field') add('Ativar no campo', null, async()=>A.field(p,inst));
    if(d.kind==='support') add('Colocar em campo', slotsP?null:'Os 3 slots de Poder estão ocupados.', async()=>A.support(p,inst));
    if(d.kind==='tool'){
      const gs=chars(p).filter(c=>c.id===1&&!c.equip);
      add('Equipar', !slotsP?'Os 3 slots de Poder estão ocupados.':(gs.length?null:'Precisa de um "Goku - Guerreiros Z" sem Ferramenta em campo.'), async()=>{
        let g=gs[0];
        if(gs.length>1){ const r=await pickTarget(gs,{prompt:'Escolha o Goku que receberá o Kaioken.'}); if(!r) return; g=r.target; }
        A.tool(p,inst,g);
      });
    }
    if(d.kind==='item'){
      const noChar = chars(p).length===0 ? 'Precisa de um Personagem "Guerreiro Z" em campo.' : null;
      if(inst.id===6) add('Usar', noChar, async()=>A.semente(p,inst));
      if(inst.id===7){
        const sups=supports(q);
        add('Usar', noChar || (sups.length?null:'O oponente não controla nenhum Apoiador.'), async()=>{
          let t=sups[0];
          if(sups.length>1){ const r=await pickTarget(sups,{prompt:'Escolha o Apoiador a destruir.'}); if(!r) return; t=r.target; }
          A.disparo(p,inst,t);
        });
      }
      if(inst.id===8) add('Usar', !pl.void.some(c=>c.id===1)?'"Goku - Guerreiros Z" não está no seu vazio.':(freeIdx(pl.chars)<0?'Os 3 slots de Personagem estão ocupados.':null), async()=>A.caminho(p,inst));
    }
  }
  if(where==='field'){
    if(d.kind==='char'){
      add('Atacar', !canAttack(p)?'Quem começa a partida só ataca no 2º turno.':(inst.attacked?'Já atacou neste turno.':null), async()=>{
        const tg=chars(q);
        if(tg.length===0){ await doAttack(p,inst,null); return; }
        const r=await pickTarget(tg,{prompt:`Escolha o alvo de ${d.name}.`, direct:inst.direct});
        if(!r) return;
        await doAttack(p,inst,r.direct?null:r.target);
      });
      if(inst.id===3){
        const goku=chars(p).find(c=>c.id===1);
        add('Efeito: enviar Goku ao vazio',
          inst.used?'Já usado neste turno.':(inst.attacked?'Piccolo já atacou neste turno.':(goku?null:'Precisa de "Goku - Guerreiros Z" em campo.')),
          async()=>A.picc(p,inst));
      }
    }
    if(d.kind==='field') add('Efeito: buscar Guerreiro Z', inst.used?'Já usado neste turno.':(pl.deck.some(c=>c.def.kind==='char')?null:'Não há Personagens no baralho.'), async()=>{
      const opts=[]; const seen=new Set(); pl.deck.filter(c=>c.def.kind==='char').forEach(c=>{ if(!seen.has(c.id)){seen.add(c.id);opts.push(c);} });
      const r=await chooseFromList('Escolha um "Guerreiro Z" do baralho',opts); if(!r) return;
      A.casa(p,r);
    });
    if(d.kind==='support'){
      const ch=chars(p);

    }
  }
  return L;
}

        if(c.direct) ce.appendChild(el('div','chip tag2','DIRETO'));

      }

    zd.appendChild(el('div','badge',pl.deck.length));
    // vazio
    const zv=zone(frag,pos.void[0],pos.void[1],SW,SH,'Vazio',true);
    if(pl.void.length){ zv.textContent=''; const top=pl.void[pl.void.length-1]; const ce=el('div','card'); ce.style.backgroundImage=`url("${top.def.img}")`; ce.dataset.void=p; zv.appendChild(ce); }
    else zv.dataset.void=p;
    zv.dataset.void=p;
    zv.appendChild(el('div','badge',pl.void.length));
    // campo
    const zf=zone(frag,pos.field[0],pos.field[1],SW,SH,'Poder campo',true);
    if(pl.field){ zf.textContent=''; const ce=cardEl(pl.field,p,'field'); zf.appendChild(ce); if(pl.field.used) ce.classList.add('dim'); }
  }

  // mão do oponente
  const oh=P(1).hand.length;
  for(let i=0;i<oh;i++){

  }
  // mão do jogador
  const h=P(0).hand, n=h.length, W=190;
  const step=n>1?Math.min(W+12,(1040-W)/(n-1)):0, total=(n-1)*step+W, x0=(1080-total)/2;
  const can=canAct();
  h.forEach((inst,i)=>{
    const d=el('div','hand'); d.style.cssText=`left:${x0+i*step}px;top:1642px;z-index:${i}`;

    lb.innerHTML=`<div class="nm" style="${p===1?'left:0':'left:0'}">${p===1?'OPONENTE':'VOCÊ'}</div><div class="num">${pl.life}</div><div class="bar"><i style="width:${100*pl.life/MAX_LIFE}%"></i></div>`;

    if(G.pick.direct) msg.appendChild(btn('Direto','sm',()=>endPick({direct:true})));
    msg.appendChild(btn('Cancelar','sm sec',()=>endPick(null)));
  } else {
    G.log.slice(-3).forEach(l=>msg.appendChild(el('div','l',l)));

function draw(p){
  const pl=P(p);
  if(!pl.deck.length){ log(`${p?'Oponente':'Você'} não tem cartas para comprar!`); endGame(1-p); return false; }
  pl.hand.push(pl.deck.shift()); return true;
}
async function startTurn(p){
  if(G.over) return;
  G.turn=p; const pl=P(p); pl.turns++;
  [...pl.chars,...pl.powers,pl.field].filter(Boolean).forEach(c=>{c.attacked=false;c.direct=false;c.used=false;});
  G.busy=true; render();
  await banner(p===0?'SEU TURNO':'TURNO DO OPONENTE');
  if(G.over) return;
  if(!draw(p)) return;
  log(p===0?'Você comprou uma carta.':'Oponente comprou uma carta.');
  if(!canAttack(p)) log(p===0?'Primeiro turno: você ainda não pode atacar.':'Primeiro turno do oponente: ele não pode atacar.');
  render();
  if(p===1){ await botTurn(); }
  else { G.busy=false; render(); }
}
async function endTurnHuman(){
  if(!canAct()) return;
  closeModal(); G.busy=true; render();
  await startTurn(1);
}
function endGame(winner){
  if(G.over) return; G.over=true; G.busy=true; render();

    const box=el('div','mbox');

    box.appendChild(btn('Menu inicial','sec',()=>{closeModal(); G=null; $('#board').innerHTML=''; titleScreen();}));
    showModal(box);
  },900);
}

async function beginMatch(first){
  const myDeck=loadDeck();
  G={p:[newPlayer(myDeck),newPlayer(BOT_DECK)],turn:0,first,over:false,busy:true,pick:null,log:[],index:new Map()};
  for(const p of [0,1]){
    const pl=P(p);
    for(let i=0;i<HAND_START;i++) pl.hand.push(pl.deck.shift());
    if(!pl.hand.some(c=>c.def.kind==='char')){            // garante 1 Personagem na mão inicial
      const k=pl.deck.findIndex(c=>c.def.kind==='char');
      if(k>=0){ const ch=pl.deck.splice(k,1)[0]; const out=pl.hand.pop(); pl.deck.push(out); pl.hand.push(ch); shuffle(pl.deck); }
    }
  }
  $('#screen').innerHTML='';
  log(first===0?'Você começou! (não ataca no 1º turno)':'O oponente começa. Você pode atacar no seu 1º turno.');
  render();
  await sleep(300);
  await startTurn(first);
}

/* ============================================================
   IA SIMPLES
   ============================================================ */
async function botTurn(){
  const p=1,q=0,pl=P(p),ql=P(q);
  const pause=async ms=>{ await sleep(ms); render(); return !G.over; };
  const hand=id=>pl.hand.find(c=>c.id===id);
  const freeC=()=>freeIdx(pl.chars)>=0, freeP=()=>freeIdx(pl.powers)>=0;
  const projAtk=c=>c.def.atk+(c.id===1?500*pl.void.filter(x=>x.def.kind==='char').length:0);
  await sleep(500);

  // 1) Casa do Kame
  let c=hand(4);
  if(c && !pl.field){ A.field(p,c); if(!await pause(800)) return; }
  if(pl.field && pl.field.id===4 && !pl.field.used){
    const opts=pl.deck.filter(x=>x.def.kind==='char').sort((a,b)=>projAtk(b)-projAtk(a));
    if(opts.length){ A.casa(p,opts[0]); if(!await pause(800)) return; }
  }
  // 2) Caminho da serpente (traz Goku do vazio)
  c=hand(8);
  if(c && pl.void.some(x=>x.id===1) && freeC()){ A.caminho(p,c); if(!await pause(900)) return; }
  // 3) Invocar o máximo de Personagens possível, do mais forte ao mais fraco
  while(freeC()){
    const cs=pl.hand.filter(x=>x.def.kind==='char').sort((a,b)=>projAtk(b)-projAtk(a));
    if(!cs.length) break;
    A.summon(p,cs[0]); if(!await pause(800)) return;
  }
  c=hand(8);
  if(c && pl.void.some(x=>x.id===1) && freeC()){ A.caminho(p,c); if(!await pause(900)) return; }
  // 4) Semente
  c=hand(6);
  if(c && chars(p).length && pl.life<=2000){ A.semente(p,c); if(!await pause(900)) return; }
  // 5) Disparo de Ki
  c=hand(7);
  if(c && chars(p).length && supports(q).length){ A.disparo(p,c,supports(q)[0]); if(!await pause(900)) return; }
  // 6) Yajirobe
  c=hand(5);
  if(c && freeP()){ A.support(p,c); if(!await pause(700)) return; }
  // 7) Kaioken
  c=hand(9);
  const goku=chars(p).find(x=>x.id===1&&!x.equip);
  if(c && goku && freeP()){
    const strongest=Math.max(0,...chars(q).map(t=>atkOf(q,t)));
    if(chars(q).length===0 || atkOf(p,goku)+1000>strongest){ A.tool(p,c,goku); if(!await pause(900)) return; }
  }
  // 8) Yajirobe (efeito)
  const yaji=pl.powers.find(x=>x&&x.id===5);
  if(yaji && canAttack(p) && pl.life<=500 && chars(p).length===1 && !chars(p)[0].attacked){ A.yaji(p,yaji); if(!await pause(900)) return; }
  // 9) Piccolo (ataque direto) só se for letal ou ajudar muito
  const picc=chars(p).find(x=>x.id===3&&!x.used&&!x.attacked), g2=chars(p).find(x=>x.id===1);
  if(picc && g2 && canAttack(p)){
    const pa=atkOf(p,picc), tg=chars(q);
    if(pa>=ql.life || (ql.life<=pa*2 && tg.length && tg.every(t=>atkOf(q,t)>=pa))){ A.picc(p,picc); if(!await pause(900)) return; }
  }
  // 10) Ataques
  if(canAttack(p)){
    const skipped=new Set();
    while(!G.over){
      const atts=pl.chars.filter(x=>x&&!x.attacked&&!skipped.has(x.uid)).sort((a,b)=>atkOf(p,b)-atkOf(p,a));
      if(!atts.length) break;
      const a=atts[0], av=atkOf(p,a), tg=chars(q);
      let choice=null;
      if(!tg.length) choice={direct:true};
      else if(a.direct && (av>=ql.life || !tg.some(t=>atkOf(q,t)<av))) choice={direct:true};
      else { const w=tg.filter(t=>atkOf(q,t)<av).sort((x,y)=>atkOf(q,y)-atkOf(q,x)); if(w.length) choice={target:w[0]}; }
      if(!choice){ skipped.add(a.uid); continue; }
      await doAttack(p,a,choice.direct?null:choice.target);
      if(G.over) return;
      await sleep(350);
    }
  }
  if(G.over) return;
  await sleep(400);
  await startTurn(0);
}

function loadDeck(){
  try{
    const s=JSON.parse(localStorage.getItem('amv_deck')||'null');
    if(s && validDeck(s)===null) return s;
  }catch(e){}
  return {1:3,2:3,3:3,4:3,5:3,6:3,7:3,8:3,9:3};
}
function saveDeck(c){ try{localStorage.setItem('amv_deck',JSON.stringify(c));}catch(e){} }
function validDeck(c){
  let t=0, ch=0;
  for(const id in c){ const n=c[id]|0; if(n<0||n>COPY_MAX) return 'Máximo de '+COPY_MAX+' cópias por carta.'; t+=n; if(DEFS[id]&&DEFS[id].kind==='char') ch+=n; }
  if(t<DECK_MIN) return `Faltam ${DECK_MIN-t} cartas (mínimo ${DECK_MIN}).`;
  if(t>DECK_MAX) return `Sobram ${t-DECK_MAX} cartas (máximo ${DECK_MAX}).`;
  if(ch<1) return 'O baralho precisa de pelo menos 1 Personagem.';
  return null;
}

  const res=el('div','big'); res.style.fontSize='80px';
  opts.forEach(([ic,nm],i)=>{
    row.appendChild(btn(ic,'rpsb',async()=>{
      const bot=Math.floor(Math.random()*3);
      row.querySelectorAll('button').forEach(b=>b.disabled=true);
      res.innerHTML=`Você ${opts[i][0]} × ${opts[bot][0]} Oponente`;
      await sleep(900);
      if(i===bot){ rps('Empate! Jogue de novo.'); return; }
      const win=(i-bot+3)%3===1;
      res.innerHTML+=`<div style="margin-top:30px;color:${win?'#2ee66b':'#e60012'}">${win?'Você começa!':'O oponente começa!'}</div>`;
      await sleep(1300);
      beginMatch(win?0:1);
    }));
  });
  s.appendChild(row); s.appendChild(res);
  setScreen(s);
}

titleScreen();
window.__AMV = {get G(){return G;}, render, startTurn};   // útil para depurar
})();
</script>
