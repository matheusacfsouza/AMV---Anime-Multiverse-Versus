<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Anomalia Multiversal Versus</title>
<link rel="icon" href="Logo/AMV - Logomarca.png">
<link rel="apple-touch-icon" href="Logo/AMV - Logomarca.png">
<style>
:root{--red:#e60012;--gold:#ffd400;--green:#2ee66b}
*{box-sizing:border-box}
body.locked #board,body.locked #board *{pointer-events:none!important}
html,body{margin:0;height:100%;background:#050505;overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;background:#000;overflow:hidden}
#board,#screen{position:absolute;inset:0}
#board{z-index:1}
#screen{z-index:5}
#screen:empty{display:none}
#modal{position:absolute;inset:0;z-index:10;display:none;background:rgba(0,0,0,.86);align-items:center;justify-content:center;flex-direction:column}
#modal.on{display:flex}
#banner{position:absolute;left:0;right:0;top:920px;height:80px;z-index:20;display:none;align-items:center;justify-content:center;text-align:center;white-space:nowrap;
  background:linear-gradient(90deg,transparent,rgba(230,0,18,.92) 25%,rgba(230,0,18,.92) 75%,transparent);font-size:42px;font-weight:900;letter-spacing:3px;text-shadow:0 3px 0 #000}
#banner.on{display:flex;animation:ban .9s ease both}
@keyframes ban{0%{opacity:0;transform:scaleY(.2)}20%{opacity:1;transform:scaleY(1)}85%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;bottom:340px;transform:translateX(-50%);z-index:30;background:#000c;border:3px solid #fff;border-radius:16px;padding:16px 30px;font-size:38px;display:none}
#toast.on{display:block}
#upd{position:absolute;left:50%;top:24px;transform:translateX(-50%);z-index:2000;background:linear-gradient(90deg,#86cdf7,#6fe3f0);color:#06202c;font-weight:800;font-size:38px;padding:22px 40px;border-radius:50px;box-shadow:0 8px 30px #0009;cursor:pointer;display:none;text-align:center;max-width:980px}
#upd.on{display:block;animation:updIn .4s ease-out}
#upd small{display:block;font-size:28px;font-weight:600}
@keyframes updIn{from{transform:translate(-50%,-160px)}to{transform:translate(-50%,0)}}

/* zones */
.zone{position:absolute;border:8px solid #fff;background:#000;color:var(--red);font-weight:800;text-align:center;
  display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1.05;padding:4px}
.zone.small{font-size:26px}
#stage.scen{background-size:100% 100%;background-position:center}
#stage.scen .zone.slot{background:transparent;border-color:transparent}
#stage.scen .zone.slot>.lbl{opacity:0}
#stage.scen .zone.life,#stage.scen .zone.turn,#stage.scen .zone.av{background:rgba(0,0,0,.72)}
.card{position:absolute;inset:-8px;border-radius:12px;background-size:100% 100%;background-position:center;background-color:transparent;cursor:pointer;transition:transform .25s,opacity .25s}
.card.dim{opacity:.55}
/* brilhos: só a opacidade anima (o navegador não redesenha a tela toda) */
.card.cand,.zone.cand{z-index:3}
.card.glow::after,.hand.playable .card::after,.card.cand::after,.zone.cand::after,.toolico.cand::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;will-change:opacity;animation:glowp 1s infinite alternate}
.card.glow::after,.hand.playable .card::after{box-shadow:0 0 0 5px #7df,0 0 30px 8px #4cf}
.card.cand::after,.zone.cand::after,.toolico.cand::after{box-shadow:0 0 0 6px var(--gold),0 0 34px 10px var(--gold);animation-duration:.75s}
@keyframes glowp{from{opacity:.28}to{opacity:1}}
.card.cand.atk{filter:brightness(1.18)}
.card.cand.atk::after{box-shadow:0 0 0 7px #fdcd00,0 0 46px 16px #fdcd00}
.card.nocand{filter:brightness(.5) saturate(.6)}
.card.nocand::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:0 0 0 6px #ff0803,0 0 34px 10px #ff0803;opacity:.85}
.card.hit{animation:hit .5s}
@keyframes hit{0%,100%{filter:none}20%{filter:brightness(3.2) saturate(0)}55%{filter:brightness(1.6) sepia(1) hue-rotate(-40deg) saturate(4)}}
.back{background-color:#101418;background-image:repeating-linear-gradient(45deg,#14181d 0 16px,#1d232a 16px 32px);border:6px solid #cdd5df}
.back::after{content:"AMV";position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:var(--red);border:5px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:34px;color:#fff}
.back.img{background-size:100% 100%;border:0}
.back.img::after{display:none}
.fly.bk.img{background-size:100% 100%;border:0}
.hasback .back::after{display:none}
.chip{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;background:#000d;border:3px solid #fff;border-radius:10px;padding:2px 12px;font-size:32px;font-weight:900;white-space:nowrap}
.chip.atq{color:#fdcd00}
.chip.atq.up{color:#32bf0b;border-color:#32bf0b}
.chip.atq.down{color:#ff0803;border-color:#ff0803}
.chip.tag{bottom:auto;top:6px;font-size:24px;border-color:var(--red);color:#fff;background:#b00010}
.chip.tag2{bottom:auto;top:46px;font-size:24px;border-color:var(--gold);color:var(--gold)}
.badge{position:absolute;right:-6px;top:-6px;min-width:44px;height:44px;border-radius:22px;background:var(--red);border:3px solid #fff;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:2}
.hand{position:absolute;width:190px;height:266px;touch-action:none}
.hand.lift{z-index:60!important}
.hand.lift .card{transform:translateY(-120px) scale(1.42);transition:transform .14s ease-out;box-shadow:0 20px 40px #000}
.hand.dragging{opacity:.25}
.ghost{position:absolute;z-index:40;width:215px;height:301px;border-radius:12px;background-size:100% 100%;pointer-events:none;box-shadow:0 30px 50px #000;transform:translate(-50%,-60%) rotate(-4deg) scale(1.08)}
.zone.drop::after{content:"";position:absolute;inset:-12px;border:6px dashed var(--gold);border-radius:12px;pointer-events:none;opacity:.55}
.zone.drop.over::after{opacity:1;border-style:solid;background:rgba(255,212,0,.15)}
.hand .card{inset:0}


.card.glow{z-index:2}
.toolico{position:absolute;left:calc(6.765% - 37px);width:74px;height:66px;border:4px solid #ff9a1f;border-radius:10px;background-size:230% auto;background-position:50% 24%;background-color:#222;z-index:6;cursor:pointer;box-shadow:0 0 0 2px #ffcf6b,0 0 16px 5px #ff8a00,0 4px 10px #000}
.card.enterHand{animation:drawIn .55s ease-out backwards}
.card.enterField{animation:dropIn .5s cubic-bezier(.22,1,.36,1) backwards}
.card.settle{animation:settle .32s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes settle{from{transform:scale(1.18)}}
@keyframes drawIn{from{transform:translate(var(--ex,300px),var(--ey,-200px)) scale(.5) rotate(18deg);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
@keyframes dropIn{0%{transform:translate(var(--ex,0px),var(--ey,-300px)) scale(1.9);opacity:0}30%{opacity:1}100%{transform:none;opacity:1}}
.impact{position:absolute;z-index:27;pointer-events:none;overflow:visible}
.impact .star{animation:istar .5s cubic-bezier(.1,.9,.3,1) both;transform-origin:0 0}
@keyframes istar{0%{transform:scale(.15) rotate(-20deg);opacity:1}35%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1.35) rotate(10deg);opacity:0}}
.impact .lines{animation:ilines .42s ease-out both;transform-origin:0 0}
@keyframes ilines{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.25);opacity:0}}
.impact .ring{transform-origin:0 0;animation:iring .5s ease-out both}
.impact .r2{animation-delay:.06s}
@keyframes iring{0%{transform:scale(.3);opacity:1}100%{transform:scale(3.4);opacity:0}}
.shard{position:absolute;z-index:27;pointer-events:none;background:#fff;border:2px solid #000;animation:shard .55s cubic-bezier(.1,.8,.3,1) both}
@keyframes shard{from{transform:translate(-50%,-50%)}to{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) rotate(var(--rot));opacity:0}}
.speed{position:absolute;z-index:26;height:0;transform-origin:0 0;pointer-events:none}
.speed i{position:absolute;left:0;width:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95));border-radius:4px;animation:spd .3s ease-out both}
@keyframes spd{from{transform:scaleX(.1);transform-origin:100% 0;opacity:1}to{transform:scaleX(1);opacity:0}}
.flashw{position:absolute;inset:0;z-index:29;background:#fff;pointer-events:none;animation:flw .25s ease-out both}
@keyframes flw{0%{opacity:.85}100%{opacity:0}}
#board.iframe{filter:invert(1) grayscale(1) contrast(1.8)}
#board.shake{animation:shk .36s linear}
@keyframes shk{0%,100%{transform:none}
 15%{transform:translate(calc(var(--sh)*-1),calc(var(--sh)*.6))}
 30%{transform:translate(var(--sh),calc(var(--sh)*-.5))}
 45%{transform:translate(calc(var(--sh)*-.6),calc(var(--sh)*-.4))}
 60%{transform:translate(calc(var(--sh)*.5),calc(var(--sh)*.3))}
 80%{transform:translate(calc(var(--sh)*-.2),calc(var(--sh)*.1))}}
.chip.bump{animation:bump .45s ease-out}
@keyframes bump{40%{transform:translateX(-50%) scale(1.45)}100%{transform:translateX(-50%) scale(1)}}
#board{backface-visibility:hidden}
.fly{position:absolute;z-index:28;border-radius:12px;background-size:100% 100%;background-color:transparent;box-shadow:0 14px 30px #000;pointer-events:none;transform-style:preserve-3d}
.fly.bk{background-color:#101418;background-image:repeating-linear-gradient(45deg,#14181d 0 16px,#1d232a 16px 32px);border:5px solid #cdd5df}
.hasback .fly.bk{background-image:var(--backimg);background-size:100% 100%;border:0}
/* lista de busca estilo Yu-Gi-Oh */
.slist{width:1000px;max-height:1400px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:10px;background:#0d0d0d;border:3px solid #444;border-radius:20px}
.srow{display:flex;align-items:center;gap:26px;background:#000;border:4px solid #555;border-radius:14px;padding:10px 16px;cursor:pointer;text-align:left}
.srow:active{border-color:var(--gold);background:#2a2320}
.sth{width:208px;height:292px;border-radius:8px;background-size:100% 100%;flex:none;background-color:#222}
.sinfo{flex:1;min-width:0}
.sname{font-size:44px;white-space:normal!important;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ssub{font-size:32px;color:#bbb;margin-top:6px}
.srow.void{background:#df061b;border-color:#ff6b78}
.srow.void .ssub{color:#fff}
.scount{font-size:52px;font-weight:900;color:var(--gold);border:4px solid var(--gold);border-radius:12px;padding:2px 14px;flex:none}
/* hud */
.zone.life{overflow:hidden;justify-content:flex-start;padding:0}
.zone.life i{position:absolute;left:0;top:0;bottom:0}
.zone.life span{position:relative;z-index:1;width:100%;color:#fff;font-size:30px;font-weight:800;text-shadow:0 2px 0 #000}
.zone.life.flash span{animation:fl .6s}
@keyframes fl{50%{color:#ffd400;transform:scale(1.2)}}
.zone .lbl{display:block}
.zone .lbl.flip{transform:rotate(180deg)}
.zone.av{font-size:18px}
.zone.turn{font-size:58px;line-height:1;color:#fff;font-weight:900}
.zone.turn b{font-size:22px}
.zone.turn u{font-size:19px;color:var(--gold);text-decoration:none;font-weight:800}
#msg{position:absolute;left:160px;top:922px;width:760px;height:84px;border:3px solid #444;border-radius:14px;background:#0b0b0b;padding:4px 14px;
  font-size:24px;line-height:1.15;color:#ddd;overflow:hidden;display:flex;flex-direction:column;justify-content:center;z-index:2}
#msg .l:last-child{color:#fff;font-weight:700}
#msg .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg.pick{border-color:var(--gold);flex-direction:row;align-items:center;gap:10px;height:60px;top:934px;padding:2px 12px}
#msg.pick .btn.sm{font-size:21px;padding:3px 12px;border-width:3px}
#msg.pick .t{flex:1;font-size:23px;font-weight:700;color:var(--gold);line-height:1.1}
.btn{font-family:inherit;font-weight:800;color:#fff;background:var(--red);border:4px solid #fff;border-radius:20px;font-size:42px;padding:16px 30px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.sec{background:#2a2a2a}
.btn.sm{font-size:24px;padding:6px 12px;border-radius:12px}
.btn[disabled]{opacity:.35;pointer-events:none}
.tmr{position:absolute;left:937px;top:740px;width:104px;height:104px;border-radius:50%;z-index:3;display:none;align-items:center;justify-content:center;pointer-events:none;
  background:conic-gradient(var(--tc,#2ee66b) calc(var(--tp,1)*360deg), rgba(255,255,255,.18) 0);box-shadow:0 4px 14px #000}
.tmr.on{display:flex}
.tmr b{width:80px;height:80px;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#fff}
.tmr.low b{color:#ff0803;animation:tlow .5s infinite alternate}
@keyframes tlow{to{transform:scale(1.12)}}
#endbtn{position:absolute;left:933px;top:886px;width:112px;height:157px;font-size:24px;padding:4px;line-height:1.1;border-width:6px;border-radius:8px;z-index:2}
#menubtn{position:absolute;left:22px;top:1475px;width:124px;height:142px;font-size:32px;padding:4px;border-width:6px;border-radius:8px;z-index:4;color:var(--red);background:#000}
.hist{font-size:28px;line-height:1.3;text-align:left;width:900px;max-height:1400px;overflow:auto;background:#0d0d0d;border:3px solid #444;border-radius:20px;padding:20px 30px}

/* screens */
.scr{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:60px 40px;background:radial-gradient(ellipse at 50% 30%,#2a0006 0,#000 70%)}
.scr h1{font-size:150px;margin:40px 0 0;letter-spacing:10px;color:var(--red);text-shadow:0 6px 0 #fff;font-weight:900}
.scr h2{font-size:54px;margin:0 0 30px;font-weight:700;letter-spacing:6px;color:#fff}
.scr .row{display:flex;gap:30px}
.menu{display:flex;flex-direction:column;gap:30px;width:760px;margin-top:40px}
.menu .btn{font-size:50px;padding:30px}
.fan{position:relative;width:1000px;height:520px;margin-top:40px}
.backs{display:flex;align-items:center;gap:18px;margin-top:16px;font-size:34px;font-weight:800}
.backs .bk{width:96px;height:134px;border-radius:8px;background-size:100% 100%;cursor:pointer;border:5px solid transparent;opacity:.6}
.backs .bk.sel{border-color:var(--gold);opacity:1;box-shadow:0 0 22px var(--gold)}
.scr.home{background:#000;padding:0}
.scr.home .spin{position:absolute;left:-590px;top:-168px;width:2240px;height:2240px;background:url("Menus/Menu - Tela inicial - Giro.jpg") center/100% 100% no-repeat;animation:spin 60s linear infinite;will-change:transform;pointer-events:none}
@keyframes spin{to{transform:rotate(-360deg)}}
.scr.home .ui{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.scr.home .fan{position:absolute;left:40px;top:545px;margin:0}
.hot{position:absolute;display:block;background:transparent;border:0;border-radius:18px;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.hot:active{background:rgba(255,255,255,.14)}
.fan div{position:absolute;width:300px;height:420px;border-radius:14px;background-size:100% 100%;box-shadow:0 20px 40px #000}
.rpsb{font-size:130px;width:300px;height:300px;padding:0}
.big{font-size:60px;font-weight:800;text-align:center;margin:30px}
.grid{display:grid;grid-template-columns:repeat(4,236px);gap:10px 22px;padding:6px 4px}
.gridwrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;width:100%;display:flex;justify-content:center;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tile{display:flex;flex-direction:column;align-items:center}
.tile .im{width:236px;height:330px;border-radius:12px;background-size:100% 100%;cursor:pointer}
.tile .ctl{display:flex;align-items:center;gap:18px;height:72px}
.tile .ctl b{font-size:48px;min-width:44px;text-align:center}
.tile .ctl .btn{width:76px;height:64px;padding:0;font-size:44px;border-radius:14px}

/* modal bits */
.acc{position:absolute;left:30px;top:30px;z-index:6;display:flex;align-items:center;gap:18px;background:#000b;border:3px solid #fff;border-radius:60px;padding:10px 34px 10px 10px;cursor:pointer;max-width:720px}
.acc b{font-size:38px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc small{display:block;font-size:26px;color:#ffd84d;font-weight:600}
.av{width:86px;height:86px;border-radius:50%;border:4px solid #fff;flex:none;background:#333 center/cover}
.av.big{width:220px;height:220px;border-width:6px}
.form{display:flex;flex-direction:column;gap:20px;align-items:center;width:940px;box-sizing:border-box;padding:44px 40px;background:#0d0f14f5;border:2px solid #343a46;border-radius:44px;box-shadow:0 20px 60px #000}
.form h2{margin:0;font-size:60px}
.form input{width:820px;box-sizing:border-box;font:inherit;font-size:40px;padding:22px 28px;border-radius:20px;border:3px solid #4a4a4a;background:#111;color:#fff;outline:none}
.form input:focus{border-color:#7fd6f5}
.pwrap{position:relative;width:820px}
.pwrap input{padding-right:110px!important}
.pwrap .eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:46px;cursor:pointer;padding:6px 12px}
.form .tabs{display:flex;gap:16px}
.form .tabs .btn{font-size:36px}
.form .err{color:#ff8a7a;font-size:32px;min-height:40px;text-align:center}
.form .ok{color:#2ee66b;font-size:34px;text-align:center}
.form .lbl{align-self:flex-start;margin-left:30px;font-size:32px;color:#bbb}

.gbtn{display:flex;align-items:center;justify-content:center;gap:18px;width:820px;background:#fff;color:#222;border-radius:20px;font-size:38px;font-weight:700;padding:20px;cursor:pointer;border:0;font-family:inherit}
.gbtn svg{width:46px;height:46px}
.form .link{font-size:34px;color:#7fd6f5;text-decoration:underline;cursor:pointer;background:none;border:0;font-family:inherit}
.lvl{background:linear-gradient(90deg,#ffd84d,#ffa31a);color:#2a1a00;font-weight:900;font-size:28px;border-radius:30px;padding:4px 14px;white-space:nowrap}

.xpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;text-shadow:0 2px 4px #000}
.rew{display:flex;flex-direction:column;align-items:center;gap:14px;width:900px;padding:40px;background:#0d0f14f5;border:2px solid #343a46;border-radius:44px}

.rew .ln b{color:#7fd6f5}
.rew .tot{font-size:56px;font-weight:900;color:#ffd84d}

.mis{position:absolute;right:40px;bottom:60px;z-index:6;width:160px;height:190px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-family:inherit}

.mis small{font-size:32px;font-weight:700;text-shadow:0 2px 6px #000}
.mis.dot span::after{content:'';position:absolute;right:14px;top:6px;width:34px;height:34px;border-radius:50%;background:#ff4d6d;border:3px solid #fff}
.cry{width:1.1em;height:1.1em;vertical-align:-.2em;flex:none}
.crybox{position:absolute;right:160px;top:38px;z-index:6;display:flex;align-items:center;gap:12px;background:#000b;border:3px solid #fff;border-radius:50px;padding:12px 28px;font-size:40px}
.crybox b{font-weight:900}
.crytot{display:flex;align-items:center;gap:10px}.crytot small{font-size:30px;color:#bbb;font-weight:600}
.mscr .pbody{padding-top:70px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
'use strict';
/* ============================================================
   CONFIGURAÇÃO (fácil de mexer quando suas regras chegarem)
   ============================================================ */
const MAX_LIFE = 10000;     // vida inicial e máxima
const DECK_MIN = 20, DECK_MAX = 30, COPY_MAX = 3;
const HAND_START = 5;      // cartas iniciais
const DEFAULT_DECK = {31:3,32:3,33:2,34:2,35:1,36:3,21:2,23:1,22:2,24:1,25:1,26:2,27:2,28:1,29:1,30:3};  // 30 cartas
const BOT_DECK = DEFAULT_DECK;   // baralho do bot

const DEFS = {   // arquivos com nome, pasta Cartas
  21:{id:21,name:'Zé do Trovão - Velha Guarda',kind:'char',atk:1400,arq:['Elemental','Mestre'],el:'raio',img:'Cartas/Zé do Trovão - Velha Guarda.jpg'},
  22:{id:22,name:'Cajado do Zé',kind:'tool',img:'Cartas/Ferramenta - Cajado do Zé.jpg'},
  23:{id:23,name:'Sabrina',kind:'char',atk:1300,arq:['Controlador','Máquina'],el:'escuridao',fios:true,troca:true,img:'Cartas/Sabrina.jpg'},
  24:{id:24,name:'Fios invisíveis',kind:'item',img:'Cartas/Item - Fios invisíveis.jpg'},
  25:{id:25,name:'Troca de Marionetes',kind:'item',img:'Cartas/Item - Troca de marionetes.jpg'},
  26:{id:26,name:'Nainai Ma Mei',kind:'support',img:'Cartas/Apoiador - Nainai Ma Mei.jpg'},
  27:{id:27,name:'Pastelaria Ma Mei',kind:'field',img:'Cartas/Campo - Pastelaria Ma Mei.jpg'},
  28:{id:28,name:'Da Shui Long Zhi Gui',kind:'item',img:'Cartas/Item - Da Shui Long Zhi Gui.jpg'},
  29:{id:29,name:'Da Shui Long',kind:'item',img:'Cartas/Item - Da Shui Long.jpg'},
  30:{id:30,name:'Irmãos Ma Mei',kind:'item',img:'Cartas/Item - Irmãos Ma Mei.jpg'},
  31:{id:31,name:'Lee Ma Mei',kind:'char',atk:1400,arq:['Lutador'],el:'agua',img:'Cartas/Lee Ma Mei.jpg'},
  32:{id:32,name:'Mee Ma Mei',kind:'char',atk:1600,arq:['Elemental','Lutador'],el:'agua',img:'Cartas/Mee Ma Mei.jpg'},
  33:{id:33,name:'Shifu Ma Mei',kind:'char',atk:1700,arq:['Lutador','Mestre'],el:'agua',dsl:true,img:'Cartas/Shifu Ma Mei.jpg'},
  34:{id:34,name:'Shizu Ma Mei - Velha Guarda',kind:'char',atk:800,arq:['Elemental','Mestre'],el:'agua',dsl:true,img:'Cartas/Shizu Ma Mei - Velha Guarda.jpg'},
  35:{id:35,name:'Taishizu Ma Mei',kind:'char',atk:2000,arq:['Mestre','Lenda'],el:'agua',dsl:true,dslzg:true,img:'Cartas/Taishizu Ma Mei.jpg'},
  36:{id:36,name:'Tee Ma Mei',kind:'char',atk:1300,arq:['Atirador'],el:'agua',img:'Cartas/Tee Ma Mei.jpg'}
};
/* estrelas: 1 a 3 = até 3 cópias, 4 = 1 cópia, 5 = só 1 carta de 5 estrelas no baralho inteiro */
const STARS={1:2,2:1,3:1,4:2,5:1,6:1,7:2,8:2,9:2,10:1,11:2,12:2,13:3,14:4,15:3,16:3,17:3,18:3,19:3,20:2,21:2,22:3,23:3,24:2,25:4,26:2,27:2,28:4,29:4,30:3,31:1,32:2,33:3,34:3,35:5,36:2};
const maxCopies=id=>{ const st=STARS[id]||1; return st>=4?1:3; };
const isMaMei=c=>/Ma Mei/.test(c.def.name);
const DS={31:200,32:300,33:500,36:100};                         // Duplo Sentido (valor fixo)
const DS_MASTER=new Set([34,35]);                               // Mestre do Duplo Sentido (metade do ATQ do alvo)
function clashVals(p, att, q, tgt){                              // ATQ de batalha [atacante, defensor]
  let a=atkOf(p,att), d=atkOf(q,tgt);
  if(att.id===5) a+=300;                                        // Tenshinhan - Kikoho
  if(tgt.id===7) d=Math.max(0,d-300);                           // Yamcha - Autodestruição
  const ds = DS_MASTER.has(att.id) ? Math.floor(d/2) : (DS[att.id]||0);
  return [a+ds, Math.max(0,d-ds)];
}
/* Mestre da Água (Shizu/Taishizu): Personagens Água do dono não são afetados por Itens do oponente.
   Aprendiz da Água (Mee): 1x por turno não é afetado por Itens do oponente. */
const waterShield=(q,t)=> t.def.el==='agua' && chars(q).some(c=>DS_MASTER.has(c.id));
function itemBlocked(q,t){
  if(waterShield(q,t)){ log(`Mestre da Água: ${t.def.name} não é afetado.`); toast('Mestre da Água: sem efeito'); return true; }
  if(t.id===32 && !t.imm){ t.imm=true; log('Aprendiz da Água: Mee Ma Mei não é afetado por este Item.'); toast('Aprendiz da Água: sem efeito'); return true; }
  return false;
}
const itemTargets=(q,list)=>list.filter(t=>!waterShield(q,t));
for(const i in DEFS) DEFS[i].gz=/Guerreiros Z/.test(DEFS[i].name);

function atkOf(p, inst){
  const intim = 200 * P(1-p).chars.filter(c=>c&&c.id===21).length;               // Zé do Trovão (Intimidador): -200 nos Personagens do oponente
  if(inst.tmp!=null) return Math.max(0, inst.tmp - intim);                       // Autoescola: ATQ final até o fim do turno
  let a;
  {
    a = inst.def.atk;
    const v = P(p).void;
    if(inst.id===1) a += 100 * v.filter(c=>c.def.kind==='char'&&isGZ(c)).length; // Goku: +100 por Guerreiro Z no vazio
    if(inst.id===2) a += 600 * v.filter(c=>c.id===3).length;                     // Gohan: +600 por Piccolo no vazio
  }
  a += 400 * inst.equips.length;                                                 // Kaioken: +400 cada (pode ter vários)
  a += inst.boost||0;                                                            // Kaioken aumentado 4x: +1000 até o fim do turno
  if(inst.id===33 && P(p).chars.some(c=>c&&[31,32,36].includes(c.id))) a+=200;   // Shifu - Pai Protetor
  return Math.max(0, a - intim);
}
function canAttack(p){ return !(p===G.first && P(p).turns===1); }   // quem começa não ataca no 1º turno

function detach(pl, inst){
  let i;
  if((i=pl.hand.indexOf(inst))>=0) pl.hand.splice(i,1);
  else if((i=pl.deck.indexOf(inst))>=0) pl.deck.splice(i,1);
  else if((i=pl.void.indexOf(inst))>=0) pl.void.splice(i,1);
  else if((i=pl.chars.indexOf(inst))>=0) pl.chars[i]=null;
  else if((i=pl.powers.indexOf(inst))>=0) pl.powers[i]=null;
  else if(pl.field===inst) pl.field=null;
}
const ownPl=(inst,pl)=> inst.own!=null ? P(inst.own) : pl;
function toVoid(pl, inst){
  detach(pl, inst);
  if(inst.equips.length){ inst.equips.forEach(k=>{ k.equipTo=null; detach(pl,k); ownPl(k,pl).void.push(k); }); inst.equips=[]; }
  if(inst.equipTo){ const g=inst.equipTo; g.equips=g.equips.filter(k=>k!==inst); inst.equipTo=null; }
  inst.direct=false; inst.attacked=false; inst.tmp=null; inst.used=false; inst.boost=0; inst.doom=false; inst.ctrlBy=null;
  ownPl(inst,pl).void.push(inst);
  releaseCtl(inst);
}

const atkTargets = q => chars(q).filter(c=>!shielded(c));
function releaseCtl(sab){                                       // Sabrina deixou o campo: o personagem volta para o dono
  for(const c of puppets(sab)){
    c.ctrlBy=null; const x=ctrlOf(c); if(x===c.own) continue;
    detach(P(x),c); const fi=freeIdx(P(c.own).chars);
    if(fi>=0){ P(c.own).chars[fi]=c; G.settle=c.uid; } else toVoid(P(x),c);
    log(`${c.def.name} volta para ${c.own?'o oponente':'você'}.`);
  }
}

async function doAttack(p, att, tgt){
  const q=1-p;
  att.attacked = true; G.atkUid = att.uid;
  const [a,d] = tgt ? clashVals(p,att,q,tgt) : [atkOf(p,att),0];   // Kikoho, Autodestruição e Duplo Sentido
  log(`Etapa de dano: ${att.def.name} (${a}) ataca ${tgt?tgt.def.name+' ('+d+')':'diretamente'}!`);
  render();
  if(tgt && a!==atkOf(p,att)) await tweenChip(att.uid, atkOf(p,att), a);   // mostra o ATQ de batalha (Kikoho, Duplo Sentido...)
  if(tgt && d!==atkOf(q,tgt)) await tweenChip(tgt.uid, atkOf(q,tgt), d);
  await clash(att, tgt, p);
  if(!tgt){ await damage(q, a); G.atkUid=null; render(); return; }
  if(a>d){
    await vanish(tgt.uid,q); toVoid(P(q),tgt); render();
    await damage(q, a-d);
    if(G.over) return;
    await afterBattle(p,att,q,tgt,false,true);
  } else if(a===d){
    log(`Empate! ${att.def.name} e ${tgt.def.name} vão para o vazio.`); toast('Empate: os dois vão para o vazio');
    await Promise.all([vanish(att.uid,p), vanish(tgt.uid,q)]);
    toVoid(P(p),att); toVoid(P(q),tgt); render();
    await afterBattle(p,att,q,tgt,true,false);
  } else {
    await vanish(att.uid,p); toVoid(P(p),att); render();
    await damage(p, d-a);
    if(G.over) return;
    await afterBattle(q,tgt,p,att,false,false);
  }
  G.atkUid=null; render();
}
// w/winner = quem destruiu; l/loser = quem foi destruído. tie: os dois foram destruídos.
async function afterBattle(w, winner, l, loser, tie, attackerWon){
  const sides=tie?[[w,winner,l,loser],[l,loser,w,winner]]:[[w,winner,l,loser]];
  for(const [pw,cw,pl_,cl] of sides){

async function timeUp(){                           // acabou o tempo: o turno termina sozinho
  G.tOut=true; const g=G;
  if(H.on) endHand();
  if(G.pick) endPick(null);
  if(G.modalRes){ const f=G.modalRes; G.modalRes=null; closeModal(); f(); } else closeModal();   // cancela escolhas abertas
  toast('Tempo esgotado!');
  const t0=Date.now();
  while(G===g && !G.over && G.busy && G.phase!=='end' && Date.now()-t0<9000){   // espera a animação em andamento
    if(G.pick) endPick(null);
    if(G.modalRes){ const f=G.modalRes; G.modalRes=null; closeModal(); f(); }
    await sleep(120);
  }
  if(G!==g || G.over || G.turn!==0 || G.phase==='end') return;
  G.busy=true; render(); await finalPhase(0);
}
/* trava de toque: enquanto uma animação (efeito, vida, golpe, carta voando) roda, nenhuma carta responde */
let LOCKN=0;
function lockOn(){ LOCKN++; document.body.classList.add('locked'); }
function lockOff(){ LOCKN=Math.max(0,LOCKN-1); if(!LOCKN) document.body.classList.remove('locked'); }
const blocked=()=> LOCKN>0 || (G && G.busy && G.turn===0 && !G.pick);
const withLock=f=>async(...a)=>{ lockOn(); try{ return await f(...a); } finally{ lockOff(); } };
const activateFx=(...a)=>withLock(activateFx_raw)(...a), lifeFx=(...a)=>withLock(lifeFx_raw)(...a), clash=(...a)=>withLock(clash_raw)(...a), vanish=(...a)=>withLock(vanish_raw)(...a);
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('on'),1600); }
async function banner(t){ const b=$('#banner'); b.textContent=t; b.classList.remove('on'); void b.offsetWidth; b.classList.add('on'); await sleep(950); b.classList.remove('on'); }

/* ============================================================
   REGRAS POR CARTA -> lista de ações disponíveis
   ============================================================ */
function actionsFor(p, inst, where){
  const pl=P(p), q=1-p, d=inst.def, L=[];
  const add=(label,reason,run)=>L.push({label,reason,run});
  const slotsP = freeIdx(pl.powers)>=0;
  if(where==='hand'){
    if(d.kind==='char') add('Invocar', freeIdx(pl.chars)<0?'Os 3 slots de Personagem estão ocupados.':null, async()=>{ await A.summon(p,inst); });
    if(d.kind==='field'){ const cur=P(0).field||P(1).field; add('Ativar no campo', (cur&&cur.id===inst.id)?'Essa carta de Campo já está em jogo.':null, async()=>await A.field(p,inst)); }
    if(d.kind==='support') add('Colocar em campo', slotsP?null:'Os 3 slots de Poder estão ocupados.', async()=>A.support(p,inst));
    if(d.kind==='tool'){
      const who=DEFS[TOOL_FOR[inst.id]], gs=chars(p).filter(c=>c.id===who.id);
      const gf=gs.filter(g=>canEquip(inst,g));       // no máximo 2 Ferramentas por Personagem
      add('Equipar', !gs.length?`Precisa de "${who.name}" em campo.`:(gf.length?null:'Cada Personagem pode ter no máximo 2 Ferramentas.'), async()=>{
        let g=gf[0];
        if(gf.length>1){ const r=await pickTarget(gf,{prompt:`Escolha quem receberá ${d.name}.`}); if(!r) return; g=r.target; }
        await A.tool(p,inst,g);
      });
    }
    if(d.kind==='item'){
      const noChar = !chars(p).some(isGZ) ? 'Precisa de um Personagem "Guerreiros Z" em campo.' : null;
      if(inst.id===11) add('Usar', noChar, async()=>await A.semente(p,inst));
      if(inst.id===9){
        const ch=chars(p).filter(isGZ);
        add('Usar', pl.life>500?'Precisa estar com 500 pontos de vida ou menos.':(ch.length!==1?'Precisa ter exatamente 1 Personagem "Guerreiros Z" em campo.':(ch[0].attacked?'Seu Personagem já atacou neste turno.':(canAttack(p)?null:'Você ainda não pode atacar.'))), async()=>await A.yaji(p,inst));
      }
      if(inst.id===19){
        const gs=chars(p).filter(c=>c.id===1&&c.equips.some(k=>k.id===17));
        add('Usar', gs.length?null:'Precisa de um "Goku - Guerreiros Z" equipado com "Kaioken".', async()=>{
          let g=gs[0];
          if(gs.length>1){ const r=await pickTarget(gs,{prompt:'Kaioken aumentado 4x: escolha o Goku.'}); if(!r) return; g=r.target; }
          await A.kaio4(p,inst,g);
        });
      }
      if(inst.id===20){
        const tg=itemTargets(q,chars(q)).filter(t=>atkOf(q,t)<=2000);
        add('Usar', !chars(p).some(c=>c.def.kame)?'Um dos seus Personagens precisa ter a habilidade "Kamehameha".':(tg.length?null:'O oponente não tem Personagem com 2000 de ATQ ou menos.'), async()=>{
          const r=await pickTarget(tg,{prompt:'Kamehameha: escolha o Personagem a destruir.'}); if(!r) return;
          await A.kame(p,inst,r.target);
        });
      }
      if(inst.id===24){
        const tg=itemTargets(q,chars(q)).filter(t=>atkOf(q,t)<=1000);
        add('Usar', !chars(p).some(c=>c.def.fios)?'Um dos seus Personagens precisa ter a habilidade "Fios Invisíveis".':(tg.length?null:'O oponente não tem Personagem com 1000 de ATQ ou menos.'), async()=>{
          const r=await pickTarget(tg,{prompt:'Fios invisíveis: escolha o Personagem do oponente.'}); if(!r) return;
          await A.fios(p,inst,r.target);
        });
      }
      if(inst.id===25){
        const tq=itemTargets(q,chars(q));
        add('Usar', !chars(p).some(c=>c.def.troca)?'Um dos seus Personagens precisa ter a habilidade "Troca de Marionetes".':(tq.length?null:'O oponente não tem Personagem que possa ser escolhido.'), async()=>{
          const r1=await pickTarget(tq,{prompt:'Troca de Marionetes: escolha o Personagem do oponente.'}); if(!r1) return;
          render(); const r2=await pickTarget(chars(p),{prompt:'Agora escolha o seu Personagem que irá para o oponente.'}); if(!r2) return;
          await A.troca(p,inst,r2.target,r1.target);
        });
      }
      if(inst.id===29){   // Da Shui Long
        const pw=oppPowers(q);
        add('Usar', !chars(p).some(c=>c.def.dsl)?'Um dos seus Personagens precisa ter a habilidade "Da Shui Long".':(pw.length?null:'O oponente não tem cartas de Poder em campo.'), async()=>await A.dsl(p,inst));
      }
      if(inst.id===28){   // Da Shui Long Zhi Gui
        const op=P(q).void.filter(c=>c.def.kind!=='char');
        add('Usar', !chars(p).some(c=>c.def.dslzg)?'Um dos seus Personagens precisa ter a habilidade "Da Shui Long Zhi Gui".':(!pl.void.some(c=>c.id===29)?'"Da Shui Long" precisa estar no seu vazio.':(op.length?null:'Não há cartas de Poder no vazio do oponente.')), async()=>{
          const r=await chooseFromList('Escolha uma carta de Poder do vazio do oponente',op); if(!r) return;
          await A.dslzg(p,inst,r);
        });
      }
      if(inst.id===30){   // Irmãos Ma Mei
        const bros=chars(p).filter(c=>[31,32,36].includes(c.id));
        const all3=[31,32,36].every(id=>bros.some(c=>c.id===id)), ok=bros.filter(c=>!c.attacked);
        add('Usar', !all3?'Precisa de "Mee Ma Mei", "Lee Ma Mei" e "Tee Ma Mei" em campo.':(!canAttack(p)?'Você ainda não pode atacar.':(ok.length?null:'Os três já atacaram neste turno.')), async()=>{
          const r=await pickTarget(ok,{prompt:'Irmãos Ma Mei: escolha quem pode atacar diretamente.'}); if(!r) return;
          await A.irmaos(p,inst,r.target);
        });
      }
      if(inst.id===12){
        const sups=supports(q);
        add('Usar', noChar || (sups.length?null:'O oponente não controla nenhum Apoiador.'), async()=>{
          let t=sups[0];
          if(sups.length>1){ const r=await pickTarget(sups,{prompt:'Escolha o Apoiador a destruir.'}); if(!r) return; t=r.target; }
          await A.disparo(p,inst,t);
        });
      }
      if(inst.id===13){
        const cs=zoneCands(pl,x=>x.id===14,inst);
        add('Usar', !supports(p).some(x=>x.id===10)?'Precisa da "Bulma" em campo.':cs.length?null:'Não há "Esferas do dragão" no baralho nem no vazio.', async()=>{
          const e=await chooseCards('Escolha as Esferas do dragão',cs); if(!e) return;
          await A.radar(p,inst,e);
        });
      }
      if(inst.id===14){
        const cc=zoneCands(pl,x=>x.def.kind==='char',inst), pc=zoneCands(pl,x=>x.def.kind!=='char',inst);
        add('Usar', pl.esf?'Só pode ativar 1 "Esferas do dragão" por turno.':((cc.length||pc.length)?null:'Não há cartas para buscar no baralho nem no vazio.'), async()=>{
          const m=await chooseMode('Esferas do dragão: escolha um efeito',[{label:'1. Adicionar um Personagem à mão',off:!cc.length},{label:'2. Adicionar um Poder à mão',off:!pc.length}]);
          if(m===null) return;
          const e=await chooseCards(m===0?'Escolha o Personagem':'Escolha o Poder',m===0?cc:pc); if(!e) return;
          await A.esferas(p,inst,e);
        });
      }
      if(inst.id===16){
        const gs=chars(p).filter(c=>c.id===1), pcs=chars(p).filter(c=>c.id===3);
        add('Usar', (gs.length&&pcs.length)?null:'Precisa de "Goku" e "Piccolo" em campo ao mesmo tempo.', async()=>{
          let g=gs[0], pc=pcs[0];
          if(gs.length>1){ const r=await pickTarget(gs,{prompt:'Autoescola: escolha o Goku.'}); if(!r) return; g=r.target; }
          if(pcs.length>1){ const r=await pickTarget(pcs,{prompt:'Autoescola: escolha o Piccolo.'}); if(!r) return; pc=r.target; }
          await A.auto(p,inst,g,pc);
        });
      }
      if(inst.id===15) add('Usar', !pl.void.some(c=>c.id===1)?'"Goku - Guerreiros Z" não está no seu vazio.':(freeIdx(pl.chars)<0?'Os 3 slots de Personagem estão ocupados.':null), async()=>{ let sl=null; if(p===0){ const r=await pickSlot('Caminho da serpente: escolha onde o Goku vai entrar.'); if(!r) return; sl=r.slot; } await A.caminho(p,inst,sl); });
    }
  }
  if(where==='field'){
    if(d.kind==='char'){
      add('Atacar', !canAttack(p)?'Quem começa a partida só ataca no 2º turno.':(inst.attacked?'Já atacou neste turno.':null), async()=>{
        const tg=atkTargets(q);
        if(tg.length===0){ await doAttack(p,inst,null); return; }
        const r=await pickTarget(tg,{prompt:`Escolha o alvo de ${d.name}.`, direct:inst.direct, attack:true, foe:q});
        if(!r) return;
        await doAttack(p,inst,r.direct?null:r.target);
      });
      if(inst.id===3){
        const goku=chars(p).find(c=>c.id===1);
        add('Efeito: enviar Goku ao vazio',
          inst.used?'Já usado neste turno.':(inst.attacked?'Piccolo já atacou neste turno.':(goku?null:'Precisa de "Goku - Guerreiros Z" em campo.')),
          async()=>{
            const gs=chars(p).filter(c=>c.id===1); let g=gs[0];
            if(gs.length>1){ const r=await pickTarget(gs,{prompt:'Escolha o Goku a enviar ao vazio.'}); if(!r) return; g=r.target; }
            await A.picc(p,inst,g);
          });
      }
    }
    if(inst.id===21) add('Efeito: Me dá meu cajado', inst.used?'Já usado neste turno.':(pl.deck.some(x=>x.id===22)?null:'Não há "Cajado do Zé" no baralho.'), async()=>await A.ze(p,inst,pl.deck.find(x=>x.id===22)));
    if(inst.id===35) add('Efeito: Venha! Da Shui Long', inst.used?'Já usado neste turno.':(pl.deck.some(isDSL)?null:'Não há cartas "Da Shui Long" no baralho.'), async()=>{
      const r=await chooseFromList('Escolha uma carta "Da Shui Long" do baralho',pl.deck.filter(isDSL)); if(!r) return;
      await A.taishizu(p,inst,r);
    });
    if(inst.id===27) add('Efeito: buscar carta "Ma Mei"', inst.used?'Já usado neste turno.':(pl.deck.some(isMaMei)?null:'Não há cartas "Ma Mei" no baralho.'), async()=>{
      const r=await chooseFromList('Escolha uma carta "Ma Mei" do baralho',pl.deck.filter(isMaMei)); if(!r) return;
      await A.casa(p,r,inst);
    });
    if(inst.id===26){ const n=chars(p).filter(isMaMei).length;
      add('Efeito: ganhar vida', inst.used?'Já usado neste turno.':(n?null:'Não há Personagens "Ma Mei" no seu campo.'), async()=>await A.nainai(p,inst)); }
    if(inst.id===8) add('Efeito: buscar Guerreiro Z', inst.used?'Já usado neste turno.':(pl.deck.some(isGZ)?null:'Não há cartas "Guerreiros Z" no baralho.'), async()=>{
      const r=await chooseFromList('Escolha um "Guerreiro Z" do baralho',pl.deck.filter(isGZ)); if(!r) return;
      await A.casa(p,r,inst);
    });
    if(inst.id===10) add('Efeito: buscar Radar do dragão', inst.used?'Já usado neste turno.':(pl.deck.some(x=>x.id===13)?null:'Não há "Radar do dragão" no baralho.'), async()=>await A.bulma(p,inst));
    if(inst.id===18){
      const cs=pl.deck.filter(x=>x.id===15||x.id===17||x.id===19);
      add('Efeito: buscar carta', inst.used?'Já usado neste turno.':(!chars(p).some(c=>c.id===1)?'Precisa de "Goku - Guerreiros Z" em campo.':(cs.length?null:'Não há "Caminho da serpente", "Kaioken" ou "Kaioken aumentado 4x" no baralho.')), async()=>{
        const r=await chooseFromList('Senhor Kaioh: escolha uma carta do baralho',cs); if(!r) return;
        await A.kaioh(p,inst,r);
      });
    }
  }
  // animação primeiro, efeito (e escolhas) depois
  const fxFirst = a => a.label==='Usar' || a.label==='Equipar' || a.label.startsWith('Efeito');
  L.forEach(a=>{ if(!fxFirst(a)) return; const r0=a.run, stay=where==='field';
    a.run=async()=>{ await activateFx(p,inst,stay); inst.fxDone=true; try{ return await r0(); } finally{ inst.fxDone=false; } }; });
  L.forEach(a=>{   // cada ação só vale na sua fase
    if(a.label==='Atacar'){ if(G.phase!=='attack') a.reason='Só na fase de ataque.'; }
    else if(inst.def.kind==='item' && where==='hand'){ if(G.phase!=='prep' && G.phase!=='attack') a.reason='Itens só nas fases de preparação e ataque.'; }
    else if(inst.id===3 && where==='field'){ if(G.phase!=='prep' && G.phase!=='attack') a.reason='Só nas fases de preparação e ataque.'; }   // Piccolo: preparação ou batalha
    else if(G.phase!=='prep') a.reason='Só na fase de preparação.';
  });
  return L;
}

/* ============================================================
   ESCOLHA DE ALVO / LISTA
   ============================================================ */
function pickTarget(cands, opt){
  closeModal();
  return new Promise(res=>{
    G.pick={set:new Set(cands.map(c=>c.uid)),map:new Map(cands.map(c=>[c.uid,c])),prompt:opt.prompt,direct:!!opt.direct,attack:!!opt.attack,foe:opt.foe,res};
    render();
  });
}
function endPick(v){ const r=G.pick.res; G.pick=null; render(); r(v); }
function searchList(title, entries){        // lista vertical estilo Yu-Gi-Oh, agrupada com "x2"
  return new Promise(res=>{
    const box=el('div','mbox'); box.appendChild(el('div','big',title));
    const list=el('div','slist');
    const groups=new Map();
    entries.forEach(e=>{ const k=e.inst.id+'|'+(e.label||''); if(!groups.has(k)) groups.set(k,{inst:e.inst,label:e.label,n:0}); groups.get(k).n++; });
    groups.forEach(g=>{
      const d=g.inst.def, r=el('div','srow'+(g.label==='Vazio'?' void':''));
      const th=el('div','sth'); th.style.backgroundImage=`url("${d.mini}")`; r.appendChild(th);
      const info=el('div','sinfo');
      info.appendChild(el('div','sname',d.name));
      let sub=kindIco(d.kind)+KIND[d.kind];
      if(d.kind==='char') sub+=` · ${elIco(d.el)}${ELEM[d.el].n} · ATQ ${d.atk}`;
      if(g.label) sub+=` · ${g.label}`;
      info.appendChild(el('div','ssub',sub));
      r.appendChild(info);
      if(g.n>1) r.appendChild(el('div','scount','x'+g.n));
      r.addEventListener('click',()=>{ closeModal(); res(g.inst); });
      list.appendChild(r);
    });
    box.appendChild(list); box.appendChild(btn('Cancelar','sec',()=>{closeModal();res(null);}));
    G.modalRes=()=>res(null); showModal(box);
  });
}
const chooseFromList = (title, insts) => searchList(title, insts.map(i=>({inst:i,label:null})));
const chooseCards = (title, cands) => searchList(title, cands);

function zoneCands(pl, pred, exclude){   // todas as cópias: a lista agrupa e mostra o "xN"
  const out=[];
  pl.deck.forEach(i=>{ if(i!==exclude&&pred(i)) out.push({inst:i,label:'Baralho'}); });
  pl.void.forEach(i=>{ if(i!==exclude&&pred(i)) out.push({inst:i,label:'Vazio'}); });
  return out;
}
function chooseMode(title, opts){
  return new Promise(res=>{
    const box=el('div','mbox'); box.appendChild(el('div','big',title));
    const acts=el('div','acts');
    opts.forEach((o,i)=>{ const b=btn(o.label,'',()=>{closeModal();res(i);}); if(o.off) b.disabled=true; acts.appendChild(b); });
    box.appendChild(acts); box.appendChild(btn('Cancelar','sec',()=>{closeModal();res(null);}));
    G.modalRes=()=>res(null); showModal(box);
  });
}

/* ============================================================
   MODAIS
   ============================================================ */
function showModal(node){ const m=$('#modal'); m.innerHTML=''; m.appendChild(node); m.classList.add('on'); }
function closeModal(){ const m=$('#modal'); m.classList.remove('on'); m.innerHTML=''; }
function canAct(){ return G && !G.over && !G.busy && G.turn===0 && !G.pick; }

function bigArt(e,d){ e.style.backgroundImage=`url("${d.mini}")`; if(d.mini===d.img) return; const im=new Image(); im.onload=()=>{ e.style.backgroundImage=`url("${d.img}")`; }; im.src=d.img; }
function cardModal(inst, p, where){
  const box=el('div','mbox');
  const big=el('div','bigcard'); bigArt(big,inst.def); box.appendChild(big);
  const info = inst.def.kind==='char'
    ? `Tipo: ${elIco(inst.def.el)}${ELEM[inst.def.el].n} · Arquétipo: ${inst.def.arq.join(' / ')}<br><b style="color:#fff">ATQ atual: ${atkOf(p,inst)}</b>`
    : kindIco(inst.def.kind)+KIND[inst.def.kind];
  box.appendChild(el('div','',`<div style="font-size:34px;color:#bbb;line-height:1.4">${info}</div>`));
  const acts=el('div','acts');
  if(canAct() && ((p===0 && where==='hand') || (where==='field' && (p===0 || inst.def.kind==='field')))){
    actionsFor(0,inst,where).forEach(a=>{
      const b=btn(a.label,'',()=>runAction(a)); if(a.reason) b.disabled=true; acts.appendChild(b);
      if(a.reason) acts.appendChild(el('div','why',a.reason));
    });
  }
  box.appendChild(acts);
  box.appendChild(btn('Fechar','sec',closeModal));
  showModal(box);
}
function voidModal(p){
  const pl=P(p); const box=el('div','mbox');
  box.appendChild(el('div','big',`Vazio ${p?'do oponente':'seu'} (${pl.void.length})`));
  const list=el('div','list');
  if(!pl.void.length) list.appendChild(el('div','',`<span style="font-size:34px;color:#aaa">Nenhuma carta no vazio.</span>`));
  pl.void.slice().reverse().forEach(i=>{ const c=el('div','c'); c.style.backgroundImage=`url("${mini(i)}")`; c.onclick=()=>cardModal(i,p,'void'); list.appendChild(c); });
  box.appendChild(list); box.appendChild(btn('Fechar','sec',closeModal));
  showModal(box);
}
async function runAction(a){
  closeModal(); G.busy=true; render();
  try{ await a.run(); } finally { if(!G.over && G.turn===0) G.busy=false; render(); checkWin(); }
}

  } });
  seen=now;
}

/* ============================================================
   MÃO: deslizar o dedo levanta a carta; arrastar para cima leva ao campo
   ============================================================ */
const H={on:false};
function toStage(cx,cy){ const s=$('#stage').getBoundingClientRect(), k=s.width/1080; return {x:(cx-s.left)/k, y:(cy-s.top)/k}; }
function handAt(cx){                            // carta da mão sob o dedo (a mais à frente)
  let best=null; document.querySelectorAll('#board .hand').forEach(h=>{ const r=h.getBoundingClientRect(); if(cx>=r.left && cx<=r.right) best=h; });
  return best;
}
function setLift(h){ document.querySelectorAll('#board .hand.lift').forEach(x=>{ if(x!==h) x.classList.remove('lift'); }); if(h) h.classList.add('lift'); }
function dropTargets(inst){                     // onde essa carta pode ser solta
  const pl=P(0), k=inst.def.kind, out=[];
  if(k==='char') pl.chars.forEach((c,i)=>{ if(!c) out.push('c'+i); });
  else if(k==='support') pl.powers.forEach((c,i)=>{ if(!c) out.push('w'+i); });
  else if(k==='tool') pl.chars.forEach((c,i)=>{ if(canEquip(inst,c)) out.push('c'+i); });
  else if(k==='field'){ const cur=P(0).field||P(1).field; if(!(cur&&cur.id===inst.id)) out.push('f'); }
  return out;   // item: qualquer lugar do campo
}
function zoneUnder(cx,cy){ let z=null; document.querySelectorAll('#board .zone.drop').forEach(e=>{ const r=e.getBoundingClientRect(); if(cx>=r.left-20&&cx<=r.right+20&&cy>=r.top-20&&cy<=r.bottom+20) z=e; }); return z; }
$('#board').addEventListener('pointerdown', e=>{
  const h=e.target.closest('.hand'); if(!h || !G || G.over || G.pick || blocked()) return;
  e.preventDefault();
  H.on=true; H.id=e.pointerId; H.x0=e.clientX; H.y0=e.clientY; H.moved=false; H.drag=false; H.h=h; H.peeked=false;
  H.inst=P(0).hand[+h.dataset.hi]; setLift(h); peekArm();
});
const PEEK_MS=550;                                 // tempo com o dedo parado sobre a carta até ela aparecer grande
function peekHide(){ clearTimeout(H.pt); if(H.peek){ H.peek.remove(); H.peek=null; } }
function peekArm(){ peekHide(); H.pt=setTimeout(()=>{ if(!H.on || H.drag || !H.inst) return;
  H.peek=el('div','peek'); H.peek.style.backgroundImage=`url("${H.inst.def.img}")`; $('#stage').appendChild(H.peek); H.peeked=true; }, PEEK_MS); }
function inItemZone(cx,cy){ const z=document.querySelector('.itemzone'); if(!z) return false; const r=z.getBoundingClientRect(); return cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom; }
addEventListener('pointermove', e=>{
  if(!H.on || e.pointerId!==H.id) return;
  const dx=e.clientX-H.x0, dy=e.clientY-H.y0, k=$('#stage').getBoundingClientRect().width/1080;
  if(Math.hypot(dx,dy)>10*k) H.moved=true;
  if(!H.drag){
    const p=toStage(e.clientX,e.clientY);
    if(p.y < 1560 && canAct()){                 // saiu da mão para cima: começa a arrastar
      H.drag=true; peekHide(); H.h.classList.remove('lift'); H.h.classList.add('dragging');
      if(H.inst.def.kind==='item'){ H.zone=el('div','itemzone'); $('#stage').appendChild(H.zone); }
      H.ghost=el('div','ghost'); H.ghost.style.backgroundImage=`url("${mini(H.inst)}")`; $('#stage').appendChild(H.ghost);
      H.targets=dropTargets(H.inst);
      H.targets.forEach(t=>{ const z=document.querySelector(`#board [data-drop="${t}"]`); if(z) z.classList.add('drop'); });
    } else {                                    // deslizando sobre a mão: levanta a carta sob o dedo
      if(Math.abs(dx)>Math.abs(dy)){ const h=handAt(e.clientX); if(h && h!==H.h){ H.h=h; H.inst=P(0).hand[+h.dataset.hi]; peekArm(); } }   // só troca deslizando para o lado
      setLift(H.h);
    }
  }
  if(H.drag){
    const p=toStage(e.clientX,e.clientY); H.ghost.style.left=p.x+'px'; H.ghost.style.top=p.y+'px';
    const z=zoneUnder(e.clientX,e.clientY); document.querySelectorAll('#board .zone.over').forEach(x=>{ if(x!==z) x.classList.remove('over'); }); if(z) z.classList.add('over');
    if(H.zone) H.zone.classList.toggle('over', inItemZone(e.clientX,e.clientY));
  }
});
function endHand(){
  peekHide(); if(H.zone){ H.zone.remove(); H.zone=null; }
  if(H.ghost) H.ghost.remove();
  document.querySelectorAll('#board .zone.drop').forEach(z=>z.classList.remove('drop','over'));
  document.querySelectorAll('#board .hand').forEach(h=>h.classList.remove('lift','dragging'));
  H.on=false; H.drag=false; H.ghost=null;
}
addEventListener('pointerup', e=>{ if(!H.on || e.pointerId!==H.id) return;
  const inst=H.inst, drag=H.drag, moved=H.moved, peeked=H.peeked;
  const z=drag?zoneUnder(e.clientX,e.clientY):null, p=toStage(e.clientX,e.clientY);
  const okItem = drag && inst && inst.def.kind==='item' && inItemZone(e.clientX,e.clientY);
  const gr = H.ghost ? stageRect(H.ghost) : null;
  endHand();
  if(!drag){ if(!moved && !peeked && inst) cardModal(inst,0,'hand'); return; }      // toque simples: abre a carta
  if(okItem && gr) G.fxFrom=gr;                                                     // a ativação começa de onde a carta foi solta
  dropPlay(inst, z?z.dataset.drop:null, p.y, okItem);
});
addEventListener('pointercancel', ()=>{ if(H.on) endHand(); });
async function dropPlay(inst, slot, y, okItem){
  if(!canAct() || !P(0).hand.includes(inst)) return;
  const k=inst.def.kind, a=actionsFor(0,inst,'hand')[0];
  if(!a) return;
  if(a.reason){ toast(a.reason); return; }
  if(k==='item'){ if(okItem) await runAction(a); else G.fxFrom=null; return; }   // item: solta dentro da área amarela
  if(!slot) return;                                                       // fora de um slot válido: volta para a mão
  const i=+slot.slice(1);
  if(k==='char')    { G.settle=inst.uid; await runAction({run:()=>A.summon(0,inst,i)}); }
  if(k==='support') { G.settle=inst.uid; await runAction({run:async()=>A.support(0,inst,i)}); }
  if(k==='field')   { G.settle=inst.uid; await runAction({run:async()=>await A.field(0,inst)}); }
  if(k==='tool')    { const g=P(0).chars[i]; if(!canEquip(inst,g)){ toast('Cada Personagem pode ter no máximo 2 Ferramentas.'); return; } await runAction({run:async()=>await A.tool(0,inst,g)}); }
}

/* ============================================================
   FLUXO DE PARTIDA
   ============================================================ */
async function draw(p){
  const pl=P(p);
  if(!pl.deck.length){ log(`${p?'Oponente':'Você'} não tem cartas para comprar!`); endGame(1-p); return false; }
  const c=pl.deck.shift();
  await drawAnim(p,c);
  pl.hand.push(c); seen.add(c.uid); render(); return true;
}
async function startTurn(p){
  if(G.over) return;
  G.turn=p; G.phase='prep'; G.turnNo++; const pl=P(p); pl.turns++; timerStart();
  pl.esf=false;
  [...P(0).chars,...P(1).chars].filter(Boolean).forEach(c=>{c.tmp=null; c.imm=false;});   // efeitos 'até o fim do turno' terminam
  [...pl.chars,...pl.powers].filter(Boolean).forEach(c=>{c.attacked=false;c.direct=false;c.used=false;});
  [P(0).field,P(1).field].filter(Boolean).forEach(c=>{c.used=false;});   // efeito do campo: 1x por turno, vale para quem estiver jogando
  G.busy=true; render();
  await banner(p===0?'SEU TURNO':'TURNO DO OPONENTE');
  if(G.over) return;
  if(!(await draw(p))) return;
  log(p===0?'Você comprou uma carta.':'Oponente comprou uma carta.');
  if(!canAttack(p)) log(p===0?'Primeiro turno: você ainda não pode atacar.':'Primeiro turno do oponente: ele não pode atacar.');
  render();
  if(p===1){ await botTurn(); }
  else { G.busy=false; render(); }
}
async function banner2(t){ render(); await banner(t); }
async function goAttack(p){
  G.phase='attack'; render(); await banner('FASE DE ATAQUE');
}
async function finalPhase(p){
  if(G.over) return;
  G.busy=true; G.phase='end';
  [...P(0).chars,...P(1).chars].filter(Boolean).forEach(c=>{c.tmp=null;});   // 'até o fim do turno' acaba aqui
  render(); await banner('FASE FINAL');
  for(const x of [0,1]) for(const c of chars(x)) if(c.doom){ log(`Kaioken aumentado 4x: ${c.def.name} vai para o vazio.`); await vanish(c.uid,x); toVoid(P(x),c); render(); }
  [...P(0).chars,...P(1).chars].filter(Boolean).forEach(c=>{c.boost=0;});
  await startTurn(1-p);
}
async function endTurnHuman(){            // botão da direita: preparação -> ataque -> fim
  if(!canAct()) return;
  closeModal();
  G.busy=true; render();
  if(G.phase==='prep' && canAttack(0) && P(0).chars.some(Boolean)){
    await goAttack(0);
    if(G.over) return;
    G.busy=false; render();
  } else {
    await finalPhase(0);
  }
}
function endGame(winner){
  if(G.over) return; G.over=true; G.busy=true; musicStop(); render();
  const won=winner===0, life=Math.max(0,P(0).life);
  const reward=matchReward(won, life);
  setTimeout(async()=>{
    const box=el('div','mbox');
    box.appendChild(el('div','big',`<span style="font-size:130px;font-weight:900;color:${won?'#2ee66b':'#e60012'}">${won?'VITÓRIA!':'DERROTA'}</span>`));
    const rw=el('div','rew'); rw.appendChild(el('div','note','Calculando XP...')); box.appendChild(rw);
    const row=el('div','row'); row.appendChild(btn('Jogar de novo','',()=>{ leaveMatch(); startFlow(); })); row.appendChild(btn('Menu inicial','sec',goHome)); box.appendChild(row);
    showModal(box);
    showReward(rw, await reward);
  },900);
}

/* ---- XP no fim da partida ---- */
async function matchReward(won, life){
  if(SB && ACC.user){
    try{ const {data,error}=await SB.rpc('finish_match',{p_won:won, p_life:life, p_mode:'pve'}); if(error) throw error;
      if(data && data.ok){ if(ACC.profile){ ACC.profile.xp=data.xp_after; if(data.crystals_after!=null) ACC.profile.crystals=data.crystals_after; ACC.profile.games=(ACC.profile.games|0)+1; ACC.profile[won?'wins':'losses']=(ACC.profile[won?'wins':'losses']|0)+1; } return {...data, saved:true}; }
      return {ok:false, reason:data&&data.reason};
    }catch(e){ return {ok:false, reason:'erro'}; }
  }
  // convidado: mostra quanto ganharia (não salva)
  const today=new Date().toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'}); let last=null; try{ last=localStorage.getItem('amv_gw'); }catch(e){}
  const base=won?100:25, tags=[]; let bonus=0;
  if(won){ if(last!==today){ bonus+=100; tags.push('Primeira vitória do dia +100'); try{ localStorage.setItem('amv_gw',today); }catch(e){} }
    if(life>=10000){ bonus+=100; tags.push('Perfect +100'); } else if(life<=100){ bonus+=500; tags.push('Imortal +500'); } else if(life<=1000){ bonus+=50; tags.push('Foi por pouco +50'); } }
  return {ok:true, guest:true, base, bonus, tags, mult:MULT, total:(base+bonus)*MULT, crystals:won?100:0};
}
function showReward(rw, r){
  rw.replaceChildren();
  if(!r.ok){ rw.appendChild(el('div','note', r.reason==='rapida_demais'?'Partida muito curta: o XP não foi contado.':r.reason==='sem_partida'?'Não foi possível registrar esta partida.':'Sem conexão: o XP desta partida não foi salvo.')); return; }
  rw.appendChild(el('div','ln',`<span>${r.base===100?'Vitória':'Derrota'}</span><b>+${r.base} XP</b>`));

  if(r.guest){ rw.appendChild(el('div','note','Crie uma conta para salvar seu progresso.')); if(SB) rw.appendChild(btn('Criar conta','',()=>{ leaveMatch(); goHome(); setTimeout(()=>authModal('signup'),300); })); return; }
  const a=levelInfo(r.xp_before), b=levelInfo(r.xp_after);
  const tag=el('span','lvl','Nível '+a.lvl); rw.appendChild(tag);
  const bar=el('div','xpbar'), fill=el('i'), lbl=el('span'); bar.appendChild(fill); bar.appendChild(lbl); rw.appendChild(bar);
  const setBar=(into,need,anim)=>{ fill.style.transition=anim?'width .9s ease-out':'none'; fill.style.width=(need?100*into/need:100)+'%'; lbl.textContent=need?`${into.toLocaleString('pt-BR')} / ${need.toLocaleString('pt-BR')} XP`:'Nível máximo'; };
  setBar(a.into,a.need,false);
  (async()=>{ await sleep(250);
    for(let L=a.lvl; L<b.lvl; L++){ setBar(xpNeed(L),xpNeed(L),true); await sleep(1000); tag.textContent='Nível '+(L+1); setBar(0,xpNeed(L+1),false); await sleep(60); }   // enche, zera e a sobra começa o próximo
    setBar(b.into,b.need,true);
    if(b.lvl>a.lvl) rw.appendChild(el('div','up',`Subiu de nível! ${b.lvl>a.lvl+1?`(+${b.lvl-a.lvl}) `:''}Nível ${b.lvl}`));
  })();
}

async function beginMatch(first){
  const myDeck=loadDeck();
  const scen=SCENARIOS[Math.floor(Math.random()*SCENARIOS.length)], si=SCEN_IMG[scen];
  if(si && !si.complete) await new Promise(r=>{ si.addEventListener('load',r,{once:true}); si.addEventListener('error',r,{once:true}); setTimeout(r,6000); });
  if(si && si.decode) await si.decode().catch(()=>{});
  LF=[MAX_LIFE,MAX_LIFE];
  if(SB && ACC.user) SB.rpc('start_match').then(()=>{},()=>{});       // o servidor marca o início (confere a duração no fim)
  G={p:[newPlayer(myDeck),newPlayer(BOT_DECK)],turn:0,first,over:false,busy:true,pick:null,log:[],index:new Map(),turnNo:0,scen};
  G.p.forEach((pl,i)=>pl.deck.forEach(c=>{ c.own=i; }));        // dono da carta (o vazio é sempre o do dono)
  for(const p of [0,1]){
    const pl=P(p);
    for(let i=0;i<HAND_START;i++) pl.hand.push(pl.deck.shift());
    if(!pl.hand.some(c=>c.def.kind==='char')){            // garante 1 Personagem na mão inicial
      const k=pl.deck.findIndex(c=>c.def.kind==='char');
      if(k>=0){ const ch=pl.deck.splice(k,1)[0]; const out=pl.hand.pop(); pl.deck.push(out); pl.hand.push(ch); shuffle(pl.deck); }
    }
  }
  setScenario(true); $('#screen').innerHTML=''; musicStart();
  log(first===0?'Você começou! (não ataca no 1º turno)':'O oponente começa. Você pode atacar no seu 1º turno.');
  render();
  await sleep(300);
  await startTurn(first);
}

/* ============================================================
   IA SIMPLES
   ============================================================ */
async function botTurn(){
  const p=1,q=0,pl=P(p),ql=P(q);
  const pause=async ms=>{ await sleep(ms); render(); return !G.over; };
  const hand=id=>pl.hand.find(c=>c.id===id);
  const freeC=()=>freeIdx(pl.chars)>=0, freeP=()=>freeIdx(pl.powers)>=0;
  const projAtk=c=>atkOf(p,c);
  const bAtk=a=>atkOf(p,a)+(a.id===5?300:0);
  const bDef=t=>atkOf(q,t)-(t.id===7?300:0);
  const cv=(a,t)=>clashVals(p,a,q,t), wins=(a,t)=>{ const v=cv(a,t); return v[0]>v[1]; }, ties=(a,t)=>{ const v=cv(a,t); return v[0]===v[1]; };
  await sleep(500);
  const summonAll=async()=>{
    while(freeC()){
      const cs=pl.hand.filter(x=>x.def.kind==='char').sort((a,b)=>projAtk(b)-projAtk(a));
      if(!cs.length) return true;
      await A.summon(p,cs[0]); if(!await pause(800)) return false;
    }
    return true;
  };

  // 1) Casa do Kame
  let c=hand(8);
  if(c && !P(0).field && !pl.field){ await A.field(p,c); if(!await pause(800)) return; }
  const fld=P(0).field||P(1).field;
  if(fld && fld.id===8 && !fld.used){
    const opts=pl.deck.filter(isGZ).sort((a,b)=>projAtk(b)-projAtk(a));
    if(opts.length){ await A.casa(p,opts[0],fld); if(!await pause(800)) return; }
  }
  // 1b) Pastelaria Ma Mei
  c=hand(27);
  if(c && !P(0).field && !pl.field){ await A.field(p,c); if(!await pause(800)) return; }
  const f2=P(0).field||P(1).field;
  if(f2 && f2.id===27 && !f2.used){
    const opts=pl.deck.filter(isMaMei).sort((a,b)=>(b.def.kind==='char'?atkOf(p,b):0)-(a.def.kind==='char'?atkOf(p,a):0));
    if(opts.length){ await A.casa(p,opts[0],f2); if(!await pause(800)) return; }
  }
  // 1c) Taishizu: busca Da Shui Long
  const ts=chars(p).find(x=>x.id===35&&!x.used);
  if(ts){ const r=pl.deck.find(x=>x.id===29)||pl.deck.find(isDSL); if(r){ await A.taishizu(p,ts,r); if(!await pause(800)) return; } }
  // 2) Bulma -> Radar -> Esferas
  c=hand(10);
  if(c && freeP() && pl.deck.some(x=>x.id===13)){ A.support(p,c); if(!await pause(800)) return; }
  const bu=pl.powers.find(x=>x&&x.id===10&&!x.used);
  if(bu && pl.deck.some(x=>x.id===13)){ await A.bulma(p,bu); if(!await pause(800)) return; }
  c=hand(13);
  if(c && supports(p).some(x=>x.id===10)){ const e=pl.deck.find(x=>x.id===14)||pl.void.find(x=>x.id===14); if(e){ await A.radar(p,c,e); if(!await pause(800)) return; } }
  // 2b) Senhor Kaioh
  c=hand(18);
  if(c && freeP() && chars(p).some(x=>x.id===1)){ A.support(p,c); if(!await pause(700)) return; }
  const ka=pl.powers.find(x=>x&&x.id===18&&!x.used);
  if(ka && chars(p).some(x=>x.id===1)){
    const want = (!hand(17) && chars(p).some(x=>x.id===1&&!x.equips.length)) ? 17 : (!hand(19) && (hand(17)||chars(p).some(x=>x.equips.length))) ? 19 : 15;
    const pick = pl.deck.find(x=>x.id===want) || pl.deck.find(x=>x.id===17||x.id===19||x.id===15);
    if(pick){ await A.kaioh(p,ka,pick); if(!await pause(800)) return; }
  }
  // 3) Caminho da serpente (traz Goku do vazio)
  c=hand(15);
  if(c && pl.void.some(x=>x.id===1) && freeC()){ await A.caminho(p,c); if(!await pause(900)) return; }
  // 4) Invocar Personagens
  if(!await summonAll()) return;
  // 5) Esferas do dragão: busca o melhor Personagem se ainda houver espaço
  c=hand(14);
  if(c && !pl.esf && freeC()){
    const cand=[...pl.deck,...pl.void].filter(x=>x.def.kind==='char'&&x!==c).sort((a,b)=>projAtk(b)-projAtk(a))[0];
    if(cand){ await A.esferas(p,c,cand); if(!await pause(900)) return; if(!await summonAll()) return; }
  }
  c=hand(15);
  if(c && pl.void.some(x=>x.id===1) && freeC()){ await A.caminho(p,c); if(!await pause(900)) return; }
  // 5b) Nainai Ma Mei
  c=hand(26);
  if(c && freeP() && chars(p).some(isMaMei)){ A.support(p,c); if(!await pause(700)) return; }
  const nn=pl.powers.find(x=>x&&x.id===26&&!x.used);
  if(nn && chars(p).some(isMaMei)){ await A.nainai(p,nn); if(!await pause(800)) return; }
  // 5c) Da Shui Long / Zhi Gui
  c=hand(28);
  if(c && chars(p).some(x=>x.def.dslzg) && pl.void.some(x=>x.id===29)){ const t=P(q).void.find(x=>x.def.kind!=='char'); if(t){ await A.dslzg(p,c,t); if(!await pause(900)) return; } }
  c=hand(29);
  if(c && chars(p).some(x=>x.def.dsl) && oppPowers(q).length>=1){ await A.dsl(p,c); if(!await pause(900)) return; }
  // 6) Semente
  c=hand(11);
  if(c && chars(p).length && pl.life<=2500){ await A.semente(p,c); if(!await pause(900)) return; }
  // 6b) Kamehameha: destrói o Personagem mais forte com até 2000 de ATQ
  c=hand(20);
  if(c && chars(p).some(x=>x.def.kame)){ const t=itemTargets(q,chars(q)).filter(x=>atkOf(q,x)<=2000&&!(x.id===32&&!x.imm)).sort((a,b)=>atkOf(q,b)-atkOf(q,a))[0]; if(t){ await A.kame(p,c,t); if(!await pause(900)) return; } }
  // 7) Disparo de Ki
  c=hand(12);
  if(c && chars(p).length && supports(q).length){ await A.disparo(p,c,supports(q)[0]); if(!await pause(900)) return; }
  // 8) Zé do Trovão: busca e equipa o Cajado
  const zz=chars(p).find(x=>x.id===21&&!x.used);
  if(zz && !hand(22) && pl.deck.some(x=>x.id===22)){ await A.ze(p,zz,pl.deck.find(x=>x.id===22)); if(!await pause(800)) return; }
  c=hand(22);
  const zt=chars(p).filter(x=>canEquip({id:22},x)).sort((a,b)=>atkOf(p,b)-atkOf(p,a))[0];
  if(c && zt){ await A.tool(p,c,zt); if(!await pause(900)) return; }
  // 8b) Fios invisíveis: dano igual ao ATQ do alvo (pega o maior até 1000)
  c=hand(24);
  if(c && chars(p).some(x=>x.def.fios)){ const t=itemTargets(q,chars(q)).filter(x=>atkOf(q,x)<=1000&&!(x.id===32&&!x.imm)).sort((a,b)=>atkOf(q,b)-atkOf(q,a))[0]; if(t){ await A.fios(p,c,t); if(G.over||!await pause(900)) return; } }
  // 8c) Troca de Marionetes: troca o meu mais fraco pelo mais forte dele, se valer a pena
  c=hand(25);
  if(c && chars(p).some(x=>x.def.troca) && chars(q).length){
    const mine=chars(p).filter(x=>!x.def.troca||chars(p).filter(y=>y.def.troca).length>1).sort((a,b)=>atkOf(p,a)-atkOf(p,b))[0];
    const theirs=itemTargets(q,chars(q)).filter(x=>!(x.id===32&&!x.imm)).sort((a,b)=>atkOf(q,b)-atkOf(q,a))[0];
    if(mine && theirs && atkOf(q,theirs)>atkOf(p,mine)+200){ await A.troca(p,c,mine,theirs); if(!await pause(900)) return; }
  }
  // 9) Kaioken
  c=hand(17);
  const goku=chars(p).filter(x=>x.id===1&&x.equips.length<2).sort((a,b)=>atkOf(p,b)-atkOf(p,a))[0];
  if(c && goku){
    const strongest=Math.max(0,...chars(q).map(t=>atkOf(q,t)));
    if(chars(q).length===0 || atkOf(p,goku)+400>strongest){ await A.tool(p,c,goku); if(!await pause(900)) return; }
  }
  // 10) Autoescola: só se transformar um ataque perdedor em vencedor
  c=hand(16);
  const ag=chars(p).find(x=>x.id===1&&!x.attacked), ap=chars(p).find(x=>x.id===3&&!x.attacked);
  if(c && ag && ap && canAttack(p) && chars(q).length){
    const avg=Math.round((atkOf(p,ag)+atkOf(p,ap))/2), top=Math.max(...chars(q).map(bDef));
    if(avg>top && Math.min(atkOf(p,ag),atkOf(p,ap))<=top){ await A.auto(p,c,ag,ap); if(!await pause(900)) return; }
  }
  // 9b) Kaioken aumentado 4x: só se virar um ataque vencedor ou for letal
  c=hand(19);
  const gk=chars(p).find(x=>x.id===1&&x.equips.some(k=>k.id===17)&&!x.attacked&&!x.doom);
  if(c && gk && canAttack(p)){
    const now=atkOf(p,gk), tg=chars(q);
    const lethal = !tg.length && now<ql.life && now+1000>=ql.life;
    const turns  = tg.length && !tg.some(t=>bDef(t)<now) && tg.some(t=>bDef(t)<now+1000);
    if(lethal||turns){ await A.kaio4(p,c,gk); if(!await pause(900)) return; }
  }
  // 10b) Irmãos Ma Mei: o mais forte dos três ataca direto
  c=hand(30);
  if(c && canAttack(p) && [31,32,36].every(id=>chars(p).some(x=>x.id===id))){
    const b=chars(p).filter(x=>[31,32,36].includes(x.id)&&!x.attacked).sort((a,b)=>atkOf(p,b)-atkOf(p,a))[0];
    if(b && chars(q).length){ await A.irmaos(p,c,b); if(!await pause(900)) return; }
  }
  // 11) Yajirobe (item)
  c=hand(9);
  if(c && canAttack(p) && pl.life<=500 && chars(p).length===1 && !chars(p)[0].attacked){ await A.yaji(p,c); if(!await pause(900)) return; }
  // 12) Piccolo (ataque direto) só se for letal ou ajudar muito
  const picc=chars(p).find(x=>x.id===3&&!x.used&&!x.attacked), g2=chars(p).filter(x=>x.id===1).sort((a,b)=>atkOf(p,a)-atkOf(p,b))[0];
  if(picc && g2 && canAttack(p)){
    const pa=atkOf(p,picc), tg=chars(q);
    if(pa>=ql.life || (ql.life<=pa*2 && tg.length && tg.every(t=>bDef(t)>=pa))){ await A.picc(p,picc,g2); if(!await pause(900)) return; }
  }
  // 13) Ataques
  if(canAttack(p) && pl.chars.some(Boolean)){
    await goAttack(p); if(G.over) return;
    const skipped=new Set();
    while(!G.over){
      const atts=pl.chars.filter(x=>x&&!x.attacked&&!skipped.has(x.uid)).sort((a,b)=>atkOf(p,b)-atkOf(p,a));
      if(!atts.length) break;
      const a=atts[0], tg=atkTargets(q);
      let choice=null;
      if(!tg.length) choice={direct:true};
      else if(a.direct && (atkOf(p,a)>=ql.life || !tg.some(t=>wins(a,t)))) choice={direct:true};
      else {
        const w=tg.filter(t=>wins(a,t)||(ties(a,t)&&a.doom)).sort((x,y)=>bDef(y)-bDef(x));
        if(w.length) choice={target:w[0]};
        else {
          // Lei da vantagem: empatar (os dois vão pro vazio) vale a pena se depois os outros atacantes
          // conseguem vencer tudo que sobrar no campo do oponente (ou atacar direto se o campo ficar vazio)
          const others=pl.chars.filter(x=>x&&x!==a&&!x.attacked);
          const tie=tg.filter(t=>ties(a,t) && others.length && tg.filter(u=>u!==t).every(u=>others.some(o=>wins(o,u))))
                      .sort((x,y)=>bDef(y)-bDef(x))[0];
          if(tie) choice={target:tie};
        }
      }
      if(!choice){ skipped.add(a.uid); continue; }
      await doAttack(p,a,choice.direct?null:choice.target);
      if(G.over) return;
      await sleep(350);
    }
  }
  if(G.over) return;
  await sleep(400);
  await finalPhase(1);
}

  [/already registered|already been registered/i,'Já existe uma conta com esse e-mail.'],[/Password should be at least/i,'A senha precisa ter pelo menos 6 caracteres.'],
  [/valid email|invalid format|Unable to validate email/i,'Digite um e-mail válido.'],[/provider is not enabled|Unsupported provider/i,'O login com Google ainda não foi ativado.'],
  [/rate limit|too many/i,'Muitas tentativas. Espere um pouco e tente de novo.'],[/Failed to fetch|NetworkError/i,'Sem conexão com o servidor. Verifique sua internet.']];
const errPt=e=>{ const m=(e&&(e.message||e.error_description))||String(e); const f=ERR_PT.find(([r])=>r.test(m)); return f?f[1]:'Algo deu errado: '+m; };
const fetchProfile=async()=>{ const {data,error}=await SB.from('profiles').select('nickname,avatar,xp,games,wins,losses,status,favs,crystals').eq('id',ACC.user.id).maybeSingle(); if(error) throw error; return data; };
async function loadProfile(){
  ACC.profile=null; if(!SB||!ACC.user) return;
  try{
    let data=null;
    for(let i=0;i<4 && !data;i++){ if(i) await sleep(500); data=await fetchProfile(); }   // logo após o link do e-mail a sessão pode demorar um instante
    if(!data){ await SB.from('profiles').upsert({id:ACC.user.id},{onConflict:'id',ignoreDuplicates:true}); data=await fetchProfile(); }
    ACC.profile=data||{nickname:null,avatar:null};
  }catch(e){ console.warn(e); }
}
let accBusy=null;
function accRefresh(){
  if(accBusy) return accBusy;
  accBusy=(async()=>{ try{
    await loadProfile(); accChip(); loadMult(); if(ACC.user) touchLogin(); else loadMissions();
    if(ACC.user && ACC.profile && !ACC.profile.nickname && !G && !$('#modal').classList.contains('on')) profileEdit(true);   // conta nova (ex.: Google) sem apelido
  } finally { accBusy=null; } })();
  return accBusy;
}
function accChip(){
  const home=document.querySelector('.scr.home'); if(!home) return;
  let c=home.querySelector('.acc'); if(c) c.remove();
  c=el('div','acc');
  if(ACC.user && ACC.profile && ACC.profile.nickname){ c.appendChild(avatarEl(ACC.profile.avatar)); c.appendChild(el('b','',ACC.profile.nickname)); c.appendChild(el('span','lvl','Nv. '+levelInfo(ACC.profile.xp).lvl)); c.onclick=profileModal; }
  else { const a=el('div','av'); a.style.cssText='display:flex;align-items:center;justify-content:center;font-size:48px'; a.textContent='👤'; c.appendChild(a);
    c.appendChild(el('div','',`<b>${ACC.user?'Complete seu perfil':'Entrar'}</b>${ACC.user?'':'<small>Crie uma conta para salvar seu progresso</small>'}`)); c.onclick=()=>ACC.user?profileEdit(true):authModal('login'); }

function nameEdit(){
  const box=el('div','mbox'); const f=el('div','form'); box.appendChild(f); f.appendChild(el('h2','','Mudar apelido'));
  const nk=document.createElement('input'); nk.placeholder='Apelido (3 a 16 letras ou números)'; nk.value=ACC.profile.nickname||''; f.appendChild(nk);

async function loadMissions(){ if(!SB) return; try{ const {data}=await SB.rpc('get_missions'); MIS=Array.isArray(data)?data:[]; }catch(e){} accChip(); }

async function touchLogin(){ if(!SB||!ACC.user||LOGIN_TOUCHED) return; LOGIN_TOUCHED=true; try{ await SB.rpc('touch_login'); }catch(e){} loadMissions(); }
function resetIn(kind){                                          // tempo até renovar (horário de Brasília, UTC-3)
  const now=Date.now(), br=new Date(now-3*3600e3); const d=new Date(Date.UTC(br.getUTCFullYear(),br.getUTCMonth(),br.getUTCDate()));
  if(kind==='daily') d.setUTCDate(d.getUTCDate()+1); else d.setUTCDate(d.getUTCDate()+(7-br.getUTCDay()));   // semanal: domingo
  const ms=d.getTime()+3*3600e3-now, h=Math.floor(ms/3600e3), m=Math.floor(ms%3600e3/60e3);
  return h>=24?`${Math.floor(h/24)} d ${String(h%24).padStart(2,'0')} h`:`${String(h).padStart(2,'0')} h ${String(m).padStart(2,'0')} m`;
}
const MIS_TABS=[{k:'daily',n:'Diárias'},{k:'weekly',n:'Semanais'},{k:'event',n:'Tempo limitado'}];
async function missionsScreen(tab){
  if(typeof tab!=='string') tab='daily';
  const old=document.querySelector('.profscr'); if(old) old.remove();
  const ov=el('div','profscr mscr'); const sc=el('div','pbody'); ov.appendChild(sc);
  sc.appendChild(el('div','mtitle','Lista de Missões'));
  const tabs=el('div','mtabs'); MIS_TABS.forEach(T=>{ const b=el('div','mtab'+(T.k===tab?' on':''),T.n); b.onclick=()=>missionsScreen(T.k); tabs.appendChild(b); }); sc.appendChild(tabs);
  if(tab!=='event') sc.appendChild(el('div','mtimer',`🕒 Renova em ${resetIn(tab)}`));
  if(!ACC.user){ const g=el('div','mguest','<b>Crie uma conta e pegue os seus prêmios</b>'); if(SB) g.appendChild(btn('Criar conta','',()=>{ ov.remove(); authModal('signup'); })); sc.appendChild(g); }
  const list=el('div','mlist'); sc.appendChild(list);
  const x=el('button','pclose','✕'); x.onclick=()=>ov.remove(); ov.appendChild(x);
  $('#stage').appendChild(ov);
  await loadMissions();
  const L=MIS.filter(m=>m.kind===tab);
  if(!L.length){ list.appendChild(el('div','mempty',tab==='event'?'Nenhum evento no momento. Fique de olho!':'Nenhuma missão.')); return; }
  L.forEach(m=>{
    const done=m.progress>=m.goal, row=el('div','mrow'+(m.claimed?' claimed':done?' done':''));
    const info=el('div','minfo'); info.appendChild(el('div','mname',m.title));
    const bar=el('div','mbar'); const f=el('i'); f.style.width=Math.min(100,100*m.progress/m.goal)+'%'; bar.appendChild(f); bar.appendChild(el('span','',`${m.progress}/${m.goal}`)); info.appendChild(bar);
    if(m.kind==='event' && m.ends_at) info.appendChild(el('div','mend',`Termina em ${new Date(m.ends_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}`));
    row.appendChild(info);
    const rw=el('div','mrew'); rw.innerHTML=(m.reward_crystals?crys(m.reward_crystals):'')+(m.reward_xp?`<small>+${m.reward_xp} XP</small>`:''); row.appendChild(rw);
    let act;
    if(m.claimed) act=el('div','mstat','✓ Resgatado');
    else if(done && ACC.user){ act=btn('Resgatar','',async()=>{ act.disabled=true;
        const {data,error}=await SB.rpc('claim_mission',{p_id:m.id});
        if(error||!data||!data.ok){ toast('Não foi possível resgatar agora.'); act.disabled=false; return; }
        if(ACC.profile){ ACC.profile.crystals=data.total_crystals; ACC.profile.xp=(ACC.profile.xp|0)+(data.xp|0); }
        sfx('heal'); toast(`+${data.crystals} Cristais AMV!`); missionsScreen(tab); }); }
    else act=el('div','mstat',done?'Completa':'Em andamento');
    row.appendChild(act); list.appendChild(row);
  });
}

function favPick(ov){
  const box=el('div','mbox'); const f=el('div','form'); box.appendChild(f); f.appendChild(el('h2','','Destaque de Jogador'));

  const tools=el('div','dtool'); const fb=btn('','sec',()=>filterSheet(DV,applyView)), ob=btn('','sec',()=>sortSheet(DV,applyView));
  tools.appendChild(fb); tools.appendChild(ob); s.appendChild(tools);
  const grid=el('div','grid'); const gw=el('div','gridwrap'); gw.appendChild(grid); s.appendChild(gw);
  const nums={}, tiles={};
  Object.values(DEFS).forEach(d=>{
    const t=el('div','tile'); tiles[d.id]=t; const im=el('div','im'); im.style.backgroundImage=`url("${d.mini}")`; im.onclick=()=>cardModalView(d,applyView);
    t.appendChild(el('div','stars',`<img src="Icones/16.png" alt="">×${STARS[d.id]||1}`));
    const ctl=el('div','ctl'); const nb=el('b','',counts[d.id]); nums[d.id]=nb;
    ctl.appendChild(btn('−','sec',()=>{ if(counts[d.id]>0){counts[d.id]--;upd();} }));
    ctl.appendChild(nb);
    ctl.appendChild(btn('+','',()=>{ const five=Object.keys(counts).reduce((t,k)=>t+((STARS[k]||0)>=5?counts[k]:0),0);
      if((STARS[d.id]||0)>=5 && five>=1) toast('Só pode ter 1 carta de 5 estrelas no baralho.');
      else if(counts[d.id]<maxCopies(d.id)){counts[d.id]++;upd();} else toast(`Máximo de ${maxCopies(d.id)} cópia(s) desta carta.`); }));
    t.appendChild(im); t.appendChild(ctl);
  });
  function applyView(){
    const list=deckView(DV); grid.replaceChildren(...list.map(d=>{ const t=tiles[d.id]; const f=t.querySelector('.fav'); if(f) f.remove(); if(favs().includes(d.id)) t.appendChild(el('div','fav','❤️')); return t; }));
    if(!list.length) grid.appendChild(el('div','',`<span style="font-size:36px;color:#aaa">Nenhuma carta com esses filtros.</span>`));
    const n=filterCount(DV); fb.innerHTML=`🔍 Filtro${n?` <b>(${n})</b>`:''}`; ob.innerHTML=`⇅ Organizar: <b>${SORTS.find(o=>o.k===DV.sort).n}</b>`;
  }
  applyView();
  // verso do baralho
  let back=myBack();
  const bw=el('div','backs'); bw.appendChild(el('span','',`Verso do baralho:`));
  BACKS.forEach((b,i)=>{ const t=el('div','bk'+(i===back?' sel':'')); t.style.backgroundImage=`url("${b.img}")`; t.title=b.n;
    t.onclick=()=>{ back=i; bw.querySelectorAll('.bk').forEach((x,k)=>x.classList.toggle('sel',k===i)); }; bw.appendChild(t); });
  s.appendChild(bw);
  const foot=el('div','row'); foot.style.marginTop='18px';
  const save=btn('Salvar e voltar','',()=>{ saveDeck(counts); try{localStorage.setItem('amv_back',back);}catch(e){} goHome(); });
  foot.appendChild(btn('Baralho padrão','sec',()=>{ for(const id in DEFS) counts[id]=DEFAULT_DECK[id]|0; upd(); }));
  foot.appendChild(save); s.appendChild(foot);
  function upd(){
    let t=0; for(const id in DEFS){ nums[id].textContent=counts[id]; t+=counts[id]; }
    const v=validDeck(counts);
    info.innerHTML=`${t} / ${DECK_MAX} cartas (mín. ${DECK_MIN})` + (v?`<br><span style="color:#ffb347;font-size:34px">${v}</span>`:'<br><span style="color:#2ee66b;font-size:34px">Baralho válido</span>');
