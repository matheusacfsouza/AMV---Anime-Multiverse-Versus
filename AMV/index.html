/* ---- organização e filtros do montador de baralho ---- */
function saveFavs(f){
  try{ localStorage.setItem('amv_favs',JSON.stringify(f)); }catch(e){}
  if(SB && ACC.user && ACC.profile){ ACC.profile.favs=f.slice(0,3); SB.from('profiles').update({favs:ACC.profile.favs}).eq('id',ACC.user.id).then(()=>{},()=>{}); }
}
const favs=()=>{ if(ACC.user && ACC.profile && Array.isArray(ACC.profile.favs)) return ACC.profile.favs.filter(id=>DEFS[id]).slice(0,3); try{ const f=JSON.parse(localStorage.getItem('amv_favs')||'[]'); return Array.isArray(f)?f.filter(id=>DEFS[id]).slice(0,3):[]; }catch(e){ return []; } };
const DV={q:'', fav:null, stars:new Set(), cat:new Set(), el:new Set(), arq:new Set(), sort:'padrao'};
const SORTS=[{k:'padrao',n:'Padrão'},{k:'nome',n:'Nome (A-Z)'},{k:'rar_d',n:'Raridade ↓'},{k:'rar_a',n:'Raridade ↑'},{k:'atk_d',n:'ATQ alto → baixo'},{k:'atk_a',n:'ATQ baixo → alto'}];
const CATS=[['char','Personagem'],['poder','Poder'],['field','Campo'],['support','Apoiador'],['tool','Ferramenta'],['item','Item']];
const ALLARQ=()=>[...new Set(Object.values(DEFS).flatMap(d=>d.arq||[]))];
const UNI={stars:()=>[1,2,3,4,5], cat:()=>CATS.map(c=>c[0]), el:()=>Object.keys(ELEM), arq:ALLARQ};
const act=(v,k)=> v[k].size>0 && !UNI[k]().every(x=>v[k].has(x));   // "Tudo" marcado = sem restrição
const filterCount=v=>(v.q?1:0)+(v.fav?1:0)+['stars','cat','el','arq'].reduce((t,k)=>t+(act(v,k)?v[k].size:0),0);
function deckView(v){
  const q=v.q.trim().toLowerCase(), F=favs(), st=d=>STARS[d.id]||1, nm=(a,b)=>a.name.localeCompare(b.name,'pt');
  let L=Object.values(DEFS).filter(d=>{
    if(q && !d.name.toLowerCase().includes(q)) return false;
    if(v.fav==='fav' && !F.includes(d.id)) return false;
    if(v.fav==='nfav' && F.includes(d.id)) return false;
    if(act(v,'stars') && !v.stars.has(st(d))) return false;
    if(act(v,'cat') && !(v.cat.has(d.kind) || (d.kind!=='char' && v.cat.has('poder')))) return false;
    if(act(v,'el') && !v.el.has(d.el)) return false;
    if(act(v,'arq') && !(d.arq||[]).some(a=>v.arq.has(a))) return false;
    return true;
  });
  const atk=d=>d.kind==='char'?d.atk:-1;
  const cmp={padrao:(a,b)=>st(a)-st(b)||nm(a,b), nome:nm, rar_d:(a,b)=>st(b)-st(a)||nm(a,b), rar_a:(a,b)=>st(a)-st(b)||nm(a,b),
             atk_d:(a,b)=>atk(b)-atk(a)||nm(a,b), atk_a:(a,b)=>(a.kind==='char'?0:1)-(b.kind==='char'?0:1)||atk(a)-atk(b)||nm(a,b)}[v.sort];
  return L.sort(cmp);
}
function sheetShell(title){
  const ov=el('div','sheetov'); const sh=el('div','sheet'); sh.appendChild(el('div','grab')); ov.appendChild(sh);
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); }; $('#stage').appendChild(ov); return {ov,sh};
}
function filterSheet(v, done){
  const w={q:v.q, fav:v.fav, stars:new Set(v.stars), cat:new Set(v.cat), el:new Set(v.el), arq:new Set(v.arq)};
  const {ov,sh}=sheetShell();
  const sr=el('div','search','<span style="font-size:40px">🔍</span>'); const inp=document.createElement('input'); inp.placeholder='Pesquisar pelo nome'; inp.value=w.q; inp.oninput=()=>{ w.q=inp.value; }; sr.appendChild(inp); sh.appendChild(sr);
  const body=el('div','body'); sh.appendChild(body);
  const sec=(title,items,set,single)=>{
    const h=el('h4','',title); body.appendChild(h); const bx=el('div','box'); body.appendChild(bx);
    const pills=items.map(([k,label])=>{ const pl=el('div','pill',label); const on=()=>single?w.fav===k:set.has(k);
      pl.classList.toggle('on',on()); pl.onclick=()=>{ if(single) w.fav=(w.fav===k?null:k); else (set.has(k)?set.delete(k):set.add(k)); pills.forEach(x=>x.sync()); };
      pl.sync=()=>pl.classList.toggle('on',on()); bx.appendChild(pl); return pl; });
    if(!single){ const all=el('div','pill all','Tudo'); const keys=items.map(i=>i[0]);
      const syncAll=()=>all.classList.toggle('on', keys.every(k=>set.has(k)));
      all.onclick=()=>{ if(keys.every(k=>set.has(k))) set.clear(); else keys.forEach(k=>set.add(k)); pills.forEach(x=>x.sync()); syncAll(); };
      pills.forEach(x=>{ const o=x.sync; x.sync=()=>{ o(); syncAll(); }; }); syncAll(); h.appendChild(all); }
  };
  sec('Favoritas',[['fav','Favoritas'],['nfav','Não favoritas']],null,true);
  sec('Raridade',[1,2,3,4,5].map(n=>[n,`<img src="Icones/16.png" alt="">×${n}`]),w.stars);
  sec('Categoria',CATS,w.cat);
  sec('Tipo',Object.keys(ELEM).map(k=>[k,`<img src="Icones/${EL_ICO[k]}.png" alt="">${ELEM[k].n}`]),w.el);
  const arqs=[...new Set(Object.values(DEFS).flatMap(d=>d.arq||[]))].sort((a,b)=>a.localeCompare(b,'pt'));
  sec('Arquétipo',arqs.map(a=>[a,a]),w.arq);
  const foot=el('div','foot');
  const x=el('div','x','✕'); x.onclick=()=>ov.remove();
  const ok=el('div','ok','OK'); ok.onclick=()=>{ Object.assign(v,w); ov.remove(); done(); };
  const clr=el('div','clr','Limpar'); clr.onclick=()=>{ Object.assign(v,{q:'',fav:null,stars:new Set(),cat:new Set(),el:new Set(),arq:new Set()}); ov.remove(); done(); };
  foot.appendChild(x); foot.appendChild(ok); foot.appendChild(clr); sh.appendChild(foot);
}
function sortSheet(v, done){
  const {ov,sh}=sheetShell(); sh.appendChild(el('h4','','Organizar por'));
  const bx=el('div','box'); sh.appendChild(bx);
  SORTS.forEach(o=>{ const pl=el('div','pill'+(v.sort===o.k?' on':''),o.n); pl.onclick=()=>{ v.sort=o.k; ov.remove(); done(); }; bx.appendChild(pl); });
  const foot=el('div','foot'); const x=el('div','x','✕'); x.onclick=()=>ov.remove(); foot.appendChild(x); sh.appendChild(foot);
}

function rps(msg){
  const s=el('div','scr');
  s.appendChild(el('h2','','QUEM COMEÇA?'));
  s.appendChild(el('div','big',msg||'Pedra, papel ou tesoura!'));
  const row=el('div','row'); row.style.marginTop='40px';
  const opts=[['✊','pedra'],['✋','papel'],['✌️','tesoura']];
  const res=el('div','big'); res.style.fontSize='80px';
  opts.forEach(([ic,nm],i)=>{
    row.appendChild(btn(ic,'rpsb',async()=>{
      const bot=Math.floor(Math.random()*3);
      row.querySelectorAll('button').forEach(b=>b.disabled=true);
      res.innerHTML=`Você ${opts[i][0]} × ${opts[bot][0]} Oponente`;
      await sleep(900);
      if(i===bot){ rps('Empate! Jogue de novo.'); return; }
      const win=(i-bot+3)%3===1;
      res.innerHTML+=`<div style="margin-top:30px;color:${win?'#2ee66b':'#e60012'}">${win?'Você começa!':'O oponente começa!'}</div>`;
      await sleep(1300);
      beginMatch(win?0:1);
    }));
  });
  s.appendChild(row); s.appendChild(res);
  setScreen(s);
}
