<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Anomalia Multiversal Versus</title>
<link rel="icon" href="Logo/AMV - Logomarca.png">
<link rel="apple-touch-icon" href="Logo/AMV - Logomarca.png">
<style>
:root{--red:#e60012;--gold:#ffd400;--green:#2ee66b}
*{box-sizing:border-box}
body.locked #board,body.locked #board *{pointer-events:none!important}
body.paused #board *,body.paused .actfx,body.paused .spark,body.paused .lifefx,body.paused .tmr{animation-play-state:paused!important}
html,body{margin:0;height:100%;background:#050505;overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;background:#000;overflow:hidden}
#gl{position:absolute;left:0;top:var(--oy,0px);width:1080px;height:1920px}
#board,#screen{position:absolute;inset:0}
#board{z-index:1}
#screen{z-index:5}
#screen:empty{display:none}
#modal{position:absolute;inset:0;z-index:100;display:none;background:rgba(0,0,0,.86);align-items:center;justify-content:center;flex-direction:column}
#modal.on{display:flex}
#banner{position:absolute;left:0;right:0;top:920px;height:80px;z-index:20;display:none;align-items:center;justify-content:center;text-align:center;white-space:nowrap;
  background:linear-gradient(90deg,transparent,rgba(230,0,18,.92) 25%,rgba(230,0,18,.92) 75%,transparent);font-size:42px;font-weight:900;letter-spacing:3px;text-shadow:0 3px 0 #000}
#banner.on{display:flex;animation:ban .9s ease both}
@keyframes ban{0%{opacity:0;transform:scaleY(.2)}20%{opacity:1;transform:scaleY(1)}85%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;bottom:340px;transform:translateX(-50%);z-index:30;background:#000c;border:3px solid #fff;border-radius:16px;padding:16px 30px;font-size:38px;display:none}
#toast.on{display:block}
#upd{position:absolute;left:50%;top:24px;transform:translateX(-50%);z-index:2000;background:linear-gradient(90deg,#86cdf7,#6fe3f0);color:#06202c;font-weight:800;font-size:38px;padding:22px 40px;border-radius:50px;box-shadow:0 8px 30px #0009;cursor:pointer;display:none;text-align:center;max-width:980px}
#upd.on{display:block;animation:updIn .4s ease-out}
#upd small{display:block;font-size:28px;font-weight:600}
@keyframes updIn{from{transform:translate(-50%,-160px)}to{transform:translate(-50%,0)}}

/* zones */
.zone{position:absolute;border:8px solid #fff;background:#000;color:var(--red);font-weight:800;text-align:center;
  display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1.05;padding:4px}
.zone.small{font-size:26px}
#stage.scen{background-size:100% 100%;background-position:center}
#stage.scen .zone.slot{background:transparent;border-color:transparent}
#stage.scen .zone.slot>.lbl{opacity:0}
#stage.scen .zone.life,#stage.scen .zone.turn,#stage.scen .zone.av{background:rgba(0,0,0,.72)}
.card{position:absolute;inset:-8px;border-radius:12px;background-size:100% 100%;background-position:center;background-color:transparent;cursor:pointer;transition:transform .25s,opacity .25s;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.card.dim{opacity:.55}
/* brilhos: só a opacidade anima (o navegador não redesenha a tela toda) */
.card.cand,.zone.cand{z-index:3}
.card.glow::after,.hand.playable .card::after,.card.cand::after,.zone.cand::after,.toolico.cand::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;will-change:opacity;animation:glowp 1s infinite alternate}
.card.glow::after,.hand.playable .card::after{box-shadow:0 0 0 5px #7df,0 0 30px 8px #4cf}
.card.cand::after,.zone.cand::after,.toolico.cand::after{box-shadow:0 0 0 6px var(--gold),0 0 34px 10px var(--gold);animation-duration:.75s}
@keyframes glowp{from{opacity:.28}to{opacity:1}}
.card.cand.atk{filter:brightness(1.18)}
.card.cand.atk::after{box-shadow:0 0 0 7px #fdcd00,0 0 46px 16px #fdcd00}
.card.nocand{filter:brightness(.5) saturate(.6)}
.card.nocand::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:0 0 0 6px #ff0803,0 0 34px 10px #ff0803;opacity:.85}
.card.hit{animation:hit .5s}
@keyframes hit{0%,100%{filter:none}20%{filter:brightness(3.2) saturate(0)}55%{filter:brightness(1.6) sepia(1) hue-rotate(-40deg) saturate(4)}}
.back{background-color:#101418;background-image:repeating-linear-gradient(45deg,#14181d 0 16px,#1d232a 16px 32px);border:6px solid #cdd5df}
.back::after{content:"AMV";position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:var(--red);border:5px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:34px;color:#fff}
.back.img{background-size:100% 100%;border:0}
.back.img::after{display:none}
.fly.bk.img{background-size:100% 100%;border:0}
.hasback .back::after{display:none}
.chip{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;background:#000d;border:3px solid #fff;border-radius:10px;padding:2px 12px;font-size:32px;font-weight:900;white-space:nowrap}
.chip.atq{color:#fdcd00}
.chip.atq.up{color:#32bf0b;border-color:#32bf0b}
.chip.atq.down{color:#ff0803;border-color:#ff0803}
.chip.tag{bottom:auto;top:6px;font-size:24px;border-color:var(--red);color:#fff;background:#b00010}
.chip.tag2{bottom:auto;top:46px;font-size:24px;border-color:var(--gold);color:var(--gold)}
.badge{position:absolute;right:-6px;top:-6px;min-width:44px;height:44px;border-radius:22px;background:var(--red);border:3px solid #fff;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:2}
.hand{position:absolute;width:190px;height:266px;touch-action:none}
.hand.lift{z-index:60!important}
.hand.lift .card{transform:translateY(-120px) scale(1.42);transition:transform .14s ease-out;box-shadow:0 20px 40px #000}
.hand.dragging{opacity:.25}
.ghost{position:absolute;z-index:40;width:215px;height:301px;border-radius:12px;background-size:100% 100%;pointer-events:none;box-shadow:0 30px 50px #000;transform:translate(-50%,-60%) rotate(-4deg) scale(1.08)}
.zone.drop::after{content:"";position:absolute;inset:-14px;border:8px solid #ffe14d;border-radius:16px;pointer-events:none;background:rgba(255,225,77,.22);box-shadow:0 0 34px 12px #ffd400bb,inset 0 0 40px #ffd40099;animation:dropPulse .75s ease-in-out infinite}
.zone.drop.over::after{background:rgba(255,240,140,.5);border-color:#fff;box-shadow:0 0 70px 26px #fff27a,inset 0 0 70px #fff27a;animation:none;transform:scale(1.07)}
@keyframes dropPulse{50%{box-shadow:0 0 60px 22px #ffd400ee,inset 0 0 70px #ffd400cc;background:rgba(255,225,77,.38)}}
.hand .card{inset:0}


.card.glow{z-index:2}
.toolico{position:absolute;left:calc(6.765% - 37px);width:74px;height:66px;border:4px solid #ff9a1f;border-radius:10px;background-size:230% auto;background-position:50% 24%;background-color:#222;z-index:6;cursor:pointer;box-shadow:0 0 0 2px #ffcf6b,0 0 16px 5px #ff8a00,0 4px 10px #000}
.card.enterHand{animation:drawIn .55s ease-out backwards}
.card.enterField{animation:dropIn .5s cubic-bezier(.22,1,.36,1) backwards}
.card.settle{animation:settle .32s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes settle{from{transform:scale(1.18)}}
@keyframes drawIn{from{transform:translate(var(--ex,300px),var(--ey,-200px)) scale(.5) rotate(18deg);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
@keyframes dropIn{0%{transform:translate(var(--ex,0px),var(--ey,-300px)) scale(1.9);opacity:0}30%{opacity:1}100%{transform:none;opacity:1}}
.impact{position:absolute;z-index:27;pointer-events:none;overflow:visible}
.impact .star{animation:istar .5s cubic-bezier(.1,.9,.3,1) both;transform-origin:0 0}
@keyframes istar{0%{transform:scale(.15) rotate(-20deg);opacity:1}35%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1.35) rotate(10deg);opacity:0}}
.impact .lines{animation:ilines .42s ease-out both;transform-origin:0 0}
@keyframes ilines{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.25);opacity:0}}
.impact .ring{transform-origin:0 0;animation:iring .5s ease-out both}
.impact .r2{animation-delay:.06s}
@keyframes iring{0%{transform:scale(.3);opacity:1}100%{transform:scale(3.4);opacity:0}}
.shard{position:absolute;z-index:27;pointer-events:none;background:#fff;border:2px solid #000;animation:shard .55s cubic-bezier(.1,.8,.3,1) both}
@keyframes shard{from{transform:translate(-50%,-50%)}to{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) rotate(var(--rot));opacity:0}}
.speed{position:absolute;z-index:26;height:0;transform-origin:0 0;pointer-events:none}
.speed i{position:absolute;left:0;width:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95));border-radius:4px;animation:spd .3s ease-out both}
@keyframes spd{from{transform:scaleX(.1);transform-origin:100% 0;opacity:1}to{transform:scaleX(1);opacity:0}}
.flashw{position:absolute;inset:0;z-index:29;background:#fff;pointer-events:none;animation:flw .25s ease-out both}
@keyframes flw{0%{opacity:.85}100%{opacity:0}}
#board.iframe{filter:invert(1) grayscale(1) contrast(1.8)}
#board.shake{animation:shk .36s linear}
@keyframes shk{0%,100%{transform:none}
 15%{transform:translate(calc(var(--sh)*-1),calc(var(--sh)*.6))}
 30%{transform:translate(var(--sh),calc(var(--sh)*-.5))}
 45%{transform:translate(calc(var(--sh)*-.6),calc(var(--sh)*-.4))}
 60%{transform:translate(calc(var(--sh)*.5),calc(var(--sh)*.3))}
 80%{transform:translate(calc(var(--sh)*-.2),calc(var(--sh)*.1))}}
.chip.bump{animation:bump .45s ease-out}
@keyframes bump{40%{transform:translateX(-50%) scale(1.45)}100%{transform:translateX(-50%) scale(1)}}
#board{backface-visibility:hidden}
.fly{position:absolute;z-index:28;border-radius:12px;background-size:100% 100%;background-color:transparent;box-shadow:0 14px 30px #000;pointer-events:none;transform-style:preserve-3d}
.fly.bk{background-color:#101418;background-image:repeating-linear-gradient(45deg,#14181d 0 16px,#1d232a 16px 32px);border:5px solid #cdd5df}
.hasback .fly.bk{background-image:var(--backimg);background-size:100% 100%;border:0}
/* lista de busca estilo Yu-Gi-Oh */
.slist{width:1000px;max-height:1400px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:10px;background:#0d0d0d;border:3px solid #444;border-radius:20px}
.srow{display:flex;align-items:center;gap:26px;background:#000;border:4px solid #555;border-radius:14px;padding:10px 16px;cursor:pointer;text-align:left}
.srow:active{border-color:var(--gold);background:#2a2320}
.sth{width:208px;height:292px;border-radius:8px;background-size:100% 100%;flex:none;background-color:#222}
.sinfo{flex:1;min-width:0}
.sname{font-size:44px;white-space:normal!important;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ssub{font-size:32px;color:#bbb;margin-top:6px}
.srow.void{background:#df061b;border-color:#ff6b78}
.srow.void .ssub{color:#fff}
.scount{font-size:52px;font-weight:900;color:var(--gold);border:4px solid var(--gold);border-radius:12px;padding:2px 14px;flex:none}
/* hud */
.zone.life{overflow:hidden;justify-content:flex-start;padding:0}
.zone.life i{position:absolute;left:0;top:0;bottom:0}
.zone.life span{position:relative;z-index:1;width:100%;color:#fff;font-size:30px;font-weight:800;text-shadow:0 2px 0 #000}
.zone.life.flash span{animation:fl .6s}
@keyframes fl{50%{color:#ffd400;transform:scale(1.2)}}
.zone .lbl{display:block}
.zone .lbl.flip{transform:rotate(180deg)}
.zone.av{font-size:18px}
.zone.turn{font-size:58px;line-height:1;color:#fff;font-weight:900}
.zone.turn b{font-size:22px}
.zone.turn u{font-size:19px;color:var(--gold);text-decoration:none;font-weight:800}
#msg{position:absolute;left:160px;top:922px;width:760px;height:84px;border:3px solid #444;border-radius:14px;background:#0b0b0b;padding:4px 14px;
  font-size:24px;line-height:1.15;color:#ddd;overflow:hidden;display:flex;flex-direction:column;justify-content:center;z-index:2}
#msg .l:last-child{color:#fff;font-weight:700}
#msg .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg.pick{border-color:var(--gold);flex-direction:row;align-items:center;gap:10px;height:60px;top:934px;padding:2px 12px}
#msg.pick .btn.sm{font-size:21px;padding:3px 12px;border-width:3px}
#msg.pick .t{flex:1;font-size:23px;font-weight:700;color:var(--gold);line-height:1.1}
.btn{position:relative;overflow:hidden;font-family:inherit;font-weight:900;color:#fff;background:linear-gradient(180deg,#ff5468 0%,#ee1132 48%,#c8001c 100%);border:4px solid #ffffffd9;border-radius:24px;font-size:42px;padding:16px 30px;cursor:pointer;
  text-shadow:0 3px 0 #0007;box-shadow:0 9px 0 #7c0013,0 14px 22px #000a,inset 0 4px 0 #ffffff70,inset 0 -6px 0 #00000030;margin-bottom:9px}
.btn::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(118deg,#ffffff16 0 24px,transparent 24px 48px);pointer-events:none;border-radius:inherit}
.btn::after{content:'';position:absolute;left:8%;right:8%;top:5px;height:36%;border-radius:20px 20px 40px 40px;background:linear-gradient(180deg,#ffffff55,#ffffff00);pointer-events:none}
.btn,.tab,.tbn,.gear,.modec,.shopc,.mtab,.acc,.hf,.asbtn{transition:transform .32s cubic-bezier(.34,1.9,.5,1)}
.tbn:active,.gear:active,.mtab:active,.acc:active,.hf:active{transform:scale(.9);transition:transform .07s}
.btn:active{transform:translateY(7px) scale(.97);box-shadow:0 2px 0 #7c0013,0 4px 10px #000a,inset 0 4px 0 #ffffff70,inset 0 -6px 0 #00000030;transition:transform .06s,box-shadow .06s}
.btn.sec:active{box-shadow:0 2px 0 #0b0d12,0 4px 10px #000a,inset 0 4px 0 #ffffff30}
.tab:active{transform:scale(.86);transition:transform .07s}
.btn:disabled:active{transform:none}
.btn.sec{background:linear-gradient(180deg,#465063 0%,#2c3342 55%,#1f2430 100%);border-color:#ffffff99;box-shadow:0 9px 0 #0b0d12,0 14px 22px #000a,inset 0 4px 0 #ffffff30,inset 0 -6px 0 #00000040}
.btn.sm{font-size:24px;padding:6px 12px;border-radius:12px;margin-bottom:4px;box-shadow:0 4px 0 #7c0013,inset 0 2px 0 #ffffff60}
.btn.sm.sec{box-shadow:0 4px 0 #0b0d12,inset 0 2px 0 #ffffff30}
.btn.sm::after{display:none}
.btn[disabled]{opacity:.4;pointer-events:none;filter:grayscale(.6)}
.tmr{position:absolute;left:937px;top:740px;width:104px;height:104px;border-radius:50%;z-index:3;display:none;align-items:center;justify-content:center;pointer-events:none;
  background:conic-gradient(var(--tc,#2ee66b) calc(var(--tp,1)*360deg), rgba(255,255,255,.18) 0);box-shadow:0 4px 14px #000}
.tmr.on{display:flex}
.tmr b{width:80px;height:80px;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#fff}
.tmr.low b{color:#ff0803;animation:tlow .5s infinite alternate}
@keyframes tlow{to{transform:scale(1.12)}}
#endbtn{position:absolute;left:933px;top:886px;width:112px;height:157px;font-size:24px;padding:4px;line-height:1.1;border-width:6px;border-radius:8px;z-index:2}
#menubtn{position:absolute;left:22px;top:1475px;width:124px;height:142px;font-size:32px;padding:4px;border-width:6px;border-radius:8px;z-index:4;color:var(--red);background:#000}
.hist{font-size:28px;line-height:1.3;text-align:left;width:900px;max-height:1400px;overflow:auto;background:#0d0d0d;border:3px solid #444;border-radius:20px;padding:20px 30px}

/* screens */
.scr{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:60px 40px;background:radial-gradient(ellipse at 50% 30%,#2a0006 0,#000 70%)}
.scr h1{font-size:150px;margin:40px 0 0;letter-spacing:10px;color:var(--red);text-shadow:0 6px 0 #fff;font-weight:900}
.scr h2{font-size:54px;margin:0 0 30px;font-weight:700;letter-spacing:6px;color:#fff}
.scr .row{display:flex;gap:30px}
.menu{display:flex;flex-direction:column;gap:30px;width:760px;margin-top:40px}
.menu .btn{font-size:50px;padding:30px}
.fan{position:relative;width:1000px;height:520px;margin-top:40px}
.backs{display:flex;align-items:center;gap:18px;margin-top:16px;font-size:34px;font-weight:800}
.backs .bk{width:96px;height:134px;border-radius:8px;background-size:100% 100%;cursor:pointer;border:5px solid transparent;opacity:.6}
.backs .bk.sel{border-color:var(--gold);opacity:1;box-shadow:0 0 22px var(--gold)}
.scr.home{background:#000;padding:0}
.scr.home .spin{position:absolute;left:-590px;top:-168px;width:2240px;height:2240px;background:url("Menus/Menu - Tela inicial - Giro.jpg") center/100% 100% no-repeat;animation:spin 60s linear infinite;will-change:transform;pointer-events:none;filter:brightness(.5) saturate(.9)}
@keyframes spin{to{transform:rotate(-360deg)}}
.scr.home .ui{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;clip-path:inset(0 0 71% 0)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:170px;z-index:8;display:flex;background:#0b0d12f2;border-top:2px solid #2a303c;box-shadow:0 -10px 30px #0009}
.tab{flex:1;border:0;background:none;color:#8a93a3;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tab span{font-size:64px;filter:grayscale(1) brightness(.8);transition:transform .15s}
.tab small{font-size:27px;font-weight:700;white-space:nowrap}
.tab.dot::after{content:'';position:absolute;top:16px;left:calc(50% + 22px);width:26px;height:26px;border-radius:50%;background:#ff4d6d;border:3px solid #fff}
.tab.on{color:#7fd6f5}.tab.on span{filter:none;transform:translateY(-4px) scale(1.08)}
.tab.on::before{content:'';position:absolute;top:0;width:120px;height:6px;border-radius:0 0 6px 6px;background:linear-gradient(90deg,#8fe3ff,#47e68a)}
.tab{position:relative}
.tbn{position:absolute;top:30px;z-index:6;display:flex;align-items:center;justify-content:center;line-height:1;width:110px;height:110px;border-radius:50%;border:4px solid #ffffffd9;background:radial-gradient(circle at 50% 30%,#4a5468,#1c2130 70%);font-size:54px;cursor:pointer;padding:0;box-shadow:0 7px 0 #0a0c12,0 10px 18px #000a,inset 0 3px 0 #ffffff40}
.tbn.mail{right:30px;top:160px}.tbn.gift{right:30px;top:290px}.tbn.fs{right:30px;top:420px}
.breathe{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{scale:1}50%{scale:1.035}}
.btn.breathe,.modec.breathe,.shopc.breathe{background-image:linear-gradient(105deg,transparent 40%,#ffffff66 50%,transparent 60%),var(--bgi);background-size:260% 100%,auto;background-repeat:no-repeat,repeat;animation:breathe 2.6s ease-in-out infinite,sheen 4.6s ease-in-out infinite}
@keyframes sheen{0%,58%{background-position:160% 0,0 0}100%{background-position:-60% 0,0 0}}
.btn.breathe{--bgi:linear-gradient(180deg,#ff5468 0%,#ee1132 48%,#c8001c 100%)}
.modec.breathe{--bgi:repeating-linear-gradient(118deg,#ffffff12 0 26px,transparent 26px 52px),linear-gradient(170deg,#ff5468,#d4001f)}
.shopc.breathe{--bgi:repeating-linear-gradient(118deg,#ffffff10 0 26px,transparent 26px 52px),linear-gradient(170deg,#7b5cff,#4a2fd1 60%,#3420a0)}
.modec.breathe{background-image:linear-gradient(105deg,transparent 40%,#ffffff55 50%,transparent 60%),repeating-linear-gradient(118deg,#ffffff12 0 26px,transparent 26px 52px),linear-gradient(170deg,#ff5468,#d4001f);background-size:260% 100%,auto,auto;background-repeat:no-repeat}
.shopc.breathe{background-image:linear-gradient(105deg,transparent 40%,#ffffff55 50%,transparent 60%),repeating-linear-gradient(118deg,#ffffff10 0 26px,transparent 26px 52px),linear-gradient(170deg,#7b5cff,#4a2fd1 60%,#3420a0);background-size:260% 100%,auto,auto;background-repeat:no-repeat}
.modec.breathe,.shopc.breathe{animation:breathe 2.6s ease-in-out infinite,sheen3 4.6s ease-in-out infinite}
.modec.slidein.breathe{animation:slideIn .45s cubic-bezier(.2,1.3,.4,1) backwards,breathe 2.6s ease-in-out .5s infinite,sheen3 4.6s ease-in-out infinite}
@keyframes sheen3{0%,58%{background-position:160% 0,0 0,0 0}100%{background-position:-60% 0,0 0,0 0}}
.scr.home .ui{animation:floaty 3.4s ease-in-out infinite alternate}
@keyframes floaty{from{translate:0 -6px}to{translate:0 8px}}
.scr.home .fan div{animation:bob 3.2s ease-in-out infinite alternate}

const DS={31:100,32:200,33:300,36:100};                         // Duplo Sentido (valor fixo)
const DS_MASTER=new Set([34,35]);                               // Mestre do Duplo Sentido (metade do ATQ do alvo)
function clashVals(p, att, q, tgt){                              // ATQ de batalha [atacante, defensor]
  let a=atkOf(p,att), d=atkOf(q,tgt);
  if(att.id===5) a+=300;                                        // Tenshinhan - Kikoho
  if(tgt.id===7) d=Math.max(0,d-300);                           // Yamcha - Autodestruição
  if(tgt.id===38) a=Math.max(0,a-500);                          // Antares - Magma vivo: quem ataca perde 500 na fase de dano
  const front = P(p).chars.indexOf(att)>=0 && P(p).chars.indexOf(att)===P(q).chars.indexOf(tgt);   // Duplo Sentido: só contra a coluna da frente
  const ds = !front ? 0 : DS_MASTER.has(att.id) ? Math.floor(d/2) : (DS[att.id]||0);
  return [a+ds, Math.max(0,d-ds)];
}
/* Mestre da Água (Shizu/Taishizu): Personagens Água do dono não são afetados por Itens do oponente.

  return false;
}

/* posições (extraídas do esboço 1080x1920) */

};

/* ============================================================

const $ = s => document.querySelector(s);
let PAUSED=false;                                  // menu aberto na partida contra o bot: tudo para
const sleep = ms => new Promise(r=>{ let left=ms; const go=()=>{ if(PAUSED){ setTimeout(go,80); return; } const t0=Date.now(); setTimeout(()=>{ if(PAUSED){ left=Math.max(0,left-(Date.now()-t0)); setTimeout(go,80); } else r(); }, left); }; go(); });
function setPause(on){
  if(on===PAUSED) return; PAUSED=on; document.body.classList.toggle('paused',on);
  if(G && G.tEnd){ if(on) G.tLeft=Math.max(0,G.tEnd-Date.now()); else if(G.tLeft!=null){ G.tEnd=Date.now()+G.tLeft; G.tLeft=null; } }
}
let RNGF=Math.random;                               // na PvP vira um gerador com semente: os dois aparelhos embaralham igual
function seedRng(seed){ let a=seed>>>0; RNGF=()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(RNGF()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function btn(label, cls, fn){ const b=el('button','btn '+(cls||''),label); b.addEventListener('click',fn); return b; }
let uidN = 1;
/* ===== PvP online: as duas pontas rodam o mesmo jogo; cada jogada viaja como mensagem ===== */
let NET=null, REC=null, REPLAY=null, REPLAYING=false;
function findInst(uid){
  for(const p of [0,1]){ const pl=P(p); const all=[...pl.hand,...pl.deck,...pl.void,...pl.chars,...pl.powers,pl.field].filter(Boolean);
    for(const c of all){ if(c.uid===uid) return {inst:c,p}; for(const e of (c.equips||[])) if(e.uid===uid) return {inst:e,p}; } }
  return null;
}
const encC=v=> v==null?null : (typeof v!=='object')?v : (v.uid!=null)?{u:v.uid} : {t:v.target?v.target.uid:undefined, d:v.direct?1:undefined, s:v.slot, w:v.switch?v.switch.uid:undefined};
const decC=v=>{ if(v==null||typeof v!=='object') return v; const f=u=>{ const r=findInst(u); return r?r.inst:null; };
  if(v.u!=null) return f(v.u); if(v.w!=null) return {switch:f(v.w)}; if(v.t!=null) return {target:f(v.t)}; if(v.d) return {direct:true}; if(v.s!=null) return {slot:v.s}; return null; };
async function netChoice(fn,args){
  if(REPLAYING) return decC(REPLAY && REPLAY.length ? REPLAY.shift() : null);
  const v=await fn(...args); if(REC) REC.push(encC(v)); return v;
}
function netSend(m){ if(!NET||!NET.tx) return; m.q=++NET.out; try{ NET.tx(m); }catch(e){} }
function netRecv(m){
  if(!NET||!m) return;
  NET.lastSeen=Date.now();
  if(m.t==='hi'){ if(!NET.peer){ NET.peer=true; try{ NET.tx({t:'hi'}); }catch(e){} } return; }
  if(m.t==='hb') return;
  if(m.q==null || m.q<=NET.inq || NET.buf[m.q]) return;          // repetida
  NET.buf[m.q]=m;
  while(NET.buf[NET.inq+1]){ const x=NET.buf[++NET.inq]; delete NET.buf[NET.inq];
    if(x.t==='ff'){ if(G && !G.over){ NET.oppLeft='desistiu'; endGame(0); } continue; }
    NET.inbox.push(x); if(NET.wait){ const w=NET.wait; NET.wait=null; w(); } }
}
async function nextNet(){ while(NET && !NET.inbox.length){ await new Promise(r=>{ NET.wait=r; setTimeout(r,1000); }); if(!G||G.over) return null; } return NET?NET.inbox.shift():null; }
async function remoteTurn(){                         // turno do oponente: reproduz as jogadas que chegam
  const p=1;
  while(G && !G.over){
    G.busy=true; render();
    const m=await nextNet(); if(!m||!G||G.over) return;
    try{
      if(m.t==='act'){ const r=findInst(m.uid); const a=r && actionsFor(1,r.inst,m.where).find(x=>x.label===m.label);
        if(a){ REPLAY=(m.ch||[]).slice(); REPLAYING=true; try{ await a.run(); } finally{ REPLAYING=false; REPLAY=null; } } }
      else if(m.t==='drop'){ const r=findInst(m.uid); if(r){ const inst=r.inst, pl=P(1); REPLAY=(m.ch||[]).slice(); REPLAYING=true;
        try{ if(m.k==='char'){ pl.summoned=true; await A.summon(1,inst,m.slot); } else if(m.k==='support') A.support(1,inst,m.slot); else if(m.k==='field') await A.field(1,inst);
             else if(m.k==='tool'){ const g=pl.chars[m.slot]; if(g) await A.tool(1,inst,g); } } finally{ REPLAYING=false; REPLAY=null; } } }
      else if(m.t==='atk'){ await goAttack(1); }
      else if(m.t==='end'){ render(); checkWin(); if(G && !G.over) await finalPhase(1); return; }
    }catch(e){ console.error('PvP', e); }
    render(); checkWin();
  }
}
const mk = id => ({uid:uidN++, id, def:DEFS[id], attacked:false, direct:false, used:false, equips:[], equipTo:null, tmp:null});

const MUSIC=new Audio('Músicas/Música de batalha - Pokémon Sword Shield OST - Gym Leader Battle.mp3'); MUSIC.loop=true; MUSIC.volume=.4;
const CFG=(()=>{ try{ return Object.assign({music:true,sfx:true,vib:true},JSON.parse(localStorage.getItem('amv_cfg')||'{}')); }catch(e){ return {music:true,sfx:true,vib:true}; } })();
const saveCfg=()=>{ try{ localStorage.setItem('amv_cfg',JSON.stringify(CFG)); }catch(e){} };

/* efeitos sonoros sintetizados (sem arquivos) */
let ACX=null;
function sfx(kind){
  if(!CFG.sfx) return;
  try{ ACX=ACX||new (window.AudioContext||window.webkitAudioContext)(); if(ACX.state==='suspended') ACX.resume();
    const t=ACX.currentTime, o=ACX.createOscillator(), g=ACX.createGain(); o.connect(g); g.connect(ACX.destination);
    const S={hit:['square',160,40,.28,.22], play:['triangle',520,1040,.18,.25], heal:['sine',600,900,.15,.3], dmg:['sawtooth',220,90,.18,.25], click:['triangle',800,600,.08,.06]}[kind]||['sine',440,440,.1,.1];
    o.type=S[0]; o.frequency.setValueAtTime(S[1],t); o.frequency.exponentialRampToValueAtTime(S[2],t+S[4]);
    g.gain.setValueAtTime(S[3],t); g.gain.exponentialRampToValueAtTime(.001,t+S[4]); o.start(t); o.stop(t+S[4]+.02);
  }catch(e){}
}

const APP_VER='20261124-170446';                                        // muda a cada versão publicada (igual ao version.json)

BACKS.forEach(b=>preload(b.img));

const ownBack=i=> i===0 || COS.backs.includes(BACKS[i].k);
function myBack(){ try{ const i=+localStorage.getItem('amv_back'); return (BACKS[i]&&ownBack(i))?i:0; }catch(e){ return 0; } }
function backOf(p){ return BACKS[p===0?myBack():0].img; }    // o oponente usa o verso padrão

/* ============================================================
   ESTADO
   ============================================================ */
let G = null;
const P = p => G.p[p];
const freeIdx = a => a.indexOf(null);
const chars = p => P(p).chars.filter(Boolean);
const supports = p => P(p).powers.filter(c => c && c.def.kind==='support');

function newPlayer(counts){
  const ids=[]; for(const id in counts) for(let i=0;i<counts[id];i++) ids.push(+id);
  return {life:MAX_LIFE, deck:shuffle(ids.map(mk)), hand:[], chars:[null,null,null], powers:[null,null,null], field:null, void:[], turns:0, esf:false};
}
function atkOf(p, inst){
  const intim = 300 * P(1-p).chars.filter(c=>c&&c.id===21).length;               // Zé do Trovão (Intimidador): -300 nos Personagens do oponente
  if(inst.tmp!=null) return Math.max(0, inst.tmp - intim);                       // Autoescola: ATQ final até o fim do turno
  let a;
  {
    a = inst.def.atk;
    const v = P(p).void;
    if(inst.id===1) a += 100 * v.filter(c=>c.def.kind==='char'&&isGZ(c)).length; // Goku: +100 por Guerreiro Z no vazio
    if(inst.id===2) a += 600 * v.filter(c=>c.id===3).length;                     // Gohan: +600 por Piccolo no vazio
    if(inst.id===42) a += 100 * ownPl(inst,P(p)).void.filter(c=>/Tronco/.test(c.def.name)).length;   // Tronco Queimado: +100 por "Tronco" no vazio do dono
  }
  a += 400 * inst.equips.length;                                                 // Kaioken: +400 cada (pode ter vários)
  a += inst.boost||0;                                                            // Kaioken aumentado 4x: +1000 até o fim do turno
  if(inst.id===33 && P(p).chars.some(c=>c&&[31,32,36].includes(c.id))) a+=200;   // Shifu - Pai Protetor
  return Math.max(0, a - intim);
}
function canAttack(p){ return !(p===G.first && P(p).turns===1); }   // quem começa não ataca no 1º turno
const canAtk=(p,c)=>canAttack(p) || !!(c&&c.def.first);           // "pode atacar no primeiro turno"
const canDirect=c=>!!(c&&(c.direct||c.def.direct));               // "pode atacar diretamente"

function detach(pl, inst){
  let i;
  if((i=pl.hand.indexOf(inst))>=0) pl.hand.splice(i,1);
  else if((i=pl.deck.indexOf(inst))>=0) pl.deck.splice(i,1);
  else if((i=pl.void.indexOf(inst))>=0) pl.void.splice(i,1);
  else if((i=pl.chars.indexOf(inst))>=0) pl.chars[i]=null;
  else if((i=pl.powers.indexOf(inst))>=0) pl.powers[i]=null;
  else if(pl.field===inst) pl.field=null;
}
const ownPl=(inst,pl)=> inst.own!=null ? P(inst.own) : pl;
function toVoid(pl, inst){
  detach(pl, inst);
  if(inst.equips.length){ inst.equips.forEach(k=>{ k.equipTo=null; detach(pl,k); ownPl(k,pl).void.push(k); }); inst.equips=[]; }
  if(inst.equipTo){ const g=inst.equipTo; g.equips=g.equips.filter(k=>k!==inst); inst.equipTo=null; }
  inst.direct=false; inst.attacked=false; inst.tmp=null; inst.used=false; inst.boost=0; inst.doom=false; inst.ctrlBy=null;
  ownPl(inst,pl).void.push(inst);
  releaseCtl(inst);
}
/* ---- controle de cartas (Sabrina / Troca de Marionetes) ---- */
const ctrlOf = inst => [0,1].find(x=>P(x).chars.includes(inst));
const puppets = sab => [0,1].flatMap(x=>chars(x)).filter(c=>c.ctrlBy===sab.uid);
const shielded = c => { if(c.id!==23) return false; const x=ctrlOf(c); return x!=null && chars(x).some(k=>k!==c && k.own!=null && k.own!==x); };   // Sabrina não pode ser alvo de ataque enquanto o controlador dela tiver um Personagem que era do oponente
const atkTargets = q => chars(q).filter(c=>!shielded(c));
function releaseCtl(sab){                                       // Sabrina deixou o campo: o personagem volta para o dono
  for(const c of puppets(sab)){
    c.ctrlBy=null; const x=ctrlOf(c); if(x===c.own) continue;
    detach(P(x),c); const fi=freeIdx(P(c.own).chars);
    if(fi>=0){ P(c.own).chars[fi]=c; G.settle=c.uid; } else toVoid(P(x),c);
    log(`${c.def.name} volta para ${c.own?'o oponente':'você'}.`);
  }
}
async function moveCtl(moves){                                  // moves: [inst, de(p,i), para(p,i)]
  if(!window.__NOFX){
    const els=moves.map(m=>document.querySelector(`[data-uid="${m[0].uid}"]`)); els.forEach(e=>{ if(e) e.style.visibility='hidden'; });
    await Promise.all(moves.map(m=>slideCard(slotRect(m[1][0],m[1][1]), slotRect(m[2][0],m[2][1]), mini(m[0]), 560, 0, null, true)));
  }
}

   ============================================================ */
async function doAttack(p, att, tgt){
  const q=1-p;
  att.attacked = true; G.atkUid = att.uid;
  const [a,d] = tgt ? clashVals(p,att,q,tgt) : [atkOf(p,att),0];   // Kikoho, Autodestruição e Duplo Sentido
  log(`Etapa de dano: ${att.def.name} (${a}) ataca ${tgt?tgt.def.name+' ('+d+')':'diretamente'}!`);
  render();
  if(tgt && a!==atkOf(p,att)) await tweenChip(att.uid, atkOf(p,att), a);   // mostra o ATQ de batalha (Kikoho, Duplo Sentido...)
  if(tgt && d!==atkOf(q,tgt)) await tweenChip(tgt.uid, atkOf(q,tgt), d);
  await clash(att, tgt, p);
  if(!tgt){ await damage(q, a); G.atkUid=null; render(); return; }
  if(a>d){
    await vanish(tgt.uid,q); toVoid(P(q),tgt); render();
    await damage(q, a-d);
    if(G.over) return;
    await afterBattle(p,att,q,tgt,false,true);
  } else if(a===d){
    log(`Empate! ${att.def.name} e ${tgt.def.name} vão para o vazio.`); toast('Empate: os dois vão para o vazio');
    await Promise.all([vanish(att.uid,p), vanish(tgt.uid,q)]);
    toVoid(P(p),att); toVoid(P(q),tgt); render();
    await afterBattle(p,att,q,tgt,true,false);
  } else {
    await vanish(att.uid,p); toVoid(P(p),att); render();
    await damage(p, d-a);
    if(G.over) return;
    await afterBattle(q,tgt,p,att,false,false);
  }
  G.atkUid=null; render();
}
// w/winner = quem destruiu; l/loser = quem foi destruído. tie: os dois foram destruídos.
async function afterBattle(w, winner, l, loser, tie, attackerWon){
  const sides=tie?[[w,winner,l,loser],[l,loser,w,winner]]:[[w,winner,l,loser]];
  for(const [pw,cw,pl_,cl] of sides){
    if(cl.id===6) await chaosFx(pl_,cl,pw,cw);          // Chaos foi destruído em batalha
  }
  if(!tie && attackerWon){   // Kaioken e Kikoho só valem quando o personagem vence ATACANDO
    const onField=P(w).chars.includes(winner);
    if(onField && winner.id===5){ log('Kikoho: Tenshinhan vai para o vazio.'); await sendVoid(w,winner); }
  }
  render(); await sleep(350);
}
async function chaosFx(owner, chaos, killerOwner, killer){
  const kill = P(killerOwner).chars.includes(killer) && atkOf(killerOwner,killer)<=1000;
  const pl0=P(owner), tt=pl0.deck.find(x=>x.id===5), willSummon = tt && freeIdx(pl0.chars)>=0;
  if(kill || willSummon){ render(); const vr=pileRect(owner,'void'); await activateFx(owner, chaos, vr, vr); }
  if(P(killerOwner).chars.includes(killer) && atkOf(killerOwner,killer)<=1000){
    log(`Adeus, Senhor Tenshinhan! ${killer.def.name} é destruído.`); await sendVoid(killerOwner,killer);
  }
  const pl=P(owner), t=pl.deck.find(x=>x.id===5);
  if(t && freeIdx(pl.chars)>=0){ await deckToField(owner,t,freeIdx(pl.chars)); shuffle(pl.deck); log(`${owner?'Oponente invoca':'Você invoca'} Tenshinhan do baralho!`); }
  render(); await sleep(700);
}
async function damage(who, n){
  const pl=P(who);
  if(n>0) await lifeFx(who, -n, ()=>{ pl.life=Math.max(0,pl.life-n); });
  else pl.life=Math.max(0,pl.life-n);
  render(); checkWin();
}
/* vida: o número aparece no meio da tela, viaja até a barra de quem ganhou/perdeu e só então a barra mexe */
async function lifeFx_raw(who, delta, apply){
  const st=GL();
  const f=el('div','lifefx '+(delta<0?'dmg':'heal'),(delta<0?'−':'+')+Math.abs(delta));
  f.style.left='540px'; f.style.top='960px'; st.appendChild(f);
  await sleep(620);                                      // surge e fica um instante parado
  const lb=document.getElementById('life'+who);
  const t=lb?stageRect(lb):{x:who?23:689,y:25,w:362,h:56};
  f.classList.add('go');
  f.style.left=(t.x+t.w/2)+'px'; f.style.top=(t.y+t.h/2)+'px';
  await sleep(420);                                      // desliza rápido até a barra
  f.classList.add('hit'); setTimeout(()=>f.remove(),260);
  if(lb){ lb.classList.remove('flash'); void lb.offsetWidth; lb.classList.add('flash'); }
  apply(); sfx(delta<0?'dmg':'heal'); if(delta<=-1000){ shake(delta<=-2000?34:24); vib(who===0?[90,40,140]:[50]); } else if(delta<0 && who===0) vib(80);   // agora a barra começa a descer/subir
  const target=P(who).life, t0=Date.now();
  while(Math.round(LF[who])!==target && Date.now()-t0<1800) await sleep(40);
}

  if(G.over) return;
  if(P(0).life<=0) endGame(1); else if(P(1).life<=0) endGame(0);

function flyCard(a, bx, img, ms, spin){

    requestAnimationFrame(()=>{
      d.style.transition=`left ${ms}ms cubic-bezier(.25,.9,.3,1),top ${ms}ms cubic-bezier(.25,.9,.3,1),width ${ms}ms ease,height ${ms}ms ease,transform ${ms}ms ease,opacity ${Math.round(ms*.35)}ms ease ${Math.round(ms*.65)}ms`;

        add('Usar', !chars(p).some(c=>c.def.fios)?'Um dos seus Personagens precisa ter a habilidade "Fios Invisíveis".':(tg.length?null:'O oponente não tem Personagem com 1000 de ATQ ou menos.'), async()=>{

          if(m===null) return;
          const e=await chooseCards(m===0?'Escolha o Personagem':'Escolha o Poder',m===0?cc:pc); if(!e) return;
          await A.esferas(p,inst,e);
        });
      }
      if(inst.id===16){
        const gs=chars(p).filter(c=>c.id===1), pcs=chars(p).filter(c=>c.id===3);
        add('Usar', (gs.length&&pcs.length)?null:'Precisa de "Goku" e "Piccolo" em campo ao mesmo tempo.', async()=>{
          let g=gs[0], pc=pcs[0];
          if(gs.length>1){ const r=await pickTarget(gs,{prompt:'Autoescola: escolha o Goku.'}); if(!r) return; g=r.target; }
          if(pcs.length>1){ const r=await pickTarget(pcs,{prompt:'Autoescola: escolha o Piccolo.'}); if(!r) return; pc=r.target; }
          await A.auto(p,inst,g,pc);
        });
      }
      if(inst.id===15) add('Usar', !pl.void.some(c=>c.id===1)?'"Goku - Guerreiros Z" não está no seu vazio.':(freeIdx(pl.chars)<0?'Os 3 slots de Personagem estão ocupados.':null), async()=>{ let sl=null; if(p===0){ const r=await pickSlot('Caminho da serpente: escolha onde o Goku vai entrar.'); if(!r) return; sl=r.slot; } await A.caminho(p,inst,sl); });
    }
  }
  if(where==='field'){
    if(d.kind==='char'){
      add('Atacar', !canAtk(p,inst)?'Quem começa a partida só ataca no 2º turno.':(inst.attacked?'Já atacou neste turno.':null), async()=>{
        const tg=atkTargets(q);
        if(tg.length===0){ await doAttack(p,inst,null); return; }
        const r=await pickTarget(tg,{prompt:`Escolha o alvo de ${d.name}.`, direct:canDirect(inst), attack:true, foe:q, att:inst});
        if(!r) return;
        if(r.switch){ if(REPLAYING) return; const a2=actionsFor(p,r.switch,'field').find(x=>x.label==='Atacar'&&!x.reason); if(a2) setTimeout(()=>runAction(a2),60); return; }
        await doAttack(p,inst,r.direct?null:r.target);
      });
      if(inst.id===3){
        const goku=chars(p).find(c=>c.id===1);
        add('Efeito: enviar Goku ao vazio',
          inst.used?'Já usado neste turno.':(inst.attacked?'Piccolo já atacou neste turno.':(goku?null:'Precisa de "Goku - Guerreiros Z" em campo.')),
          async()=>{
            const gs=chars(p).filter(c=>c.id===1); let g=gs[0];
            if(gs.length>1){ const r=await pickTarget(gs,{prompt:'Escolha o Goku a enviar ao vazio.'}); if(!r) return; g=r.target; }
            await A.picc(p,inst,g);
          });
      }
    }
    if(inst.id===39) add('Efeito: Segura aí!', inst.used?'Já usado neste turno.':null, async()=>await A.dmgFx(p,inst,400,'Segura aí!'));
    if(inst.id===41){ const n=chars(1-p).length; add('Efeito: Super Esferas Flamejantes', inst.used?'Já usado neste turno.':(n?null:'O oponente não tem Personagens em campo.'), async()=>await A.dmgFx(p,inst,300*chars(1-p).length,'Super Esferas Flamejantes do Todo Poderoso Napoleão!')); }
    if(inst.id===40) add('Efeito: Maldição da chama', inst.used?'Já usado neste turno.':(P(1-p).hand.length?null:'O oponente não tem cartas na mão.'), async()=>await A.muhriqa(p,inst));
    if(inst.id===21) add('Efeito: Me dá meu cajado', inst.used?'Já usado neste turno.':(pl.deck.some(x=>x.id===22)?null:'Não há "Cajado do Zé" no baralho.'), async()=>await A.ze(p,inst,pl.deck.find(x=>x.id===22)));
    if(inst.id===35) add('Efeito: Venha! Da Shui Long', inst.used?'Já usado neste turno.':(pl.deck.some(isDSL)?null:'Não há cartas "Da Shui Long" no baralho.'), async()=>{
      const r=await chooseFromList('Escolha uma carta "Da Shui Long" do baralho',pl.deck.filter(isDSL)); if(!r) return;
      await A.taishizu(p,inst,r);
    });
    if(inst.id===27) add('Efeito: buscar carta "Ma Mei"', inst.used?'Já usado neste turno.':(pl.deck.some(isMaMei)?null:'Não há cartas "Ma Mei" no baralho.'), async()=>{
      const r=await chooseFromList('Escolha uma carta "Ma Mei" do baralho',pl.deck.filter(isMaMei)); if(!r) return;
      await A.casa(p,r,inst);
    });
    if(inst.id===26){ const n=chars(p).filter(isMaMei).length;
      add('Efeito: ganhar vida', inst.used?'Já usado neste turno.':(n?null:'Não há Personagens "Ma Mei" no seu campo.'), async()=>await A.nainai(p,inst)); }
    if(inst.id===8) add('Efeito: buscar Guerreiro Z', inst.used?'Já usado neste turno.':(pl.deck.some(isGZ)?null:'Não há cartas "Guerreiros Z" no baralho.'), async()=>{
      const r=await chooseFromList('Escolha um "Guerreiro Z" do baralho',pl.deck.filter(isGZ)); if(!r) return;
      await A.casa(p,r,inst);
    });
    if(inst.id===10) add('Efeito: buscar Radar do dragão', inst.used?'Já usado neste turno.':(pl.deck.some(x=>x.id===13)?null:'Não há "Radar do dragão" no baralho.'), async()=>await A.bulma(p,inst));
    if(inst.id===18){
      const cs=pl.deck.filter(x=>x.id===15||x.id===17||x.id===19);
      add('Efeito: buscar carta', inst.used?'Já usado neste turno.':(!chars(p).some(c=>c.id===1)?'Precisa de "Goku - Guerreiros Z" em campo.':(cs.length?null:'Não há "Caminho da serpente", "Kaioken" ou "Kaioken aumentado 4x" no baralho.')), async()=>{
        const r=await chooseFromList('Senhor Kaioh: escolha uma carta do baralho',cs); if(!r) return;
        await A.kaioh(p,inst,r);
      });
    }
  }
  // animação primeiro, efeito (e escolhas) depois
  const fxFirst = a => a.label==='Usar' || a.label==='Equipar' || a.label.startsWith('Efeito');
  L.forEach(a=>{ if(!fxFirst(a)) return; const r0=a.run, stay=where==='field';
    a.run=async()=>{ await activateFx(p,inst,stay); inst.fxDone=true; try{ return await r0(); } finally{ inst.fxDone=false; } }; });
  L.forEach(a=>{   // cada ação só vale na sua fase
    if(a.label==='Atacar'){ if(G.phase!=='attack') a.reason='Só na fase de ataque.'; }
    else if(inst.def.kind==='item' && where==='hand'){ if(G.phase!=='prep' && G.phase!=='attack') a.reason='Itens só nas fases de preparação e ataque.'; }
    else if(inst.id===3 && where==='field'){ if(G.phase!=='prep' && G.phase!=='attack') a.reason='Só nas fases de preparação e ataque.'; }   // Piccolo: preparação ou batalha
    else if(G.phase!=='prep') a.reason='Só na fase de preparação.';
  });
  return L;
}

function searchList_ui(title, entries){        // lista vertical estilo Yu-Gi-Oh, agrupada com "x2"
  return new Promise(res=>{
    const box=el('div','mbox'); box.appendChild(el('div','big',title));
    const list=el('div','slist');
    const groups=new Map();
    entries.forEach(e=>{ const k=e.inst.id+'|'+(e.label||''); if(!groups.has(k)) groups.set(k,{inst:e.inst,label:e.label,n:0}); groups.get(k).n++; });
    groups.forEach(g=>{
      const d=g.inst.def, r=el('div','srow'+(g.label==='Vazio'?' void':''));
      const th=el('div','sth'); th.style.backgroundImage=`url("${d.mini}")`; r.appendChild(th);
      const info=el('div','sinfo');
      info.appendChild(el('div','sname',d.name));
      let sub=kindIco(d.kind)+KIND[d.kind];
      if(d.kind==='char') sub+=` · ${elIco(d.el)}${ELEM[d.el].n} · ATQ ${d.atk}`;
      if(g.label) sub+=` · ${g.label}`;
      info.appendChild(el('div','ssub',sub));
      r.appendChild(info);
      if(g.n>1) r.appendChild(el('div','scount','x'+g.n));
      r.addEventListener('click',()=>{ closeModal(); res(g.inst); });
      list.appendChild(r);
    });
    box.appendChild(list); box.appendChild(btn('Cancelar','sec',()=>{closeModal();res(null);}));
    G.modalRes=()=>res(null); showModal(box);
  });
}
const chooseFromList = (title, insts) => searchList(title, insts.map(i=>({inst:i,label:null})));
const chooseCards = (title, cands) => searchList(title, cands);

function zoneCands(pl, pred, exclude){   // todas as cópias: a lista agrupa e mostra o "xN"
  const out=[];
  pl.deck.forEach(i=>{ if(i!==exclude&&pred(i)) out.push({inst:i,label:'Baralho'}); });
  pl.void.forEach(i=>{ if(i!==exclude&&pred(i)) out.push({inst:i,label:'Vazio'}); });
  return out;
}
const chooseMode=(...a)=>netChoice(chooseMode_ui,a);
function chooseMode_ui(title, opts){
  return new Promise(res=>{
    const box=el('div','mbox'); box.appendChild(el('div','big',title));
    const acts=el('div','acts');
    opts.forEach((o,i)=>{ const b=btn(o.label,'',()=>{closeModal();res(i);}); if(o.off) b.disabled=true; acts.appendChild(b); });
    box.appendChild(acts); box.appendChild(btn('Cancelar','sec',()=>{closeModal();res(null);}));
    G.modalRes=()=>res(null); showModal(box);
  });
}

function showModal(node){ const m=$('#modal'); m.innerHTML=''; node.classList.add('modal-in'); m.appendChild(node); m.classList.add('on'); }
function closeModal(){ setPause(false); const m=$('#modal'); m.classList.remove('on'); m.innerHTML=''; }
function canAct(){ return G && !G.over && !G.busy && G.turn===0 && !G.pick; }

function bigArt(e,d){ e.style.backgroundImage=`url("${d.mini}")`; if(d.mini===d.img) return; const im=new Image(); im.onload=()=>{ e.style.backgroundImage=`url("${d.img}")`; }; im.src=d.img; }
function cardModal(inst, p, where, noActs){
  const box=el('div','mbox');
  const big=el('div','bigcard'); bigArt(big,inst.def); box.appendChild(big);
  const info = inst.def.kind==='char'
    ? `Tipo: ${elIco(inst.def.el)}${ELEM[inst.def.el].n} · Arquétipo: ${inst.def.arq.join(' / ')}<br><b style="color:#fff">ATQ atual: ${atkOf(p,inst)}</b>`
    : kindIco(inst.def.kind)+KIND[inst.def.kind];
  box.appendChild(el('div','',`<div style="font-size:34px;color:#bbb;line-height:1.4">${info}</div>`));
  const acts=el('div','acts');
  if(!noActs && canAct() && ((p===0 && where==='hand') || (where==='field' && (p===0 || inst.def.kind==='field')))){
    actionsFor(0,inst,where).forEach(a=>{
      const b=btn(a.label,'',()=>runAction(a)); if(a.reason) b.disabled=true; acts.appendChild(b);
      if(a.reason) acts.appendChild(el('div','why',a.reason));
    });
  }
  box.appendChild(acts);
  box.appendChild(btn('Fechar','sec',closeModal));
  showModal(box);
}

function tutCheck(){
  if(!G||!G.tut||G.over||G.pick||document.querySelector('.tut,.asback')||$('#modal').classList.contains('on')) return;

function cardTap(r, ce){                           // toque numa carta do campo: faz a ação direto
  if(r.zone==='hand') return;
  if(r.zone==='void'){ voidModal(r.p); return; }
  const where='field', inst=r.inst, p=r.p;
  if(!(canAct() && (p===0 || inst.def.kind==='field'))) return;
  const all=actionsFor(0,inst,where), ok=all.filter(a=>!a.reason);
  if(ok.length===1){ sfx('click'); runAction(ok[0]); return; }
  if(!ok.length){ if(all.length) toast(all[0].reason); return; }
  closeSheet();                                    // mais de uma ação: botões ao lado da carta
  const ov=el('div','asback'); ov.onclick=e=>{ if(e.target===ov) closeSheet(); };
  const m=el('div','ctxm'); ok.forEach(a=>m.appendChild(btn(a.label,'sm2',()=>{ closeSheet(); runAction(a); })));
  ov.appendChild(m); $('#stage').appendChild(ov);
  const q=stageRectS(ce), mw=Math.max(320,q.w+80), x=Math.min(1080-mw-20,Math.max(20,q.x+q.w/2-mw/2));
  m.style.width=mw+'px'; m.style.left=x+'px';
  const mh=m.offsetHeight; m.style.top=(q.y-mh-16>20 ? q.y-mh-16 : q.y+q.h+16)+'px';

function closeSheet(){ const o=document.querySelector('.asback'); if(o) o.remove(); }

  const sh=el('div','actsheet');

  th.appendChild(el('span','','🔍')); top.appendChild(th);
  const d=inst.def, info=d.kind==='char' ? `${elIco(d.el)}${ELEM[d.el].n} · ${d.arq.join(' / ')}<br><b>ATQ ${atkOf(p,inst)}</b>` : kindIco(d.kind)+KIND[d.kind];

async function runAction(a){
  closeModal(); closeSheet(); G.busy=true; render();
  const net=NET && G.turn===0; if(net) REC=[];
  try{ await a.run(); } finally {
    if(net){ const ch=REC||[]; REC=null; if(a.net) netSend({...a.net, ch}); else if(a.uid!=null) netSend({t:'act', uid:a.uid, where:a.where, label:a.label, ch}); }
    if(G && !G.over && G.turn===0) G.busy=false; render(); checkWin(); }
}

function zone(parent, x,y,w,h,label,small,flip){
  const z=el('div','zone'+(small?' small':'')+(['Personagem','Poder','Baralho','Vazio'].includes(label)?' slot':'')); z.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  if(label){ const sp=el('span','lbl'+(flip?' flip':''),label); z.appendChild(sp); }
  parent.appendChild(z); return z;
}
function cardEl(inst, p, zname){
  const c=el('div','card'); c.style.backgroundImage=`url("${mini(inst)}")`; c.dataset.uid=inst.uid;
  G.index.set(inst.uid,{inst,p,zone:zname});
  if(G.pick && G.pick.set.has(inst.uid)) c.classList.add('cand');
  if(G.pick && G.pick.attack && zname==='char'){ if(G.pick.set.has(inst.uid)) c.classList.add('atk'); else if(p===G.pick.foe) c.classList.add('nocand'); }
  return c;
}
let seen=new Set();
function render(){
  const b=$('#board');
  if(!G){ b.innerHTML=''; return; }
  G.index=new Map();
  const frag=document.createDocumentFragment();

  for(const p of [1,0]){
    const pl=P(p), pos=POS[p], fl=(p===1);
    for(let i=0;i<3;i++){
      const z=zone(frag,pos.chars[i][0],pos.chars[i][1],CHAR_W,CHAR_H,'Personagem',false,fl); if(p===0) z.dataset.drop='c'+i;
      if(p===0 && G.pick && G.pick.slots && G.pick.slots.has(i)) z.classList.add('drop','over');
      const c=pl.chars[i];
      if(c){
        z.textContent=''; const ce=cardEl(c,p,'char'); z.appendChild(ce);
        const a=atkOf(p,c), base=c.def.atk;
        ce.appendChild(chipAtq(a, base));
        c.equips.forEach((k,ki)=>{
          const ti=el('div','toolico'); ti.style.backgroundImage=`url("${mini(k)}")`; const nT=Math.min(c.equips.length,2); ti.style.top=`calc(38.845% - ${(nT*66+(nT-1)*10)/2 - ki*76}px)`; ti.dataset.uid=k.uid;   // grupo centralizado na área marcada
          G.index.set(k.uid,{inst:k,p,zone:'tool'});
          if(G.pick && G.pick.set.has(k.uid)) ti.classList.add('cand');
          ce.appendChild(ti);                      // dentro da carta: vai junto no ataque
        });
        if(canDirect(c)) ce.appendChild(el('div','chip tag2','DIRETO'));
        if(c.attacked && p===G.turn && c.uid!==G.atkUid) ce.classList.add('dim');   // só apaga quem já atacou NESTE turno
        if(p===0 && canAct() && G.phase!=='end' && actionsFor(0,c,'field').some(a=>!a.reason)) ce.classList.add('glow');
      }
      const z2=zone(frag,pos.powers[i][0],pos.powers[i][1],PW,PH,'Poder',false,fl); if(p===0) z2.dataset.drop='w'+i;
      const w=pl.powers[i];
      if(w){ z2.textContent=''; const ce=cardEl(w,p,'power'); z2.appendChild(ce); if(w.used) ce.classList.add('dim'); if(p===0 && canAct() && actionsFor(0,w,'field').some(a=>!a.reason && a.label!=='Atacar')) ce.classList.add('glow'); }
    }
    const zd=zone(frag,pos.deck[0],pos.deck[1],SW,SH,'Baralho',true,fl);
    if(pl.deck.length){ zd.textContent=''; const bk=el('div','card back img'); bk.style.backgroundImage=`url("${backOf(p)}")`; bk.dataset.deck=p; zd.appendChild(bk); }
    const zv=zone(frag,pos.void[0],pos.void[1],SW,SH,'Vazio',true,fl);
    if(pl.void.length){ zv.textContent=''; const top=pl.void[pl.void.length-1]; const ce=el('div','card'); ce.style.backgroundImage=`url("${mini(top)}")`; ce.dataset.void=p; zv.appendChild(ce); }
    zv.dataset.void=p;
  }
  // campo (um só, compartilhado)
  const fo = P(0).field ? [0,P(0).field] : (P(1).field ? [1,P(1).field] : null);
  const zf=zone(frag,FIELD[0],FIELD[1],FIELD_W,FIELD_H,'Poder',true); zf.dataset.drop='f';
  if(fo){ zf.textContent=''; const ce=cardEl(fo[1],fo[0],'field'); zf.appendChild(ce); if(fo[1].used) ce.classList.add('dim'); else if(canAct() && actionsFor(0,fo[1],'field').some(a=>!a.reason)) ce.classList.add('glow'); if(fo[0]===1) ce.appendChild(el('div','chip tag','OPON.')); }

  // mão do oponente
  const oh=P(1).hand.length;
  for(let i=0;i<oh;i++){
    const step=oh>1?Math.min(70,(810-90)/(oh-1)):0; const total=(oh-1)*step+90;
    const x=(1080-total)/2+i*step;
    const c=el('div','card back img'); c.style.cssText=`inset:auto;left:${x}px;top:150px;width:84px;height:118px;cursor:default;background-image:url("${backOf(1)}")`; frag.appendChild(c);
  }
  // mão do jogador
  const h=P(0).hand, n=h.length, W=190;
  const step=n>1?Math.min(W+12,(930-W)/(n-1)):0, total=(n-1)*step+W, x0=(1080-total)/2;
  const can=canAct();
  h.forEach((inst,i)=>{
    const m=n>1?(i-(n-1)/2)/((n-1)/2):0; const d=el('div','hand'); d.dataset.hi=i; d.style.cssText=`left:${x0+i*step}px;top:${1648+m*m*26}px;z-index:${i};transform:rotate(${m*4}deg);transform-origin:50% 150%`;
    const ce=cardEl(inst,0,'hand'); d.appendChild(ce);
    if(can && actionsFor(0,inst,'hand').some(a=>!a.reason)) d.classList.add('playable');
    frag.appendChild(d);
  });

  // HUD: vida, avatares, turno
  for(const p of [1,0]){
    const pl=P(p); const z=el('div','zone life'); z.id='life'+p;
    z.style.cssText=`left:${p?23:689}px;top:25px;width:362px;height:56px`;
    z.innerHTML=`<i></i><span></span>`; paintLife(z,p);
    frag.appendChild(z);
    const za=zone(frag,p?23:952,95,p?99:98,98,p?'avatar oponente':'Seu avatar',true); za.classList.add('av');
    if(p===0 && ACC.user && ACC.profile && DEFS[ACC.profile.avatar]){ za.textContent=''; za.classList.add('me'); za.appendChild(avatarEl(ACC.profile.avatar,'bav')); }
    if(p===1 && NET && NET.opp && DEFS[NET.opp.avatar]){ za.textContent=''; za.classList.add('me'); za.appendChild(avatarEl(NET.opp.avatar,'bav')); }
  }
  const zt=el('div','zone turn'); zt.style.cssText='left:492px;top:25px;width:99px;height:99px';
  zt.textContent=G.turnNo;
  frag.appendChild(zt);
  let lab='Turno do oponente';
  if(G.turn===0) lab=G.phase==='attack'?'Fim do turno':((G.phase==='prep' && P(0).chars.some(c=>c&&canAtk(0,c)))?'Ir para o ataque':'Fim do turno');
  const eb=btn(lab,'',()=>endTurnHuman()); eb.id='endbtn'; if(!can) eb.disabled=true; if(G.turn!==0) eb.classList.add('sec'); frag.appendChild(eb);
  const mb=btn('Menu','sec',menuModal); mb.id='menubtn'; frag.appendChild(mb);

  // mensagens / prompt
  const msg=el('div'); msg.id='msg';
  if(G.pick){
    msg.className='pick'; msg.appendChild(el('div','t',G.pick.prompt));
    if(G.pick.direct) msg.appendChild(btn('Direto','sm',()=>endPick({direct:true})));
    msg.appendChild(btn('Cancelar','sm sec',()=>endPick(null)));
  } else {
    msg.style.display='none';
  }
  frag.appendChild(msg);
  b.replaceChildren(frag);
  if(G.busy||G.pick||G.over) closeSheet();
  tutCheck();
  if(G.settle){ const se=b.querySelector(`[data-uid="${G.settle}"]`); if(se) se.classList.add('settle'); seen.add(G.settle); G.settle=null; }
  const now=new Set();
  G.index.forEach((r,u)=>{ now.add(u); if(!seen.has(u) && seen.size){ const e=b.querySelector(`[data-uid="${u}"]`); if(!e) return;
    const q=stageRect(e);
    if(r.zone==='hand'&&r.p===0){ const d=POS[0].deck; e.style.setProperty('--ex',(d[0]-q.x)+'px'); e.style.setProperty('--ey',(d[1]-q.y)+'px'); e.classList.add('enterHand'); }
    else if(r.zone==='char'||r.zone==='power'||r.zone==='field'){ e.style.setProperty('--ex',(540-q.x-q.w/2)+'px'); e.style.setProperty('--ey',(700-q.y-q.h/2)+'px'); e.classList.add('enterField'); }
  } });
  seen=now;
}

/* clique no campo */
$('#board').addEventListener('click', e=>{
  if(!G || G.over || blocked()) return;   // durante animações/ações nenhuma carta abre
  const ce=e.target.closest('[data-uid]');
  const ve=e.target.closest('[data-void]');
  if(G.pick){
    if(G.pick.slots){ const z=e.target.closest('[data-drop]'); if(z && z.dataset.drop[0]==='c' && G.pick.slots.has(+z.dataset.drop.slice(1))) endPick({slot:+z.dataset.drop.slice(1)}); return; }
    if(ce){ const u=+ce.dataset.uid; if(G.pick.set.has(u)){ endPick({target:G.pick.map.get(u)}); return; }
      if(G.pick.attack && G.pick.att){ const r=G.index.get(u);             // tocou em outro Personagem seu: ele passa a ser o atacante
        if(r && r.p===0 && r.zone==='char' && r.inst!==G.pick.att && !r.inst.attacked && canAtk(0,r.inst)){ endPick({switch:r.inst}); return; } } }
    return;
  }
  if(e.target.closest('.hand')) return;   // a mão usa o gesto de deslizar/arrastar
  if(ce){ if(FP.suppress){ FP.suppress=false; return; } const r=G.index.get(+ce.dataset.uid); if(r) cardTap(r, ce); return; }
  if(ve){ voidModal(+ve.dataset.void); return; }
  const de=e.target.closest('[data-deck]'); if(de){ toast(`Baralho ${+de.dataset.deck?'do oponente':'seu'}: ${P(+de.dataset.deck).deck.length} cartas`); }
});

/* ============================================================
   MÃO: deslizar o dedo levanta a carta; arrastar para cima leva ao campo
   ============================================================ */
const H={on:false};
function toStage(cx,cy){ const s=GL().getBoundingClientRect(), k=s.width/1080; return {x:(cx-s.left)/k, y:(cy-s.top)/k}; }
function handAt(cx){                            // carta da mão sob o dedo (a mais à frente)
  let best=null; document.querySelectorAll('#board .hand').forEach(h=>{ const r=h.getBoundingClientRect(); if(cx>=r.left && cx<=r.right) best=h; });
  return best;
}
function setLift(h){ document.querySelectorAll('#board .hand.lift').forEach(x=>{ if(x!==h) x.classList.remove('lift'); }); if(h) h.classList.add('lift'); }
function dropTargets(inst){                     // onde essa carta pode ser solta
  const pl=P(0), k=inst.def.kind, out=[];
  if(k==='char') pl.chars.forEach((c,i)=>{ if(!c) out.push('c'+i); });
  else if(k==='support') pl.powers.forEach((c,i)=>{ if(!c) out.push('w'+i); });
  else if(k==='tool') pl.chars.forEach((c,i)=>{ if(canEquip(inst,c)) out.push('c'+i); });
  else if(k==='field'){ const cur=P(0).field||P(1).field; if(!(cur&&cur.id===inst.id)) out.push('f'); }
  return out;   // item: qualquer lugar do campo
}
function zoneUnder(cx,cy){ let z=null; document.querySelectorAll('#board .zone.drop').forEach(e=>{ const r=e.getBoundingClientRect(); if(cx>=r.left-20&&cx<=r.right+20&&cy>=r.top-20&&cy<=r.bottom+20) z=e; }); return z; }
$('#board').addEventListener('pointerdown', e=>{
  const h=e.target.closest('.hand'); if(!h || !G || G.over || G.pick || blocked()) return;
  e.preventDefault();
  H.on=true; H.id=e.pointerId; H.x0=e.clientX; H.y0=e.clientY; H.moved=false; H.drag=false; H.h=h; H.peeked=false;
  H.inst=P(0).hand[+h.dataset.hi]; setLift(h); peekArm();
});
const PEEK_MS=400;                                 // tempo com o dedo parado sobre a carta até ela aparecer grande
function peekHide(){ clearTimeout(H.pt); if(H.peek){ H.peek.remove(); H.peek=null; } }
function peekArm(){ peekHide(); H.pt=setTimeout(()=>{ if(!H.on || H.drag || !H.inst) return;
  H.peek=el('div','peek'); H.peek.style.backgroundImage=`url("${H.inst.def.img}")`; GL().appendChild(H.peek); H.peeked=true; }, PEEK_MS); }
function inItemZone(cx,cy){ const z=document.querySelector('.itemzone'); if(!z) return false; const r=z.getBoundingClientRect(); return cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom; }
addEventListener('pointermove', e=>{
  if(!H.on || e.pointerId!==H.id) return;
  if(H.peeked) return;                          // carta ampliada: fica na tela até tirar o dedo, mesmo arrastando
  const dx=e.clientX-H.x0, dy=e.clientY-H.y0, k=$('#stage').getBoundingClientRect().width/1080;
  if(Math.hypot(dx,dy)>10*k) H.moved=true;
  if(!H.drag){
    const p=toStage(e.clientX,e.clientY);
    if(p.y < 1560 && canAct()){                 // saiu da mão para cima: começa a arrastar
      H.drag=true; peekHide(); H.h.classList.remove('lift'); H.h.classList.add('dragging');
      if(H.inst.def.kind==='item'){ H.zone=el('div','itemzone'); GL().appendChild(H.zone); }
      H.ghost=el('div','ghost'); H.ghost.style.backgroundImage=`url("${mini(H.inst)}")`; GL().appendChild(H.ghost);
      H.targets=dropTargets(H.inst);
      H.targets.forEach(t=>{ const z=document.querySelector(`#board [data-drop="${t}"]`); if(z) z.classList.add('drop'); });
    } else {                                    // deslizando sobre a mão: levanta a carta sob o dedo
      if(Math.abs(dx)>Math.abs(dy)){ const h=handAt(e.clientX); if(h && h!==H.h){ H.h=h; H.inst=P(0).hand[+h.dataset.hi]; peekArm(); } }   // só troca deslizando para o lado
      setLift(H.h);
    }
  }
  if(H.drag){
    const p=toStage(e.clientX,e.clientY); H.ghost.style.left=p.x+'px'; H.ghost.style.top=p.y+'px';
    const z=zoneUnder(e.clientX,e.clientY); document.querySelectorAll('#board .zone.over').forEach(x=>{ if(x!==z) x.classList.remove('over'); }); if(z) z.classList.add('over');
    if(H.zone) H.zone.classList.toggle('over', inItemZone(e.clientX,e.clientY));
  }
});
function endHand(){
  peekHide(); if(H.zone){ H.zone.remove(); H.zone=null; }
  if(H.ghost) H.ghost.remove();
  document.querySelectorAll('#board .zone.drop').forEach(z=>z.classList.remove('drop','over'));
  document.querySelectorAll('#board .hand').forEach(h=>h.classList.remove('lift','dragging'));
  H.on=false; H.drag=false; H.ghost=null;
}
addEventListener('pointerup', e=>{ if(!H.on || e.pointerId!==H.id) return;
  const inst=H.inst, drag=H.drag, moved=H.moved, peeked=H.peeked;
  const z=drag?zoneUnder(e.clientX,e.clientY):null, p=toStage(e.clientX,e.clientY);
  const okItem = drag && inst && inst.def.kind==='item' && inItemZone(e.clientX,e.clientY);
  const gr = H.ghost ? stageRect(H.ghost) : null;
  endHand();
  if(!drag) return;      // toque simples na mão: só levanta a carta (segure para ver grande, arraste para jogar)
  if(okItem && gr) G.fxFrom=gr;                                                     // a ativação começa de onde a carta foi solta
  dropPlay(inst, z?z.dataset.drop:null, p.y, okItem);
});
addEventListener('pointercancel', ()=>{ if(H.on) endHand(); });
async function dropPlay(inst, slot, y, okItem){
  if(!canAct() || !P(0).hand.includes(inst)) return;
  const k=inst.def.kind, a=actionsFor(0,inst,'hand')[0];
  if(!a) return;
  if(a.reason){ toast(a.reason); return; }
  if(k==='item'){ if(okItem) await runAction(a); else G.fxFrom=null; return; }   // item: solta dentro da área amarela

async function draw(p){

  if(!pl.deck.length){ log(`${p?'Oponente':'Você'} não tem cartas para comprar!`); endGame(1-p); return false; }
  const c=pl.deck.shift();
  await drawAnim(p,c);

}
async function startTurn(p){
  if(G.over) return;
  G.turn=p; G.phase='prep'; G.turnNo++; const pl=P(p); pl.turns++; timerStart();
  pl.esf=false; pl.summoned=false;
  [...P(0).chars,...P(1).chars].filter(Boolean).forEach(c=>{c.tmp=null; c.imm=false;});   // efeitos 'até o fim do turno' terminam
  [...pl.chars,...pl.powers].filter(Boolean).forEach(c=>{c.attacked=false;c.direct=false;c.used=false;});
  [P(0).field,P(1).field].filter(Boolean).forEach(c=>{c.used=false;});   // efeito do campo: 1x por turno, vale para quem estiver jogando
  G.busy=true; render();
  await banner(p===0?'SEU TURNO':'TURNO DO OPONENTE');
  if(G.over) return;
  if(!(await draw(p))) return;
  log(p===0?'Você comprou uma carta.':'Oponente comprou uma carta.');
  if(!canAttack(p)) log(p===0?'Primeiro turno: você ainda não pode atacar.':'Primeiro turno do oponente: ele não pode atacar.');

  else { G.busy=false; render(); }
}

async function finalPhase(p){

/* ---------- conexão em tempo real (Supabase Realtime) ---------- */
function netOpen(mv){
  NET={id:mv.id, side:mv.side, opp:mv.opp, mv, out:0, inq:0, buf:{}, inbox:[], wait:null, peer:false, lastSeen:Date.now(), tx:null};
  if(window.__netTx){ NET.tx=window.__netTx; window.__netRecv=netRecv; NET.hb=setInterval(()=>NET&&NET.tx({t:'hb'}),5000); return; }       // testes locais
  const ch=SB.channel('amv-m-'+mv.id,{config:{broadcast:{self:false}}});
  ch.on('broadcast',{event:'m'},({payload})=>netRecv(payload));
  ch.subscribe(st=>{ if(NET && st==='SUBSCRIBED') NET.ready=true; });
  NET.ch=ch; NET.tx=m=>{ if(NET && NET.ready) ch.send({type:'broadcast',event:'m',payload:m}); else setTimeout(()=>NET&&NET.tx&&NET.tx(m),300); };
  NET.hb=setInterval(()=>{ if(NET&&NET.ready) try{ ch.send({type:'broadcast',event:'m',payload:{t:'hb'}}); }catch(e){} },5000);
}
function netClose(){ if(!NET) return; try{ clearInterval(NET.hb); if(NET.ch) SB.removeChannel(NET.ch); }catch(e){} NET=null; }
async function netHandshake(){                       // espera os dois estarem conectados
  const t0=Date.now();
  while(NET && !NET.peer && Date.now()-t0<25000){ try{ NET.tx({t:'hi'}); }catch(e){} await sleep(700); }
  if(NET && NET.peer){ try{ NET.tx({t:'hi'}); }catch(e){} await sleep(400); return true; }
  return false;
}

async function botTurn(){
  const p=1,q=0,pl=P(p),ql=P(q);
  const pause=async ms=>{ await sleep(ms); render(); return !G.over; };
  const hand=id=>pl.hand.find(c=>c.id===id);
  const freeC=()=>freeIdx(pl.chars)>=0, freeP=()=>freeIdx(pl.powers)>=0;
  const projAtk=c=>atkOf(p,c);
  const bAtk=a=>atkOf(p,a)+(a.id===5?300:0);
  const bDef=t=>atkOf(q,t)-(t.id===7?300:0);
  const cv=(a,t)=>clashVals(p,a,q,t), wins=(a,t)=>{ const v=cv(a,t); return v[0]>v[1]; }, ties=(a,t)=>{ const v=cv(a,t); return v[0]===v[1]; };
  await sleep(500);
  const summonAll=async()=>{
    if(freeC() && !pl.summoned){                     // 1 invocação normal por turno
      const cs=pl.hand.filter(x=>x.def.kind==='char').sort((a,b)=>projAtk(b)-projAtk(a));
      if(!cs.length) return true;
      pl.summoned=true; await A.summon(p,cs[0]); if(!await pause(800)) return false;
    }
    return true;
  };

  // 1) Casa do Kame
  let c=hand(8);
  if(c && !P(0).field && !pl.field){ await A.field(p,c); if(!await pause(800)) return; }
  const fld=P(0).field||P(1).field;
  if(fld && fld.id===8 && !fld.used){
    const opts=pl.deck.filter(isGZ).sort((a,b)=>projAtk(b)-projAtk(a));
    if(opts.length){ await A.casa(p,opts[0],fld); if(!await pause(800)) return; }
  }
  // 1b) Pastelaria Ma Mei
  c=hand(27);
  if(c && !P(0).field && !pl.field){ await A.field(p,c); if(!await pause(800)) return; }
  const f2=P(0).field||P(1).field;
  if(f2 && f2.id===27 && !f2.used){
    const opts=pl.deck.filter(isMaMei).sort((a,b)=>(b.def.kind==='char'?atkOf(p,b):0)-(a.def.kind==='char'?atkOf(p,a):0));
    if(opts.length){ await A.casa(p,opts[0],f2); if(!await pause(800)) return; }
  }
  // 1c) Taishizu: busca Da Shui Long
  const ts=chars(p).find(x=>x.id===35&&!x.used);
  if(ts){ const r=pl.deck.find(x=>x.id===29)||pl.deck.find(isDSL); if(r){ await A.taishizu(p,ts,r); if(!await pause(800)) return; } }
  // 2) Bulma -> Radar -> Esferas
  c=hand(10);
  if(c && freeP() && pl.deck.some(x=>x.id===13)){ A.support(p,c); if(!await pause(800)) return; }
  const bu=pl.powers.find(x=>x&&x.id===10&&!x.used);
  if(bu && pl.deck.some(x=>x.id===13)){ await A.bulma(p,bu); if(!await pause(800)) return; }
  c=hand(13);
  if(c && supports(p).some(x=>x.id===10)){ const e=pl.deck.find(x=>x.id===14)||pl.void.find(x=>x.id===14); if(e){ await A.radar(p,c,e); if(!await pause(800)) return; } }
  // 2b) Senhor Kaioh
  c=hand(18);
  if(c && freeP() && chars(p).some(x=>x.id===1)){ A.support(p,c); if(!await pause(700)) return; }
  const ka=pl.powers.find(x=>x&&x.id===18&&!x.used);
  if(ka && chars(p).some(x=>x.id===1)){
    const want = (!hand(17) && chars(p).some(x=>x.id===1&&!x.equips.length)) ? 17 : (!hand(19) && (hand(17)||chars(p).some(x=>x.equips.length))) ? 19 : 15;
    const pick = pl.deck.find(x=>x.id===want) || pl.deck.find(x=>x.id===17||x.id===19||x.id===15);
    if(pick){ await A.kaioh(p,ka,pick); if(!await pause(800)) return; }
  }
  // 3) Caminho da serpente (traz Goku do vazio)
  c=hand(15);
  if(c && pl.void.some(x=>x.id===1) && freeC()){ await A.caminho(p,c); if(!await pause(900)) return; }
  // 4) Invocar Personagens
  if(!await summonAll()) return;
  // 5) Esferas do dragão: busca o melhor Personagem se ainda houver espaço
  c=hand(14);
  if(c && !pl.esf && freeC()){
    const cand=[...pl.deck,...pl.void].filter(x=>x.def.kind==='char'&&x!==c).sort((a,b)=>projAtk(b)-projAtk(a))[0];
    if(cand){ await A.esferas(p,c,cand); if(!await pause(900)) return; if(!await summonAll()) return; }
  }
  c=hand(15);
  if(c && pl.void.some(x=>x.id===1) && freeC()){ await A.caminho(p,c); if(!await pause(900)) return; }
  // 5b) Nainai Ma Mei
  c=hand(26);
  if(c && freeP() && chars(p).some(isMaMei)){ A.support(p,c); if(!await pause(700)) return; }
  const nn=pl.powers.find(x=>x&&x.id===26&&!x.used);
  if(nn && chars(p).some(isMaMei)){ await A.nainai(p,nn); if(!await pause(800)) return; }
  // 5c) Da Shui Long / Zhi Gui
  c=hand(28);
  if(c && chars(p).some(x=>x.def.dslzg) && pl.void.some(x=>x.id===29)){ const t=P(q).void.find(x=>x.def.kind!=='char'); if(t){ await A.dslzg(p,c,t); if(!await pause(900)) return; } }
  c=hand(29);
  if(c && chars(p).some(x=>x.def.dsl) && oppPowers(q).length>=1){ await A.dsl(p,c); if(!await pause(900)) return; }
  // 6) Semente
  c=hand(11);
  if(c && chars(p).length && pl.life<=2500){ await A.semente(p,c); if(!await pause(900)) return; }
  // 6b) Kamehameha: destrói o Personagem mais forte com até 2000 de ATQ
  c=hand(20);
  if(c && chars(p).some(x=>x.def.kame)){ const t=itemTargets(q,chars(q)).filter(x=>atkOf(q,x)<=2000&&!(x.id===32&&!x.imm)).sort((a,b)=>atkOf(q,b)-atkOf(q,a))[0]; if(t){ await A.kame(p,c,t); if(!await pause(900)) return; } }
  // 7) Disparo de Ki
  c=hand(12);
  if(c && chars(p).length && supports(q).length){ await A.disparo(p,c,supports(q)[0]); if(!await pause(900)) return; }
  // 7b) efeitos de fogo: Blaze Baller, Napoleão, Muhriqa
  for(const x of chars(p)){ if(G.over) return;
    if(x.id===39 && !x.used){ await A.dmgFx(p,x,400,'Segura aí!'); if(G.over||!await pause(800)) return; }
    if(x.id===41 && !x.used && chars(q).length){ await A.dmgFx(p,x,300*chars(q).length,'Super Esferas Flamejantes do Todo Poderoso Napoleão!'); if(G.over||!await pause(800)) return; }
    if(x.id===40 && !x.used && P(q).hand.length){ await A.muhriqa(p,x); if(!await pause(800)) return; } }
  // 8) Zé do Trovão: busca e equipa o Cajado
  const zz=chars(p).find(x=>x.id===21&&!x.used);
  if(zz && !hand(22) && pl.deck.some(x=>x.id===22)){ await A.ze(p,zz,pl.deck.find(x=>x.id===22)); if(!await pause(800)) return; }
  c=hand(22);
  const zt=chars(p).filter(x=>canEquip({id:22},x)).sort((a,b)=>atkOf(p,b)-atkOf(p,a))[0];
  if(c && zt){ await A.tool(p,c,zt); if(!await pause(900)) return; }
  // 8b) Fios invisíveis: dano igual ao ATQ do alvo (pega o maior até 1000)
  c=hand(24);
  if(c && chars(p).some(x=>x.def.fios)){ const t=itemTargets(q,chars(q)).filter(x=>atkOf(q,x)<=1000&&!(x.id===32&&!x.imm)).sort((a,b)=>atkOf(q,b)-atkOf(q,a))[0]; if(t){ await A.fios(p,c,t); if(G.over||!await pause(900)) return; } }
  // 8c) Troca de Marionetes: troca o meu mais fraco pelo mais forte dele, se valer a pena
  c=hand(25);
  if(c && chars(p).some(x=>x.def.troca) && chars(q).length){
    const mine=chars(p).filter(x=>!x.def.troca||chars(p).filter(y=>y.def.troca).length>1).sort((a,b)=>atkOf(p,a)-atkOf(p,b))[0];
    const theirs=itemTargets(q,chars(q)).filter(x=>!(x.id===32&&!x.imm)).sort((a,b)=>atkOf(q,b)-atkOf(q,a))[0];
    if(mine && theirs && atkOf(q,theirs)>atkOf(p,mine)+200){ await A.troca(p,c,mine,theirs); if(!await pause(900)) return; }
  }
  // 9) Kaioken
  c=hand(17);
  const goku=chars(p).filter(x=>x.id===1&&x.equips.length<2).sort((a,b)=>atkOf(p,b)-atkOf(p,a))[0];
  if(c && goku){
    const strongest=Math.max(0,...chars(q).map(t=>atkOf(q,t)));
    if(chars(q).length===0 || atkOf(p,goku)+400>strongest){ await A.tool(p,c,goku); if(!await pause(900)) return; }
  }
  // 10) Autoescola: só se transformar um ataque perdedor em vencedor
  c=hand(16);
  const ag=chars(p).find(x=>x.id===1&&!x.attacked), ap=chars(p).find(x=>x.id===3&&!x.attacked);
  if(c && ag && ap && canAttack(p) && chars(q).length){
    const avg=Math.round((atkOf(p,ag)+atkOf(p,ap))/2), top=Math.max(...chars(q).map(bDef));
    if(avg>top && Math.min(atkOf(p,ag),atkOf(p,ap))<=top){ await A.auto(p,c,ag,ap); if(!await pause(900)) return; }
  }
  // 9b) Kaioken aumentado 4x: só se virar um ataque vencedor ou for letal
  c=hand(19);
  const gk=chars(p).find(x=>x.id===1&&x.equips.some(k=>k.id===17)&&!x.attacked&&!x.doom);
  if(c && gk && canAttack(p)){
    const now=atkOf(p,gk), tg=chars(q);
    const lethal = !tg.length && now<ql.life && now+1000>=ql.life;
    const turns  = tg.length && !tg.some(t=>bDef(t)<now) && tg.some(t=>bDef(t)<now+1000);
    if(lethal||turns){ await A.kaio4(p,c,gk); if(!await pause(900)) return; }
  }
  // 10b) Irmãos Ma Mei: o mais forte dos três ataca direto
  c=hand(30);
  if(c && canAttack(p) && [31,32,36].every(id=>chars(p).some(x=>x.id===id))){
    const b=chars(p).filter(x=>[31,32,36].includes(x.id)&&!x.attacked).sort((a,b)=>atkOf(p,b)-atkOf(p,a))[0];
    if(b && chars(q).length){ await A.irmaos(p,c,b); if(!await pause(900)) return; }
  }
  // 11) Yajirobe (item)
  c=hand(9);
  if(c && canAttack(p) && pl.life<=500 && chars(p).length===1 && !chars(p)[0].attacked){ await A.yaji(p,c); if(!await pause(900)) return; }
  // 12) Piccolo (ataque direto) só se for letal ou ajudar muito
  const picc=chars(p).find(x=>x.id===3&&!x.used&&!x.attacked), g2=chars(p).filter(x=>x.id===1).sort((a,b)=>atkOf(p,a)-atkOf(p,b))[0];
  if(picc && g2 && canAttack(p)){
    const pa=atkOf(p,picc), tg=chars(q);
    if(pa>=ql.life || (ql.life<=pa*2 && tg.length && tg.every(t=>bDef(t)>=pa))){ await A.picc(p,picc,g2); if(!await pause(900)) return; }
  }
  // 13) Ataques
  if(pl.chars.some(c=>c&&canAtk(p,c))){
    await goAttack(p); if(G.over) return;
    const skipped=new Set();
    while(!G.over){
      const atts=pl.chars.filter(x=>x&&!x.attacked&&!skipped.has(x.uid)&&canAtk(p,x)).sort((a,b)=>atkOf(p,b)-atkOf(p,a));
      if(!atts.length) break;
      const a=atts[0], tg=atkTargets(q);
      let choice=null;
      if(!tg.length) choice={direct:true};
      else if(canDirect(a) && (atkOf(p,a)>=ql.life || !tg.some(t=>wins(a,t)))) choice={direct:true};
      else {
        const w=tg.filter(t=>wins(a,t)||(ties(a,t)&&a.doom)).sort((x,y)=>bDef(y)-bDef(x));

      await doAttack(p,a,choice.direct?null:choice.target);
      if(G.over) return;
      await sleep(350);
    }
  }
  if(G.over) return;
  await sleep(400);
  await finalPhase(1);
}

const DV={q:'', fav:null, stars:new Set(), cat:new Set(), el:new Set(), arq:new Set(), sort:'padrao'};
const SORTS=[{k:'padrao',n:'Padrão'},{k:'nome',n:'Nome (A-Z)'},{k:'rar_d',n:'Raridade ↓'},{k:'rar_a',n:'Raridade ↑'},{k:'atk_d',n:'ATQ alto → baixo'},{k:'atk_a',n:'ATQ baixo → alto'}];
const CATS=[['char','Personagem'],['poder','Poder'],['field','Campo'],['support','Apoiador'],['tool','Ferramenta'],['item','Item']];
const ALLARQ=()=>[...new Set(Object.values(DEFS).flatMap(d=>d.arq||[]))];
const UNI={stars:()=>[1,2,3,4,5], cat:()=>CATS.map(c=>c[0]), el:()=>Object.keys(ELEM), arq:ALLARQ};
const act=(v,k)=> v[k].size>0 && !UNI[k]().every(x=>v[k].has(x));   // "Tudo" marcado = sem restrição
const filterCount=v=>(v.q?1:0)+(v.fav?1:0)+['stars','cat','el','arq'].reduce((t,k)=>t+(act(v,k)?v[k].size:0),0);
function deckView(v){
  const q=v.q.trim().toLowerCase(), F=favs(), st=d=>STARS[d.id]||1, nm=(a,b)=>a.name.localeCompare(b.name,'pt');
  let L=Object.values(DEFS).filter(d=>{
    if(q && !d.name.toLowerCase().includes(q)) return false;
    if(v.fav==='fav' && !F.includes(d.id)) return false;
    if(v.fav==='nfav' && F.includes(d.id)) return false;
    if(act(v,'stars') && !v.stars.has(st(d))) return false;
    if(act(v,'cat') && !(v.cat.has(d.kind) || (d.kind!=='char' && v.cat.has('poder')))) return false;
    if(act(v,'el') && !v.el.has(d.el)) return false;
    if(act(v,'arq') && !(d.arq||[]).some(a=>v.arq.has(a))) return false;
    return true;
  });
  const atk=d=>d.kind==='char'?d.atk:-1;
  const cmp={padrao:(a,b)=>st(a)-st(b)||nm(a,b), nome:nm, rar_d:(a,b)=>st(b)-st(a)||nm(a,b), rar_a:(a,b)=>st(a)-st(b)||nm(a,b),
             atk_d:(a,b)=>atk(b)-atk(a)||nm(a,b), atk_a:(a,b)=>(a.kind==='char'?0:1)-(b.kind==='char'?0:1)||atk(a)-atk(b)||nm(a,b)}[v.sort];
  return L.sort(cmp);
}

    let act;
    if(g.claimed) act=el('div','mstat','✓ Resgatado');
    else if(ACC.user){ act=btn('Resgatar','',async()=>{ act.disabled=true;
        const {data,error}=await SB.rpc('claim_gift',{p_id:g.id});
        if(error||!data||!data.ok){ toast(data&&data.reason==='resgatado'?'Você já resgatou este presente.':'Não foi possível resgatar agora.'); act.disabled=false; return; }
        gotReward(data, act, giftsScreen); }); }
    else act=el('div','mstat','Entre para resgatar');
    row.appendChild(act); list.appendChild(row);
  });
}
function startFlow(){
  const err=validDeck(loadDeck());
  if(err){ toast('Baralho inválido: '+err); deckScreen(); return; }
  if(!history.state || history.state.s!=='game') nav('game');
  rps();
}
function rps(msg){
  const s=el('div','scr');
  s.appendChild(el('h2','','QUEM COMEÇA?'));
  s.appendChild(el('div','big',msg||'Pedra, papel ou tesoura!'));
  const row=el('div','row'); row.style.marginTop='40px';
  const opts=[['✊','pedra'],['✋','papel'],['✌️','tesoura']];
  const res=el('div','big'); res.style.fontSize='80px';
  opts.forEach(([ic,nm],i)=>{
    row.appendChild(btn(ic,'rpsb',async()=>{
      const bot=Math.floor(Math.random()*3);
      row.querySelectorAll('button').forEach(b=>b.disabled=true);
      res.innerHTML=`Você ${opts[i][0]} × ${opts[bot][0]} Oponente`;
      await sleep(900);
      if(i===bot){ rps('Empate! Jogue de novo.'); return; }
      const win=(i-bot+3)%3===1;
      res.innerHTML+=`<div style="margin-top:30px;color:${win?'#2ee66b':'#e60012'}">${win?'Você começa!':'O oponente começa!'}</div>`;
      await sleep(1300);
      beginMatch(win?0:1);
    }));
  });
  s.appendChild(row); s.appendChild(res);
  setScreen(s);
}

titleScreen();
/* ---- aviso de nova versão: confere o version.json do servidor de tempos em tempos ---- */
(function(){
  const box=document.createElement('div'); box.id='upd'; $('#stage').appendChild(box);
  let found=null;
  const show=v=>{ found=v; box.innerHTML='Nova versão disponível — toque para atualizar'+(G&&!G.over?'<small>A partida atual será encerrada.</small>':''); box.classList.add('on'); };
  box.onclick=()=>{ if(found) location.replace(location.pathname+'?v='+encodeURIComponent(found)); };
  async function check(){
    if(location.protocol==='file:' || APP_VER.startsWith('__')) return;   // aberto direto do computador: sem servidor para conferir
    try{ const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return; const j=await r.json();
      if(j && j.v && j.v!==APP_VER) show(j.v); }catch(e){}
  }
  setTimeout(check,2500); setInterval(check,60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) check(); });
  // iPhone/iPad: ao voltar para o Safari ou abrir pelo ícone da tela inicial, nem sempre dispara o evento acima
  addEventListener('pageshow',()=>check()); addEventListener('focus',()=>check()); addEventListener('online',()=>check());
  addEventListener('pointerdown',()=>{ const t=Date.now(); if(t-(window.__updLast||0)>30000){ window.__updLast=t; check(); } },{passive:true});
  window.__updCheck=check;
})();
window.__AMV = {get G(){return G;}, render, startTurn, A, doAttack, atkOf, actionsFor, chaosFx, afterBattle, finalPhase, goAttack, endTurnHuman, searchList, atkTargets, clashVals, endGame, levelInfo};   // útil para depurar
})();
</script>
